        def make_probe(horizon: int, gate_seconds: int, step_pause_ms: int) -> str:
            if not 1 <= horizon <= 1000: raise ValueError('horizon must be 1-1000')
            if not 15 <= gate_seconds <= 180: raise ValueError('gate must be 15-180 seconds')
            if not 0 <= step_pause_ms <= 100: raise ValueError('step pause must be 0-100 ms')
            return (PROBE_TEMPLATE.replace('__HORIZON__',str(horizon))
                    .replace('__GATE_MS__',str(gate_seconds*1000))

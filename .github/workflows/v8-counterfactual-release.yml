    - name: Embed memory-documentation.md [1/1]
      shell: bash
      run: |
        set -Eeuo pipefail
        cat > "$BUNDLE_DIR/memory-documentation.md" <<'MEMORY8_MEMORY_DOCUMENTATION_MD_1'
        # Memory-8 additions

        The dashboard starts before CRIU installation. Public live access uses an optional temporary, read-only Cloudflare Quick Tunnel. No raw CRIU pages, environment or process-control endpoints are served.

        Mandatory memory manifest references every recorded frame. Exact memory means all 16,384 bytes of the instrumented uint32 array, checked against an independent Python oracle at every step. Native RSS/PSS and virtual mappings are independently sampled metadata, not a full process-memory snapshot.

        Every step includes an optional deliberate pause (default 25 ms). Observer overhead is not separated from run time; do not compare this timing against an uninstrumented agent.

        The tunnel uses a release resolved during the run; its release tag, URL and GitHub-provided SHA256 digest are recorded and verified before execution. It is not pinned across runs. A failed tunnel is reported as unavailable; it cannot turn an experiment failure into success. The local HTTP server and downloadable final site remain available.

        Primary sources checked:
        - https://docs.github.com/en/pages/getting-started-with-github-pages/what-is-github-pages (static hosting, not a persistent backend)
        - https://docs.github.com/en/pages/getting-started-with-github-pages/using-custom-workflows-with-github-pages (artifact/deployment permissions)
        - https://developers.cloudflare.com/tunnel/get-started/quick-tunnels/ (temporary URL, public access, no uptime guarantee, no SSE; this viewer polls)
        - https://docs.kernel.org/filesystems/proc.html (permissions, maps, smaps_rollup, non-atomic live observations)

        Replay includes controlled synthetic post-restore branches on the same host; it is not yet semantic agent branching, deterministic clock replay, mitigation treatment, or complete V8/JIT/register equality. The external namespace and branch-control file are retained external state rather than rolled back.
        MEMORY8_MEMORY_DOCUMENTATION_MD_1

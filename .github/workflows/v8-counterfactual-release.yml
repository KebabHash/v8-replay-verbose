            def test_control_endpoint_never_generated(self):
                self.assertNotIn('Docker',json.dumps(b.load(b.private_root()/'target.json')))
            def test_no_raw_argv_in_public_event(self):
                b.event('test',argv=['token','secret'],message='safe');text=(b.public_root()/'events.log').read_text();self.assertNotIn('secret',text)
            def test_cold_target_not_monitored(self):
                b.register_target('v8-cold-'+'a'*12,'/challenge/d8');self.assertIsNone(b.load(b.private_root()/'target.json')['target'])
            def test_explicit_target_registered(self):
                name='v8-extended-'+'a'*12;b.register_target(name,'/challenge/d8');self.assertEqual(b.load(b.private_root()/'target.json')['target'],name)
            def test_proc_rejects_pid_zero(self):
                with self.assertRaises(ValueError):proc.collect('0','a'*64,'d8')
            def test_proc_rejects_container_id_injection(self):
                with self.assertRaises(ValueError):proc.collect('12','../etc','d8')
            def test_proc_rejects_unrelated_binary(self):
                with self.assertRaises(ValueError):proc.collect('12','a'*64,'bash')
            def test_parse_mapping_large_addresses(self):
                r=proc.parse_maps('7ffff0000000-7ffff0002000 rw-p 00000000 00:00 0 [anon]\n')[0]
                self.assertEqual(r['bytes'],8192);self.assertEqual(r['start'],'7ffff0000000')
            def test_map_path_redacted(self):

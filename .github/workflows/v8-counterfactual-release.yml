            def test_kb_units(self):self.assertEqual(proc.kb_fields('Rss: 10 kB\nThreads: 7\n'),{'Rss':10240,'Threads':7})
            def test_large_parent_compacted(self):
                report={'version':'replay-memory-8','status':'passed','trials':[{'trial':i,'status':'passed','checkpoint':'extended-base','resume':{'heap_words':[0]*4096},'final':{'heap_words':[0]*4096}} for i in range(12)],'gate':{'filler':'a'*3000000}}
                root=self.root/'evidence';(root/'extended-replay').mkdir(parents=True);(root/'extended-replay/report.json').write_text(json.dumps(report))

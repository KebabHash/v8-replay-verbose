            def test_missing_capture_fails(self):self.assertEqual(b.coverage(b.public_root(),1,2)['status'],'failed')
            def test_false_trial_never_passes(self):
                self.fill();b.finish_trial(1,{},.3,status='failed');self.assertEqual(b.coverage(b.public_root(),1,2)['status'],'failed')
            def test_out_of_order_arrival_sorted(self):
                b.captured(self.g,'extended-base','a'*64);b.begin_trial(1,'extended-base','a'*64)
                for s in reversed(self.es):b.observation(1,s)

                elif label == 'netns-keeper-cleanup': self.keeper_removed=True
                elif label != 'netns-keeper-start':
                    raise AssertionError('Unmocked command: '+label+' '+repr(argv))
                if required and rc: raise RuntimeError(err)
                return rc,out,err


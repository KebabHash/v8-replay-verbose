        """Publish a static evidence site plus comprehensive downloadable log files.
        No environment dump, token, raw checkpoint .img, symlink, or runnable backend.
        """
        from __future__ import annotations
        import datetime
        import gzip
        import hashlib
        import html
        import json
        import os
        from pathlib import Path
        import shutil
        import sys
        import zipfile
        from report_tools import aggregate

        GENERATED={'full-run.log','full-run.log.gz','evidence-logs.zip','downloads.json','pages-build.json','pages-builder.log','artifact-manifest.json'}
        TEXT_SUFFIXES={'.log','.txt','.jsonl'}
        REPORT_SUFFIXES=TEXT_SUFFIXES|{'.json','.md','.py','.sh','.js'}


        def safe_file(root,p):
            try:
                rel=p.relative_to(root)
                return p.is_file() and not p.is_symlink() and not any((root/Path(*rel.parts[:i])).is_symlink() for i in range(1,len(rel.parts)))
            except (OSError,ValueError):return False


        def selected(root,suffixes):
            return [p for p in sorted(root.rglob('*')) if safe_file(root,p) and 'memory-atlas' not in p.relative_to(root).parts and p.name not in GENERATED and p.suffix.lower() in suffixes and p.name!='trajectory-bundle.json']


        def sha256(path):
            h=hashlib.sha256()
            with path.open('rb') as f:
                while chunk:=f.read(1048576):h.update(chunk)
            return h.hexdigest()


        def build(root,site):
            root,site=Path(root).resolve(),Path(site).resolve()
            if root==site or root in site.parents:raise ValueError('Site must be outside evidence to prevent recursive packaging')
            root.mkdir(parents=True,exist_ok=True);site.mkdir(parents=True,exist_ok=True)
            status=aggregate()
            # Prefer a compact status.json: no full state arrays needed on the landing page.
            slim={k:v for k,v in status.items() if k!='stages'}
            slim['stages']={name:{k:r[k] for k in ('status','failed_stage','exception','error','cleanup_error') if k in r} for name,r in status['stages'].items()}
            (root/'status.json').write_text(json.dumps(slim,indent=2)+'\n')
            log_paths=selected(root,TEXT_SUFFIXES)
            with (root/'full-run.log').open('w',encoding='utf-8') as f:
                f.write('V8 Checkpoint Atlas / memory-8\n')
                f.write('Run: '+str(os.environ.get('GITHUB_RUN_ID','unknown'))+'\n')
                f.write('Scope: captured workflow command logs, not GitHub service-side action internals or later deployment logs.\n')
                f.write('Grouped by source file; timestamps within files establish event order. Duplicate console/command observations are retained.\n')
                f.write(json.dumps(slim,indent=2)+'\n')
                for p in log_paths:
                    f.write('\n'+'='*100+'\nFILE: '+p.relative_to(root).as_posix()+'\n'+'='*100+'\n')
                    with p.open('r',encoding='utf-8',errors='replace') as source:
                        while chunk:=source.read(1048576):f.write(chunk)
                    f.write('\n')
            with (root/'full-run.log').open('rb') as src,gzip.open(root/'full-run.log.gz','wb',compresslevel=6) as dst:shutil.copyfileobj(src,dst,1048576)
            files=selected(root,REPORT_SUFFIXES)
            with zipfile.ZipFile(root/'evidence-logs.zip','w',zipfile.ZIP_DEFLATED,compresslevel=6) as z:
                for p in files:z.write(p,p.relative_to(root).as_posix())
            downloads=[]
            for name in ('full-run.log','full-run.log.gz','evidence-logs.zip','status.json'):
                p=root/name
                if name=='full-run.log' and p.stat().st_size>64*1024*1024:
                    print('PAGES: uncompressed log exceeds 64 MiB; .log.gz is downloadable, original .log remains in Actions evidence',flush=True)
                    continue
                shutil.copyfile(p,site/name)
                downloads.append({'name':name,'bytes':p.stat().st_size,'sha256':sha256(p)})
            viewer=root/'trajectory-explorer.html'
            has_viewer=safe_file(root,viewer)
            if has_viewer:shutil.copyfile(viewer,site/viewer.name)
            missing_html='' if has_viewer else '<p><strong>Viewer unavailable; use downloadable logs for the exact failure.</strong></p>'
            outcome='PASS for this finite probe' if status['passed'] else 'FAILED or incomplete experiment'
            rows=''.join('<tr><td>'+html.escape(n)+'</td><td>'+html.escape(str(r.get('status','unknown')))+'</td><td>'+html.escape(str(r.get('exception',r.get('error',r.get('failed_stage','')))))+'</td></tr>' for n,r in slim['stages'].items())
            run=html.escape(str(os.environ.get('GITHUB_RUN_ID','unknown')))
            links=''.join('<li><a download href="'+x['name']+'">'+x['name']+'</a> ('+str(x['bytes'])+' bytes)<br><code>'+x['sha256']+'</code></li>' for x in downloads)
            explorer='<p><a class="button" href="trajectory-explorer.html">Open interactive trajectory explorer</a></p>' if has_viewer else ''
            text='''<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>V8 Checkpoint Atlas</title><style>
        body{font:16px system-ui;max-width:1050px;margin:3rem auto;padding:0 1rem;background:#111b2a;color:#e8eef7;line-height:1.55}a{color:#72e2cb}code{font-size:12px;overflow-wrap:anywhere}table{border-collapse:collapse;width:100%}td,th{padding:.65rem;text-align:left;border-bottom:1px solid #344056;overflow-wrap:anywhere}li{margin:1rem 0}.button{display:inline-block;border:1px solid #72e2cb;padding:.6rem 1rem;border-radius:.5rem}small{color:#a8b6cb}</style></head><body><h1>V8 Checkpoint Atlas</h1>'''
            text+='<h2>'+outcome+'</h2><p>Run '+run+' / workflow memory-8</p>'+explorer+missing_html
            text+='<h2>Download logs</h2><ul>'+links+'</ul><h2>Experiment stages</h2><table><tr><th>Stage</th><th>Status</th><th>Detail</th></tr>'+rows+'</table>'
            text+='<p><strong>Static evidence only.</strong> Playback and rewind navigate saved observations; no live Docker or CRIU backend is exposed. Same-input replay is not an agent/mitigation counterfactual experiment.</p><small>Logs may disclose environment details. Pages deployment success and experiment success are separate results.</small></body></html>'
            (site/'index.html').write_text(text,encoding='utf-8');(site/'.nojekyll').touch()
            # Small required manifest + explicit frame files, never a giant optional JSON embed.
            memory=root/'memory-atlas'
            if (memory/'manifest.json').is_file():
                shutil.copyfile(site/'index.html',site/'run-summary.html')
                shutil.copytree(memory,site,dirs_exist_ok=True)
                for name in ('memory-data.zip','memory-fidelity.json'):
                    src=root/name
                    if src.is_file():
                        shutil.copyfile(src,site/name)
                        downloads.append({'name':name,'bytes':src.stat().st_size,'sha256':sha256(src)})
                downloads.append({'name':'run-summary.html','bytes':(site/'run-summary.html').stat().st_size,'sha256':sha256(site/'run-summary.html')})
                if has_viewer:downloads.append({'name':'trajectory-explorer.html','bytes':viewer.stat().st_size,'sha256':sha256(viewer)})
            (root/'downloads.json').write_text(json.dumps(downloads,indent=2)+'\n');shutil.copyfile(root/'downloads.json',site/'downloads.json')
            total=sum(p.stat().st_size for p in site.rglob('*') if p.is_file())
            if total>900*1024*1024:raise RuntimeError('Static site exceeds configured 900 MiB limit; raw diagnostics remain in evidence')
            result={'status':'passed','site':str(site),'experiment_passed':status['passed'],'viewer_present':has_viewer,
                'included_log_files':len(log_paths),'archive_files':len(files),'site_bytes':total,'downloads':downloads,
                'raw_criu_memory_included':False,'static_only':True}
            (root/'pages-build.json').write_text(json.dumps(result,indent=2)+'\n');print(json.dumps(result,indent=2),flush=True)
            return result

        if __name__=='__main__':
            root=Path(os.environ['EVIDENCE_DIR']);site=Path(os.environ['GITHUB_WORKSPACE'])/'pages-site'
            try:build(root,site)
            except Exception as exc:
                root.mkdir(parents=True,exist_ok=True);(root/'pages-build.json').write_text(json.dumps({'status':'failed','exception':repr(exc)},indent=2)+'\n');raise
        MEMORY8_BUILD_PAGES_PY_1

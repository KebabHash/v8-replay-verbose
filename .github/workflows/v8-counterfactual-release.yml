                        self.run("checkpoint-restore", ["docker", "start", "--checkpoint", checkpoint, container], timeout=180, required=True)
                        row['restore_s'] = time.monotonic() - start
                        row['restore_status'] = 'command_succeeded'
                        self.require(f"round {number}: running after restore", self.state(container).get("Running") is True)
                        self.stage = 'restored_namespace_verification'
                        guard.verify(f'round-{number}-restored', container)
                        row['restore_status'] = 'passed'
                        self.stage = "fidelity"
                        row['fidelity_status'] = 'checking'
                        resumed, _ = self.wait_event(container, lambda e: e.get("event") == "resumed" and e.get("ticket") == ticket, prefix=baseline)
                        _, after = self.wait_event(container, lambda e: e.get("event") == "tick" and e.get("tick", -1) > paused["tick"], prefix=baseline)
                        running = self.state(container).get("Running") is True
                        checks = continuity_checks(paused, baseline, after, ticket, running)
                        row.update(checks=checks,resumed=resumed)
                        (self.root / f"round-{number}-resumed.log").write_text(after)
                        # Emit explicit observed values, not a success label without evidence.
                        for key in ('token','tick','digest','hot','words'):
                            self.say(f"FIDELITY {key} | before={paused.get(key)!r} | after={resumed.get(key)!r}")
                        bad = [i for i,(a,b) in enumerate(zip(paused.get('heap_words',[]),resumed.get('heap_words',[]))) if a != b]
                        self.say(f"FIDELITY probe words | compared={len(paused.get('heap_words',[]))} | mismatching_indices={bad}")
                        for key, value in checks.items():
                            self.require(f"round {number}: {key}", value)
                        row['fidelity_status'] = 'passed'
                        self.resource_snapshot(container,'restored-'+str(number))
                        # Independent repeated restores of the SAME checkpoint, not new dumps.
                        # Run only after the last normal round; each trial must preserve
                        # the checkpoint's original paused state and then advance.
                        if number == rounds and not getattr(self, '_mock_disable_repeats', False):
                            self.stage = 'repeat_restore_fidelity'
                            row['repeat_restores'] = []
                            for trial in range(1, 4):
                                previous_logs = self.logs(container)
                                self.run('stop-prior-branch', ['docker', 'kill', container], required=True)
                                self.require('branch stopped before restore', self.state(container).get('Running') is False)
                                guard.verify(f'branch-{trial}-stopped')
                                start_trial = time.monotonic()
                                self.run('repeat-restore-from-same-checkpoint',
                                         ['docker', 'start', '--checkpoint', checkpoint, container], timeout=180, required=True)
                                elapsed = time.monotonic() - start_trial
                                guard.verify(f'branch-{trial}-restored', container)
                                _, branch_logs = self.wait_event(container,
                                    lambda e: e.get('event') == 'tick' and e.get('token') == paused['token']
                                    and type(e.get('tick')) is int and e['tick'] > paused['tick'],
                                    prefix=previous_logs, timeout=45)
                                trial_checks = continuity_checks(paused, previous_logs, branch_logs,
                                                                 ticket, self.state(container).get('Running') is True)
                                for test_name, passed in trial_checks.items():
                                    self.require(f'branch {trial}: {test_name}', passed)
                                branch_delta = branch_logs[len(previous_logs):]
                                branch_events = marker_events(branch_delta)
                                branch_resume = next(e for e in branch_events
                                    if e.get('event') == 'resumed' and e.get('ticket') == ticket)
                                row['repeat_restores'].append({
                                    'trial': trial, 'restore_s': elapsed, 'checks': trial_checks,
                                    'resume': branch_resume, 'new_log_sha256': hashlib.sha256(branch_delta.encode()).hexdigest(),
                                    'same_original_checkpoint': checkpoint,
                                    'observation': 'Process state replay; post-resume wall clock and scheduling are not deterministic'})
                                (self.root / f'branch-{trial}-events.json').write_text(
                                    json.dumps(branch_events, indent=2) + '\n')
                                self.say('REPEAT RESTORE RESULT | ' + json.dumps({
                                    'trial':trial, 'checkpoint':checkpoint, 'restore_s':elapsed,
                                    'exact_probe_words':trial_checks['all_4096_probe_words_exact'],
                                    'execution_advances':trial_checks['execution_advances_after_resume']}))
                            self.stage = 'fidelity'

                    self.report["status"] = "passed"
                    self.stage = "complete"
                except Exception as exc:
                    self.report.update(status="failed", failed_stage=self.stage, exception=repr(exc))
                    if row is not None:
                        if row.get('capture_status') == 'attempting': row['capture_status'] = 'failed'
                        if row.get('restore_status') == 'attempting': row['restore_status'] = 'failed'
                        if row.get('fidelity_status') == 'checking': row['fidelity_status'] = 'failed'
                    if self.stage == 'restore':
                        self.report['restore_diagnosis'] = classify_restore_error(str(exc))
                    traceback.print_exc()
                    self.event("experiment_failed", error=repr(exc), diagnosis=self.report.get('restore_diagnosis'))
                finally:
                    if created:
                        try:
                            self.evidence_for_container(container, docker_root)
                            self.run("final-target-logs", ["docker", "logs", container])
                        except Exception as exc:
                            self.event("diagnostic_collection_failed", error=repr(exc))
                    if guard is not None:
                        self.report['external_dependencies'] = guard.description()
                        self.report['namespace_boundaries'] = guard.history
                        try:
                            # The target is removed first. Never release a live target's namespace fixture.
                            guard.close(container)
                        except Exception as exc:
                            self.report['cleanup_error'] = repr(exc)
                            self.event('cleanup_failed', error=repr(exc))
                            if self.report['status'] == 'passed':
                                self.report.update(status='failed', failed_stage='cleanup', exception=repr(exc))
                    elif created:
                        self.run("container-cleanup", ["docker", "rm", "-f", container])
                    self.report.update(finished_utc=self.now(), command_count=self.index)
                    (self.root / "report.json").write_text(json.dumps(self.report, indent=2) + "\n")
                    self.say("FINAL MACHINE-READABLE REPORT\n" + json.dumps(self.report, indent=2))
                    # Keep the actionable result visible AFTER the intentionally large array dump.
                    self.say('FINAL RESULT | revision=repair-6 | status=' + self.report['status'] +
                             ' | stage=' + self.report.get('failed_stage', self.stage))
                    for item in self.report.get('rounds', []):
                        self.say('ROUND RESULT | ' + json.dumps({k:item.get(k, 'not_reached') for k in
                            ('round','capture_status','restore_status','fidelity_status','dump_s','restore_s')}, sort_keys=True))
                    if self.report.get('exception'): self.say('FINAL ERROR | ' + self.report['exception'])
                return 0 if self.report["status"] == "passed" else 1


        def merged_daemon_config(config):
            import copy
            if not isinstance(config, dict):
                raise ValueError('Docker daemon configuration must be a JSON object')
            updated = copy.deepcopy(config)
            updated['experimental'] = True
            return updated


        def configure_daemon(root):
            audit = Audit(root)
            audit.stage = 'docker_configuration'
            result = {'status': 'failed', 'stage': 'docker_configuration'}
            try:
                config = Path('/etc/docker/daemon.json')
                original = config.read_text() if config.exists() else '{}\n'
                (audit.root / 'docker-daemon-before.json').write_text(original)
                merged = merged_daemon_config(json.loads(original))
                pending = audit.root / 'docker-daemon-requested.json'
                pending.write_text(json.dumps(merged, indent=2) + '\n')
                audit.run('daemon-config-validate', ['sudo', 'dockerd', '--validate', '--config-file', str(pending)], required=True)
                # This workflow is fixed to an ephemeral GitHub-hosted runner. Do not run
                # this service restart on a shared host with unrelated live containers.
                audit.run('docker-config-dir', ['sudo', 'mkdir', '-p', '/etc/docker'], required=True)
                audit.run('install-daemon-config', ['sudo', 'install', '-m', '0644', str(pending), str(config)], required=True)
                audit.run('restart-docker', ['sudo', 'systemctl', 'restart', 'docker'], timeout=120, required=True)
                audit.run('docker-version', ['docker', 'version'], required=True)
                audit.run('docker-info', ['docker', 'info'], required=True)
                _, enabled, _ = audit.run('docker-experimental', ['docker', 'info', '--format', '{{.ExperimentalBuild}}'], required=True)
                audit.require('server experimental mode enabled', enabled.strip().lower() == 'true')
                audit.run('checkpoint-help', ['docker', 'checkpoint', '--help'], required=True)
                audit.run('criu-version-as-root', ['sudo', '/usr/sbin/criu', '--version'], required=True)
                # Informative only: optional CRIU features can fail while this particular
                # workload remains checkpointable. The actual dump/restore is decisive.
                rc, _, _ = audit.run('criu-kernel-check', ['sudo', '/usr/sbin/criu', 'check', '-v4'], timeout=90)
                result.update(status='passed', criu_check_exit=rc,
                              note='A successful setup does not imply checkpoint feasibility.')
            except Exception as exc:
                traceback.print_exc()
                result['exception'] = repr(exc)
            finally:
                result['utc'] = audit.now()
                (audit.root / 'daemon-setup.json').write_text(json.dumps(result, indent=2) + '\n')
                print('DAEMON_SETUP_REPORT=' + json.dumps(result), flush=True)
            return 0 if result['status'] == 'passed' else 1


        if __name__ == "__main__":
            root = os.environ.get("EVIDENCE_DIR", "evidence")
            if len(sys.argv) > 1 and sys.argv[1] == 'daemon':
                sys.exit(configure_daemon(root))
            if len(sys.argv) > 3 and sys.argv[1] == 'stream':
                audit = Audit(root)
                audit.stage = sys.argv[2]
                sys.exit(audit.run(sys.argv[2],sys.argv[3:],timeout=int(os.environ.get('STEP_COMMAND_TIMEOUT','1800')))[0])
            sys.exit(Audit(root).main())
        MEMORY8_CHECKPOINT_PROBE_PY_3
    - name: Embed build_viewer.py [1/1]
      shell: bash
      run: |
        set -Eeuo pipefail
        cat > "$BUNDLE_DIR/build_viewer.py" <<'MEMORY8_BUILD_VIEWER_PY_1'
        #!/usr/bin/env python3
        """Build an offline HTML5 evidence viewer. Standard library only; never executes evidence.
        Usage: python3 build_trajectory_viewer.py EVIDENCE_DIRECTORY [OUTPUT_HTML]
        Memory images and symlinks are excluded. Original evidence is never modified.
        """
        import json
        import os
        from pathlib import Path
        import sys

        MAX_FILE = 2 * 1024 * 1024
        MAX_TOTAL = 32 * 1024 * 1024

        TEMPLATE = Path(__file__).with_name('viewer-template.html').read_text(encoding='utf-8')

        def compact_report(obj):
            if not isinstance(obj,dict):return obj
            result={k:v for k,v in obj.items() if k not in ('assertions','gate','checkpoint_manifest','negative_control')}
            result['assertions']=[{k:a.get(k) for k in ('name','passed','stage')} for a in obj.get('assertions',[])]
            if isinstance(obj.get('trials'),list):
                result['trials']=[{k:t.get(k) for k in ('trial','status','checkpoint','checkpoint_sha256','restore_s','checks','action')} for t in obj['trials']]
            result['embedding_note']='Compact index only; full original report retained in evidence. Exact memory frames are in memory-atlas.'
            return result


        def compact_trial(obj):
            result={'trial':{k:v for k,v in obj.get('trial',{}).items() if k not in ('resume','final')},'events':[]}
            for event in obj.get('events',[]):
                result['events'].append({k:v for k,v in event.items() if not (event.get('event')=='tick' and k in ('heap_words','graph'))})
            return result


        def collect_files(root, output):
            root, output = Path(root).resolve(), Path(output).resolve()
            root.mkdir(parents=True, exist_ok=True)
            files, omissions, total = [], [], 0
            priorities = {'report.json': 0, 'setup.json': 1, 'daemon-setup.json': 2,
                          'events.jsonl': 3, 'events.json': 4, 'results.json': 5, 'intervention-suite.json': 6, 'fidelity-matrix.json': 7}
            paths = sorted(root.rglob('*'), key=lambda p: (priorities.get(p.name, 8 if p.name.startswith('trial-') and p.suffix=='.json' else 10), str(p)))
            for p in paths:
                if not p.is_file() or p.is_symlink() or p.resolve() == output:
                    continue
                if p.suffix.lower() not in {'.json', '.jsonl', '.txt', '.log'}:
                    continue
                if p.name in {'trajectory-bundle.json', 'viewer-build.json'}:
                    continue
                name = p.relative_to(root).as_posix()
                if name.startswith('memory-atlas/'):
                    continue
                try:
                    # Mandatory trajectory indexes cannot be silently discarded because state arrays are large.
                    content=None
                    if p.name in ('report.json','intervention-suite.json'):
                        obj=json.loads(p.read_text())
                        if obj.get('version') in ('replay-repair-6','replay-memory-8'):
                            content=json.dumps(compact_report(obj),separators=(',',':'))
                    elif p.name.startswith('trial-') and p.suffix=='.json':
                        content=json.dumps(compact_trial(json.loads(p.read_text())),separators=(',',':'))
                    size=len(content.encode()) if content is not None else p.stat().st_size
                    if size > MAX_FILE or total + size > MAX_TOTAL:
                        omissions.append(f'{name}: not embedded (size budget); original file unchanged.')
                        print('OMIT '+omissions[-1],flush=True)
                        continue
                    if content is None:content = p.read_text(encoding='utf-8', errors='replace')
                    files.append({'name': name, 'text': content})
                    print(f'EMBED {name} | bytes={size}',flush=True)
                    total += size
                except OSError as exc:
                    omissions.append(f'{name}: unreadable: {exc}')
            embedded={f['name']:f['text'] for f in files};expected_replays=0
            for name,content in embedded.items():
                if name.endswith('/report.json'):
                    obj=json.loads(content)
                    if obj.get('version') in ('replay-repair-6','replay-memory-8'):
                        directory=name.rsplit('/',1)[0]+'/'
                        for trial in obj.get('trials',[]):
                            trial_name=directory+'trial-'+str(trial['trial']).zfill(3)+'.json'
                            if trial_name not in embedded:raise ValueError('Required replay lane evidence omitted: '+trial_name)
                            if not isinstance(json.loads(embedded[trial_name]).get('events'),list):raise ValueError('Malformed trial events: '+trial_name)
                            expected_replays+=1
            metadata = {k.lower(): os.environ[k] for k in ('GITHUB_RUN_ID', 'GITHUB_REPOSITORY',
                        'GITHUB_SHA', 'GITHUB_RUN_ATTEMPT', 'IMAGE') if k in os.environ}
            if 'github_run_id' in metadata:
                metadata['run_id'] = metadata['github_run_id']
            metadata.update(omissions=omissions, embedded_files=len(files), embedded_source_bytes=total,
                            control_mode='offline', raw_memory_included=False, expected_replay_lanes=expected_replays)
            return {'files': files, 'metadata': metadata}

        def render(payload):
            # Do not let an imported log terminate the inert JSON script element.
            data = json.dumps(payload, ensure_ascii=True).replace('<', '\\u003c').replace('>', '\\u003e').replace('&', '\\u0026')
            return TEMPLATE.replace('__EMBEDDED_EVIDENCE__', data)

        def main():
            if len(sys.argv) not in (2, 3):
                raise SystemExit('Usage: build_trajectory_viewer.py EVIDENCE_DIR [OUTPUT_HTML]')
            root = Path(sys.argv[1])
            output = Path(sys.argv[2]) if len(sys.argv) == 3 else root / 'trajectory-explorer.html'
            payload = collect_files(root, output)
            output.parent.mkdir(parents=True, exist_ok=True)
            output.write_text(render(payload), encoding='utf-8')
            report = {'status': 'passed', 'output': output.name, 'viewer_mode': 'offline_evidence_only',
                      'embedded_files': len(payload['files']), 'source_bytes': payload['metadata']['embedded_source_bytes'],
                      'omissions': payload['metadata']['omissions'], 'runtime_restore_supported': False,
                      'output_bytes': output.stat().st_size, 'no_external_assets': True, 'expected_replay_lanes': payload['metadata']['expected_replay_lanes']}
            (output.parent / 'viewer-build.json').write_text(json.dumps(report, indent=2) + '\n')
            print(json.dumps(report, indent=2))
            summary = os.environ.get('GITHUB_STEP_SUMMARY')
            if summary:
                with open(summary, 'a', encoding='utf-8') as f:
                    f.write('\n## Interactive trajectory explorer\n'
                            'Download the evidence artifact, extract it, and open `trajectory-explorer.html`. '
                            'Play and rewind inspect recorded events only. '
                            'No backend is connected; live process restoration is unavailable.\n')
            return 0

        if __name__ == '__main__':
            raise SystemExit(main())
        MEMORY8_BUILD_VIEWER_PY_1

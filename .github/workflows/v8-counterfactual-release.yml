        """Regression tests. Mocked Docker tests are explicitly not live CRIU tests."""
        import contextlib
        import copy
        import importlib
        import io
        import json
        import os
        from pathlib import Path
        import tempfile
        import time
        import unittest
        from unittest.mock import patch
        import zipfile
        import intervention_suite as x
        import build_pages as pages
        import report_tools as reports


        def fixture(horizon=2):
            gate={'event':'paused','token':'a'*64,'ticket':'a'*64+'-shared','tick':10,'hot':12,'words':4096,
                'heap_words':list(range(4096)), 'graph':{'values':[i*37 for i in range(32)],'labels':['test-'+str(i) for i in range(32)],'self':True,'alias':True,'map':True},
                'wasm':27,'deadline_ms':int(time.time()*1000)+60000,'capabilities':{'wasm':True,'gc':False}}
            gate['digest']=x.digest_words(gate['heap_words'])
            resume={**copy.deepcopy(gate),'event':'resumed','clock_ms':12345}
            ticks=[];cur=copy.deepcopy(gate)
            for i in range(horizon):
                o=x.reference_end(cur,1);cur.update({k:o[k] for k in ('heap_words','tick','hot','digest')});cur['graph']['values']=o['graph_values'];cur['wasm']=cur['tick']+17
                ticks.append({'event':'tick','token':cur['token'],'step':i+1,'tick':cur['tick'],'digest':cur['digest'],'hot':cur['hot'],'graph_values':list(o['graph_values']),'wasm':cur['wasm']})
            done={**copy.deepcopy(cur),'event':'done','steps':horizon,'random_draws':[i/20 for i in range(16)],'gc_calls':0,'clock_ms':12346}
            return gate,[resume,*ticks,done]


        def lines(es):return ''.join('V8_PROBE '+json.dumps(e)+'\n' for e in es)


        class VerifyTests(unittest.TestCase):
            @classmethod
            def setUpClass(cls):cls.g,cls.es=fixture()
            def setUp(self):self.g=copy.deepcopy(self.g);self.es=copy.deepcopy(self.es)
            def checks(self,reference=None):return x.verify_trial(self.g,self.es,2,reference)
            def test_valid_probe(self):self.assertTrue(x.valid_state(self.g));self.assertTrue(all(self.checks().values()))
            def test_invalid_horizon(self):
                for h in [0,-1,1001,True,'2']:
                    with self.assertRaises(ValueError):x.make_probe(h,45)
            def test_invalid_gate(self):
                for g in [0,14,181,False,'45']:
                    with self.assertRaises(ValueError):x.make_probe(2,g)
            def test_no_removed_api_dependency(self):
                s=x.make_probe(2,15);self.assertNotIn('read(',s);self.assertNotIn('__HORIZON__',s);self.assertIn('horizon=2',s)
            def test_initial_word_mutation(self):self.es[0]['heap_words'][0]^=1;self.assertFalse(self.checks()['all_4096_initial_words_exact'])
            def test_invalid_word_type(self):self.es[0]['heap_words'][0]=True;self.assertFalse(self.checks()['valid_complete_boundary_states'])
            def test_short_array(self):self.es[0]['heap_words'].pop();self.assertFalse(self.checks()['valid_complete_boundary_states'])
            def test_restart_token(self):self.es[0]['token']='b'*64;self.assertFalse(self.checks()['same_startup_token'])
            def test_counter_reset(self):self.es[0]['tick']=0;self.assertFalse(self.checks()['same_counter_and_hot'])
            def test_cold_boot_marker(self):self.es.insert(0,{'event':'boot'});self.assertFalse(self.checks()['no_cold_boot'])
            def test_duplicate_resume(self):self.es.insert(0,copy.deepcopy(self.es[0]));self.assertFalse(self.checks()['single_resume_and_done'])
            def test_missing_final(self):self.es.pop();self.assertFalse(self.checks()['single_resume_and_done'])
            def test_missing_transition(self):del self.es[1];self.assertFalse(self.checks()['all_transition_indices'])
            def test_reordered_transitions(self):self.es[1],self.es[2]=self.es[2],self.es[1];self.assertFalse(self.checks()['all_transition_indices'])
            def test_final_counter(self):self.es[-1]['tick']+=1;self.assertFalse(self.checks()['horizon_completed'])
            def test_graph_alias(self):self.es[0]['graph']['self']=False;self.assertFalse(self.checks()['valid_complete_boundary_states'])
            def test_ticket(self):self.es[0]['ticket']='wrong';self.assertFalse(self.checks()['ticket_preserved'])
            def test_rng_shape(self):self.es[-1]['random_draws']=[float('nan')]*16;self.assertFalse(self.checks()['random_draws_well_formed'])
            def test_equal_repeat(self):self.assertTrue(all(self.checks(copy.deepcopy(self.es)).values()))
            def test_final_array_vs_reference(self):ref=copy.deepcopy(self.es);self.es[-1]['heap_words'][7]^=1;self.assertFalse(self.checks(ref)['all_4096_final_words_equal_to_first_restore'])
            def test_rng_vs_reference(self):ref=copy.deepcopy(self.es);self.es[-1]['random_draws'][0]=.77;self.assertFalse(self.checks(ref)['rng_stream_equal_to_first_restore'])
            def test_step_vs_reference(self):ref=copy.deepcopy(self.es);self.es[1]['digest']='12345678';self.assertFalse(self.checks(ref)['all_transitions_equal_to_first_restore'])
            def test_strict_delta(self):b=lines([self.g]);self.assertEqual(x.checked_events(b,b+lines(self.es)),self.es)
            def test_prefix_replaced(self):
                with self.assertRaises(ValueError):x.checked_events('old','different')
            def test_invalid_json(self):

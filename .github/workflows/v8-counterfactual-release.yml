            return {'first_divergent_step':next((i+1 for i,n in enumerate(per) if n),None),
                    'changed_words_per_step':per,'final_changed_words':per[-1] if per else 0,
                    'max_changed_words':max(per) if per else 0}
        
        
        def same_scientific_ticks(a_events,b_events):
            aa=[e for e in a_events if e.get('event')=='tick']; bb=[e for e in b_events if e.get('event')=='tick']
            return len(aa)==len(bb) and all(
                x.get('step')==y.get('step') and exact_state(x,y) and x.get('graph_values')==y.get('graph_values')
                for x,y in zip(aa,bb))
        
        

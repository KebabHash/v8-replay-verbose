           check(f'branch_{b["trial"]}_all_runtime_assertions',bool(b.get('checks')) and all(b['checks'].values()))
           check(f'branch_{b["trial"]}_identical_resume_state',all(b['resume'].get(k)==rounds[-1]['paused'].get(k) for k in ('token','tick','digest','hot','heap_words')))
          if len(branches)==3:
           result['repeat_restore_seconds']=[round(b['restore_s'],5) for b in branches]
           result['repeat_restore_median_seconds']=statistics.median(b['restore_s'] for b in branches)
          result['normal_dump_seconds']=[r.get('dump_s') for r in rounds]
          result['normal_restore_seconds']=[r.get('restore_s') for r in rounds]
         result['untested']=['agent_target_joint_state','model_sampling_variance','mitigation_on_off_causal_effect',
          'ASLR_CFI_MTE_counterfactual_validity','full_heap_register_thread_equivalence','cross_host_portability',
          'deterministic_clock_and_scheduler_replay','independent_action_branching']

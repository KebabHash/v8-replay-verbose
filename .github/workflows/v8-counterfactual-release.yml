      shell: bash
      run: |
        set -Eeuo pipefail
        cat > "$BUNDLE_DIR/finalize_memory.py" <<'MEMORY8_FINALIZE_MEMORY_PY_1'
        """Required memory-data coverage, independent of a successful HTML write."""
        import json,os,shutil,sys,zipfile
        from pathlib import Path
        from memory_bridge import atomic,coverage,load,public_root,update_manifest,now

        def finalize():
            evidence=Path(os.environ['EVIDENCE_DIR']);root=public_root()
            requested=int(os.environ.get('FORK_TRIALS','12'));horizon=int(os.environ.get('REPLAY_STEPS','250'))
            result=coverage(root,requested,horizon)
            metrics=load(root/'metrics.json',{})
            result['native_running_samples']=metrics.get('running_samples',0)
            result['native_observer_status']='passed' if result['native_running_samples']>0 else 'not_demonstrated'
            suite=load(evidence/'intervention-suite.json',{})
            result['suite_status']=suite.get('status','missing')
            result['every_step_oracle_checks']=len(suite.get('trials',[]))==requested and all(t.get('checks',{}).get('all_steps_match_python_oracle') is True for t in suite.get('trials',[]))
            if result['native_observer_status']!='passed':result['errors'].append('No valid live d8 native-memory sample')
            if result['suite_status']!='passed' or not result['every_step_oracle_checks']:result['errors'].append('Exact per-step fidelity checks missing or failed')
            result['status']='passed' if not result['errors'] else 'failed'
            result['limitations']=['16 KiB of instrumented memory, not all V8 memory.', 'Native mapping/resource reads are non-atomic observations.',
                'Observer and per-step delay affect timing; no uninstrumented-overhead claim.', 'All continuations share one checkpoint; CONTROL/A/B interventions are applied only after exact pre-branch identity.']
            update_manifest(mode='archived',status=result['status'],stage='complete' if result['status']=='passed' else 'failed_or_incomplete',
                requested_trials=requested,horizon=horizon,coverage=result,ended_utc=now(),live_poll_seconds=None)
            atomic(evidence/'memory-fidelity.json',result)
            dest=evidence/'memory-atlas'
            if dest.exists():shutil.rmtree(dest)
            shutil.copytree(root,dest,symlinks=False)
            with zipfile.ZipFile(evidence/'memory-data.zip','w',zipfile.ZIP_DEFLATED,compresslevel=6) as z:
                for p in sorted(dest.rglob('*')):
                    if p.is_file() and not p.is_symlink():z.write(p,'memory-atlas/'+p.relative_to(dest).as_posix())
            print('MEMORY FIDELITY AND VIEW COVERAGE '+json.dumps(result,indent=2),flush=True)
            # Status is enforced by final gate; failure evidence still needs publication.
            return result

        if __name__=='__main__':
            try:finalize()
            except Exception as exc:
                root=Path(os.environ['EVIDENCE_DIR']);atomic(root/'memory-fidelity.json',{'status':'failed','exception':repr(exc)})
                raise
        MEMORY8_FINALIZE_MEMORY_PY_1

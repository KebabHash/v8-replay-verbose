        </head>
        <body>
        <header class="topbar"><div class="brand"><svg width="29" height="29" viewBox="0 0 29 29" aria-hidden="true"><path d="M5 23V6h9v9h10" stroke="currentColor" fill="none" stroke-width="2"/><circle cx="5" cy="6" r="3" fill="currentColor"/><circle cx="14" cy="15" r="3" fill="currentColor"/><circle cx="24" cy="15" r="3" fill="currentColor"/></svg>TRAJECTORY <span class="muted">ATLAS</span></div><div class="top-actions"><span class="pill good">OFFLINE EVIDENCE VIEWER</span><button id="importBtn">Open evidence</button><button id="exportBtn">Export session</button><input hidden type="file" id="fileInput" multiple accept=".json,.jsonl,.log,.txt"><input hidden type="file" id="folderInput" webkitdirectory multiple></div></header>
        <div class="workspace">
        <aside class="sidebar"><div><h2>Recorded trajectories</h2><div id="traceList"></div><button class="linklike" id="folderBtn" style="margin:12px 0 0">+ Open an evidence folder</button></div><div class="legend"><h2>Event vocabulary</h2><div class="legend-row"><i class="dot"></i>Tool / execution</div><div class="legend-row"><i class="dot" style="background:var(--purple)"></i>Agent decision</div><div class="legend-row"><i class="dot diamond"></i>Captured checkpoint</div><div class="legend-row"><i class="dot" style="background:var(--amber)"></i>Restore / continuation</div><div class="legend-row"><i class="dot square"></i>Failed check / error</div><div class="legend-row"><i class="dot" style="background:var(--amber)"></i>Observed divergence</div></div><div class="sidebar-note"><strong style="color:var(--text)">Evidence, not a simulator.</strong><br>Rewind moves the inspection cursor. It never restores process memory. This page has no execution backend or network connection.</div></aside>
        <main>
        <section class="heading"><div><div class="eyebrow">CHECKPOINT & CONTINUATION LAB</div><h1>Every branch. Every checkpoint.</h1><p id="projectSubtitle">Inspect what happened, then compare what changed.</p></div><div class="badge-line"><span id="dataBadge" class="pill warn">NO EVIDENCE</span><span class="pill">HTML5 / LOCAL</span></div></section>
        <div id="notice" class="notice" role="status"></div>
        <section class="stats" aria-label="Evidence summary"><div class="stat"><div id="statTraces" class="value">0</div><div class="caption">Recorded trajectories</div></div><div class="stat"><div id="statCP" class="value">0</div><div class="caption">Successful captures</div></div><div class="stat"><div id="statEvents" class="value">0</div><div class="caption">Events in evidence</div></div><div class="stat"><div id="statFailures" class="value">0</div><div class="caption">Failure events</div></div></section>
        MEMORY8_VIEWER_TEMPLATE_HTML_1
    - name: Embed viewer-template.html [2/4]
      shell: bash
      run: |
        set -Eeuo pipefail
        cat >> "$BUNDLE_DIR/viewer-template.html" <<'MEMORY8_VIEWER_TEMPLATE_HTML_2'
        <section class="panel" aria-label="Trajectory graph"><div class="panel-head"><div><h2>Trajectory map</h2><p>Shared origins connect only when explicitly recorded.</p></div><div class="panel-tools"><input id="search" type="search" aria-label="Search events" placeholder="Search event, stage, error..."><select id="axisMode" aria-label="Timeline axis"><option value="step">Event order</option><option value="time">Relative wall time</option></select><button id="zoomOut" aria-label="Zoom out">-</button><button id="zoomIn" aria-label="Zoom in">+</button><button id="firstFailure">First failure</button></div></div><div class="graph-scroll" id="graphScroll"><svg id="graph" role="img" aria-label="Interactive trajectory graph"></svg></div><div class="graph-foot"><span id="graphCaption">No events loaded.</span><span>Diamond = capture &nbsp; Square = failure &nbsp; Click a node to inspect</span></div><div class="transport"><div class="transport-top"><button id="prev" aria-label="Previous event">&lt; Step</button><button id="play" class="primary">Play evidence</button><button id="next" aria-label="Next event">Step &gt;</button><select id="speed" aria-label="Playback speed"><option value="1200">Slow</option><option value="650" selected>Normal</option><option value="200">Fast</option></select><span class="spacer"></span><button id="rewind">Rewind to checkpoint</button><select id="checkpointSelect" aria-label="Jump to checkpoint"><option value="">Select checkpoint...</option></select></div><div class="scrubber"><span id="cursorText" class="mono">EVENT 0 / 0</span><input id="scrubber" type="range" min="0" max="0" value="0" aria-label="Evidence playback position"><span id="cursorTime" class="mono">No time</span></div></div></section>
        <div class="twocol"><section class="panel"><div class="panel-head"><div><h2>Event inspector</h2><p>Exact recorded data, never inferred runtime state.</p></div><span id="eventStatus" class="pill">-</span></div><div class="panel-body" id="inspector"><div class="empty">Open evidence to inspect a trajectory.</div></div></section>
        <section class="panel"><div class="panel-head"><div><h2>Checkpoint state comparison</h2><p>Probe-level equality is not equality of the entire V8 heap.</p></div></div><div class="panel-body"><div class="compare-pickers"><label>Reference observation<select id="compareA"></select></label><label>Comparison observation<select id="compareB"></select></label></div><div id="diffBody"></div><div class="heap-head"><span>Typed-array word difference</span><span id="heapCount" class="mono">No data</span></div><div id="heapGrid" class="heap-grid" aria-label="Typed-array difference map"></div><div id="heapDetail" class="heap-explain"></div><div class="scope-note">An observation attached to a command is a sampled state, not a new execution checkpoint. Missing fields remain unknown; unknown never counts as a pass.</div></div></section></div>
        <section class="panel"><div class="panel-head"><div><h2>Restoration fidelity matrix</h2><p>Only explicit assertions are shown. Blank coverage is not success.</p></div><span id="matrixSummary" class="check-banner"></span></div><div class="matrix-scroll" id="matrixBody"></div></section>
        <section class="panel resources"><div class="panel-head"><div><h2>Measured memory by trajectory</h2><p>Optional RSS samples; this is not a memory-limit or virtual-address-space chart.</p></div><span id="resourceStatus" class="pill">NO SAMPLES</span></div><div id="resourceBody"></div></section>
        <details class="panel"><summary style="padding:12px 18px;margin:0">Provenance, evidence coverage, and import warnings</summary><div class="panel-body"><pre id="provenance"></pre><div id="warnings"></div></div></details>
        <footer class="footer"><span>Space: play / pause &nbsp;&nbsp; Left / right: step &nbsp;&nbsp; R: previous checkpoint</span><span>No telemetry. No libraries. No credentials.</span></footer>
        </main></div>
        <div class="toast" id="toast" role="status"></div>
        <dialog id="branchDialog"><h2>Plan a new continuation</h2><span class="pill warn">PLAN ONLY - NOT EXECUTED</span><p id="branchSource"></p><label>Branch label<input id="branchName" value="Alternative continuation" maxlength="120"></label><label>Intervention to apply<textarea id="branchNote" placeholder="For example: use the same target state with a different next agent action."></textarea></label><p>The exported plan records the source checkpoint and expected state. A separate authenticated execution service must validate retained checkpoint files, restore the target, and append a new trajectory. This viewer does none of those operations.</p><div class="dialog-actions"><button id="cancelBranch">Cancel</button><button id="saveBranch" class="primary">Export branch plan</button></div></dialog>
        <script id="embedded-evidence" type="application/json">__EMBEDDED_EVIDENCE__</script>
        <script>
        "use strict";
        const $ = id => document.getElementById(id);
        const SVGNS = "http://www.w3.org/2000/svg";
        const COLORS = {tool:"#89afff",llm:"#bb9cff",checkpoint:"#52dec6",restore:"#ffc77d",failure:"#ff8994",divergence:"#ffc77d",assertion:"#98b2cb",observation:"#6d91ba",setup:"#7187a5",event:"#89afff"};
        const MAX_FILE = 2 * 1024 * 1024, MAX_TOTAL = 32 * 1024 * 1024;
        const app = {data:null,trace:null,index:0,zoom:1,timer:null,compareA:null,compareB:null};
        const text = value => value === undefined || value === null ? "Not recorded" : typeof value === "object" ? JSON.stringify(value) : String(value);
        const el = (tag, attrs={}, content) => { const n=document.createElement(tag); for(const [k,v] of Object.entries(attrs)){if(k==="class")n.className=v;else n.setAttribute(k,v);} if(content!==undefined)n.textContent=content;return n;};
        const sv = (tag, attrs={}, content) => {const n=document.createElementNS(SVGNS,tag);for(const [k,v] of Object.entries(attrs))n.setAttribute(k,v);if(content!==undefined)n.textContent=content;return n;};
        const short = (v,n=35) => {let s=text(v);return s.length>n?s.slice(0,n-3)+"...":s;};
        const clone = o => JSON.parse(JSON.stringify(o));
        const parseJSON = (s,fallback=null) => {try{return JSON.parse(s)}catch{return fallback}};
        const checkpointOK = n => n.kind === "checkpoint" && n.status === "passed";
        const currentTrace = () => app.data?.traces.find(t=>t.id===app.trace);
        const currentNode = () => currentTrace()?.nodes[app.index];
        function toast(message){$("toast").textContent=message;$("toast").classList.add("visible");clearTimeout(toast.timer);toast.timer=setTimeout(()=>$("toast").classList.remove("visible"),4500);}
        function markers(s){return String(s||"").split(/\r?\n/).filter(l=>l.startsWith("V8_PROBE ")).map(l=>parseJSON(l.slice(9))).filter(x=>x&&typeof x==="object");}
        function inferKind(label, argv, status){
          if(status==="failed")return "failure";
          if(argv?.[0]==="docker" && argv[1]==="checkpoint" && argv[2]==="create")return "checkpoint";
          if(argv?.includes("--checkpoint"))return "restore";
          if(/checkpoint-create/.test(label))return "checkpoint";
          if(/checkpoint-restore/.test(label))return "restore";
          return "tool";
        }
        function normalizeFiles(files, metadata={}){
          const normalized = files.map(f=>({name:String(f.name).replace(/\\/g,"/"),text:f.text}));
          const sessions=normalized.filter(f=>/\.json$/.test(f.name)).map(f=>({name:f.name,data:parseJSON(f.text)})).filter(s=>s.data?.schema==="trajectory-atlas/v1");
          if(sessions.length===1)return validateData(sessions[0].data);
          if(sessions.length>1){
            const merged={schema:"trajectory-atlas/v1",synthetic:sessions.some(s=>s.data.synthetic===true),title:"Combined imported sessions",traces:[],warnings:["Multiple sessions merged with namespaced IDs. Synthetic content makes this a demonstration dataset."],provenance:{source:"Multiple local session files",control_mode:"offline"}};
            sessions.forEach((s,i)=>{const d=validateData(s.data),prefix="session"+i+"/";for(const t of d.traces){t.id=prefix+t.id;t.label=s.name.split("/").at(-1)+" / "+t.label;for(const n of t.nodes){n.id=prefix+n.id;n.trace_id=t.id;}if(t.parent)t.parent={trace_id:prefix+t.parent.trace_id,event_id:prefix+t.parent.event_id};merged.traces.push(t);}merged.warnings.push(...d.warnings);});
            return validateData(merged);
          }
          const map = new Map(normalized.map(f=>[f.name,f.text]));
          const dirs = new Set();
          for(const f of normalized)if(/(^|\/)(report\.json|events\.jsonl|events\.json|results\.json|setup\.json|daemon-setup\.json)$/.test(f.name))dirs.add(f.name.slice(0,f.name.lastIndexOf("/")+1));
          const data={schema:"trajectory-atlas/v1",synthetic:false,title:"V8 checkpoint evidence",traces:[],warnings:[],provenance:{...metadata,source:"Imported evidence files",control_mode:"offline",raw_memory_included:false},coverage:{files:files.length}};
          for(const dir of dirs){
            const get = name => map.get(dir+name);
            const report = parseJSON(get("report.json"),parseJSON(get("results.json"),{})) || {};
            const runID = String(report.run_id || metadata.run_id || dir.replace(/\/$/,"") || "run") + (data.traces.length ? "-"+data.traces.length:"");
            const trace={id:runID,label:dir.replace(/\/$/,"")||"Recorded run",status:report.status||"unknown",nodes:[],checks:[],samples:[],parent:null,provenance:{image:report.image||metadata.image,source_directory:dir,report_status:report.status,failed_stage:report.failed_stage,limitations:report.limitations},restore_available:false};
            let serial=0,lastState=null;
            const add=n=>{n.id=runID+"/e"+(++serial);n.trace_id=runID;trace.nodes.push(n);return n;};
            for(const setupName of ["setup.json","daemon-setup.json"]){const setup=parseJSON(get(setupName));if(setup)add({kind:"setup",label:setupName==="setup.json"?"CRIU setup":"Docker configuration",status:setup.status||"unknown",stage:setup.last_phase||setup.stage||"setup",time:setup.finished_utc||setup.started_utc||null,detail:setup});}
            let events=[];
            if(get("events.jsonl")){for(const [i,line] of get("events.jsonl").split(/\r?\n/).entries()){if(!line.trim())continue;const e=parseJSON(line);if(e&&typeof e==="object")events.push(e);else data.warnings.push(`${dir}events.jsonl line ${i+1}: invalid JSON, omitted from graph.`);}}
            else events=parseJSON(get("events.json"),[])||[];
            if(!Array.isArray(events)){data.warnings.push(dir+"events: expected an array");events=[];}

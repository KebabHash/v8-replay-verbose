                logpath=root/'live-tunnel.log';log=logpath.open('a')
                # Explicit HTTP/2 avoids depending on outbound QUIC. No credential/account required.
                p=subprocess.Popen([str(dest),'tunnel','--no-autoupdate','--protocol','http2','--url',f'http://127.0.0.1:{port}'],stdin=subprocess.DEVNULL,stdout=log,stderr=subprocess.STDOUT,start_new_session=True)
                atomic(private_root()/'tunnel.json',{'pid':p.pid,'executable':str(dest)})
                endpoint=None
                for _ in range(120):
                    if p.poll() is not None:raise RuntimeError('Tunnel process exited; see live-tunnel.log')
                    text=logpath.read_text(errors='replace');m=re.search(r'https://[a-z0-9-]+\.trycloudflare\.com',text)
                    if m:endpoint=m.group(0);break
                    time.sleep(.5)
                if not endpoint:raise TimeoutError('No Quick Tunnel URL advertised within 60 seconds')
                # Provider URL generation is not proof of reachability; verify a full request through it.
                for _ in range(12):
                    try:
                        if fetch_json(endpoint+'/health',timeout=5).get('status')=='ready':break
                    except Exception:time.sleep(2)
                else:raise RuntimeError('Tunnel URL generated but public health verification failed')
                record.update(status='passed',url=endpoint,public_reachable=True,expires='When the runner job or tunnel stops',access='Public read-only; no native memory dumps or control API')
                print('\nLIVE MEMORY DASHBOARD: '+endpoint+'/\nPublic, read-only. Expires at job end.\n',flush=True)
                if os.environ.get('GITHUB_STEP_SUMMARY'):
                    with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f:f.write('\n## Live memory dashboard (temporary)\n'+endpoint+'/\n\nAvailable during this job only. Public synthetic-array and process-metadata telemetry; no restore API.\n')
            except Exception as exc:

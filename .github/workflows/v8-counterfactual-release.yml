        # V8 Checkpoint Atlas / repair-6

        ## Repair scope

        - Extended suite uses the already-validated sudo namespace guard.
        - Copied scripts are mode 0644; bytes are read back and compared before startup.
        - Every trial uses the same checkpoint, whose image files are content-hashed before and after.
        - Independent Python oracle checks final tracked words and graph values.
        - A real cold-start negative control is distinct from synthetic verifier mutation controls.
        - Probe arithmetic update is bijective per word so it does not erase initial-array differences.
        - All command .stdout.txt/.stderr.txt, logs and JSONL streams are retained in downloadable packages.
        - Pages deployment is separately gated on artifact upload, not on scientific success.

        ## Boundaries

        The final suite performs controlled synthetic counterfactual branching after exact pre-intervention identity. It still does not claim semantic agent actions, mitigation effects, full VM equivalence, or an active Pages backend. Repeated restores remain correlated samples from one checkpoint.

        Pages is public static hosting. The repository owner must select Settings > Pages > Source > GitHub Actions. The dispatch input can disable publication; downloadable Actions artifacts remain. No secrets should be added.

        ## Sources

        ### Moby restore regression #50750
        https://github.com/moby/moby/issues/50750

        Exact /proc/0/ns/net error reported with Docker 28+. The issue is not evidence that every runtime combination is fixed.

        Applied here: Motivates bypassing the new-namespace initialization path, rather than changing the working V8 probe or CRIU build.

        ### containerd issue #12141
        https://github.com/containerd/containerd/issues/12141

        Related checkpoint/restore failure discussed in containerd; points back to Docker/Moby namespace handling.

        Applied here: Cross-reference only. Closing an issue is not proof of a shipped fix.

        ### Moby v28.0.4 task initialization
        https://raw.githubusercontent.com/moby/moby/v28.0.4/daemon/start_linux.go

        initializeCreatedTask uses /proc/<task PID>/ns/net when the OCI network namespace has an empty path.

        Applied here: An explicit pre-existing namespace path bypasses this particular SetKey branch. This is the central source-level rationale.

        ### Moby v28.0.4 OCI namespace construction
        https://raw.githubusercontent.com/moby/moby/v28.0.4/daemon/oci_linux.go

        The container network mode populates the OCI namespace path from the referenced container PID.

        Applied here: Create the target with --network container:<keeper ID> BEFORE its first start and checkpoint, not only during restore.

        ### Moby v28.0.4 network lifecycle
        https://raw.githubusercontent.com/moby/moby/v28.0.4/daemon/container_operations.go

        Container-network mode shares an existing network stack instead of allocating an independent Docker network sandbox.

        Applied here: Keep the namespace owner running and remove it only after the target is removed.

        ### runc v1.5.2 CRIU external namespaces
        https://raw.githubusercontent.com/opencontainers/runc/v1.5.2/libcontainer/criu_linux.go

        External network namespaces are marked on dump and supplied through an inherited descriptor on restore. Network namespace support requires CRIU 3.11 or newer.

        Applied here: The keeper is an external fixture. Its network state is NOT dumped, rewound, or portably migrated by this test.

        ### Docker checkpoint reference
        https://docs.docker.com/reference/cli/docker/checkpoint/

        Checkpoint/restore is experimental, uses CRIU, and is primarily focused on single-host use. No external TTY is used here.

        Applied here: Retain actual checkpoint commands and strict continuity checks; never substitute a cold start for a failed restore.

        ### Docker checkpoint create
        https://docs.docker.com/reference/cli/docker/checkpoint/create/

        Creates a checkpoint from a running container. Leave-running is an optional behavior.

        Applied here: This workflow uses the default stopped-target behavior and verifies Running=false plus stable logs.

        ### Docker container start
        https://docs.docker.com/reference/cli/docker/container/start/

        The --checkpoint option starts a container from a checkpoint.

        Applied here: Only the first target launch is ordinary start. Every tested continuation uses --checkpoint.

        ### Docker network sharing
        https://docs.docker.com/engine/network/

        The supported container:<name|id> mode shares another container networking stack; certain DNS/hostname/port flags are incompatible.

        Applied here: The target shares only the dedicated keeper namespace. No host networking or port publishing is used.

        ### Docker none driver
        https://docs.docker.com/engine/network/drivers/none/

        The none driver leaves a private stack with only loopback, rather than eliminating network namespaces altogether.

        Applied here: The keeper uses none. Namespace identity, loopback-only links and both route tables are checked at runtime.

        ### Docker host driver
        https://docs.docker.com/engine/network/drivers/host/

        Host networking shares the host network stack rather than isolating the container network.

        Applied here: Not used as a workaround: it would change the security boundary of this vulnerable target.

        ### CRIU external resources
        https://criu.org/External_resources

        Some resources cannot be checkpointed/restored without help from the caller, because some state lies outside the dumped container.

        Applied here: Declare the namespace keeper as a retained external dependency in report.json and the HTML evidence.

        ### CRIU Docker integration
        https://criu.org/Docker

        Describes native Docker integration and recommends considering Podman as an alternative.

        Applied here: This patch retains Docker to isolate the observed change; a future Podman comparison is a separate experiment.

        ### CRIU external Docker historical prototype
        https://criu.org/index.php?mobileaction=toggle_view_mobile&title=Docker_External

        The old external Docker C/R approach is marked as a proof of concept, not the recommended native integration.

        Applied here: Do not run raw criu restore behind Docker and pretend Docker tracks the revived process correctly.

        ### Docker daemon configuration
        https://docs.docker.com/reference/cli/dockerd/

        Documents daemon configuration, experimental mode and configuration validation.

        Applied here: Keep the existing merged/validated daemon config. Restarting Docker is restricted to the disposable hosted runner.

        ### GitHub expression contexts
        https://docs.github.com/en/actions/reference/workflows-and-actions/contexts

        Available expression contexts depend on the workflow key being evaluated.

        Applied here: Keep github.workspace in job-level env; do not reintroduce runner.temp there.

        ### GitHub workflow syntax
        https://docs.github.com/en/actions/reference/workflows-and-actions/workflow-syntax

        Workflow syntax specifies job/step behavior, conditions, shells, and a 21,000-character run-block maximum.

        Applied here: Split embedded source into multiple small run blocks within the SAME YAML. Evidence and HTML steps use always().

        ### GitHub artifacts
        https://docs.github.com/en/actions/how-tos/writing-workflows/choosing-what-your-workflow-does/storing-and-sharing-data-from-a-workflow

        Artifacts retain generated reports and output files from workflow runs.

        Applied here: Upload the HTML and diagnostic evidence after both success and failure. Raw memory images remain excluded.

        ### Linux namespace access permissions
        https://man7.org/linux/man-pages/man7/namespaces.7.html

        Namespace symlink reads are ptrace access checked; unprivileged host reads may fail.

        Applied here: Reuse guarded sudo readlink/nsenter rather than os.stat from the unprivileged runner.

        ### GitHub custom Pages workflows
        https://docs.github.com/en/pages/getting-started-with-github-pages/using-custom-workflows-with-github-pages

        Pages requires a Pages artifact, deployment job, pages/id-token permissions and environment.

        Applied here: Separate deployment even after a failed experiment, contingent on successful artifact upload.


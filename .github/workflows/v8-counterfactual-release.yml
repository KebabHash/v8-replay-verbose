                           'State': {'Running':True if is_target else self.keeper_running,
                                     'Pid':300 if is_target else self.keeper_pid,
                                     'StartedAt': self.keeper_start},
                           'HostConfig': {'NetworkMode':self.target_mode if is_target else 'none'},
                           'RestartCount': self.restart if not is_target else 0}
                    out=json.dumps(obj)
                elif label == 'netns-keeper-inode': out=f'net:[{self.keeper_inode}]\n'
                elif label == 'netns-target-inode': out=f'net:[{self.target_inode}]\n'
                elif label == 'netns-host-inode': out=f'net:[{self.host_inode}]\n'
                elif label == 'netns-links': out=json.dumps(self.links)
                elif label == 'netns-ipv4-routes': out=json.dumps(self.routes4)
                elif label == 'netns-ipv6-routes': out=json.dumps(self.routes6)
                elif label == 'netns-cleanup-target-check':

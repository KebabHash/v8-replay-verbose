lid var(--border);display:flex;justify-content:space-between;gap:12px;align-items:center}.panel-head h2{font-size:14px;margin:0;font-weight:650}.panel-head p{font-size:11px;color:var(--muted);margin:3px 0 0}.panel-tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.panel-tools input{width:190px;font-size:12px}.panel-tools select{font-size:12px}.graph-scroll{overflow:auto;min-height:160px;max-height:460px;background:#101824}.graph-scroll svg{display:block}.graph-scroll .node{cursor:pointer;transition:opacity .1s}.graph-scroll .node:hover{filter:brightness(1.4)}.graph-foot{display:flex;justify-content:space-between;gap:10px;padding:8px 18px;border-top:1px solid var(--border);font-size:11px;color:var(--muted)}.transport{padding:14px 18px;border-top:1px solid var(--border);background:#151f2e}.transport-top{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.transport-top .spacer{flex:1}.transport button{font-size:12px}.transport select{font-size:12px;max-width:240px}.scrubber{display:flex;align-items:center;gap:14px;margin-top:13px}.scrubber input{width:100%;accent-color:var(--teal);padding:0}.scrubber .mono{font-size:11px;white-space:nowrap;min-width:95px;color:var(--muted)}.twocol{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr);gap:18px;margin:18px 0}.panel-body{padding:16px 18px}.event-title{font-size:17px;margin:6px 0 12px;overflow-wrap:anywhere}.kv{display:grid;grid-template-columns:105px minmax(0,1fr);gap:6px 12px;font-size:12px;margin-bottom:14px}.kv dt{color:var(--muted)}.kv dd{margin:0;word-break:break-word}.inspector-actions{display:flex;gap:7px;margin:14px 0;flex-wrap:wrap}.inspector-actions button{font-size:11px}.scope-note{border-left:2px solid var(--amber);padding-left:10px;color:var(--muted);font-size:11px;line-height:1.6;margin-top:14px}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#0c131f;border:1px solid var(--border);border-radius:6px;max-height:290px;overflow:auto;padding:12px;font-size:11px;line-height:1.65;margin:10px 0}details summary{cursor:pointer;color:var(--muted);font-size:12px;margin-top:10px}.compare-pickers{display:grid;grid-template-columns:1fr 1fr;gap:10px}.compare-pickers label{font-size:10px;letter-spacing:.06em;text-transform:uppercase}.compare-pickers select{width:100%;font-size:11px;margin-top:5px}.diff-table,.matrix{width:100%;border-collapse:collapse;font-size:12px}.diff-table{margin:12px 0}.diff-table td,.diff-table th{padding:7px 6px;text-align:left;border-bottom:1px solid #263246}.diff-table th{font-weight:500;color:var(--muted);font-size:10px}.diff-table td{font-family:var(--mono);font-size:11px}.diff-table td:first-child{font-family:inherit;color:var(--muted)}.match{color:var(--teal)}.mismatch{color:var(--red)}.unknown{color:var(--dim)}.heap-head{display:flex;justify-content:space-between;gap:15px;font-size:11px;margin:14px 0 9px}.heap-grid{display:grid;grid-template-columns:repeat(32,1fr);gap:3px}.heap-cell{height:12px;border:0;border-radius:2px;background:#2c3547;min-width:0;padding:0}.heap-cell.same{background:#2b786f}.heap-cell.changed{background:var(--red)}.heap-cell:focus{outline:2px solid white}.heap-explain{font-size:10px;color:var(--muted);margin-top:8px;min-height:15px}.matrix-scroll{overflow:auto;max-height:340px}.matrix th{background:#151e2c;color:var(--muted);font-size:10px;text-align:center;padding:12px;position:sticky;top:0;font-weight:500}.matrix td{padding:10px 14px;border-top:1px solid var(--border);text-align:center;font-family:var(--mono);font-size:11px}.matrix th:first-child,.matrix td:first-child{text-align:left;font-family:inherit;min-width:160px}.matrix td:first-child span{display:block;font-size:10px;color:var(--dim);margin-top:2px}.empty{padding:30px 18px;color:var(--muted);font-size:13px;line-height:1.7}.resources{margin:18px 0}.resources svg{width:100%;height:150px;display:block}.footer{margin-top:18px;display:flex;gap:15px;justify-content:space-between;font-size:11px;color:var(--dim);flex-wrap:wrap}.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#22384a;border:1px solid #567486;box-shadow:0 12px 40px #0008;border-radius:9px;padding:12px 20px;color:var(--text);max-width:90vw;z-index:20;display:none}.toast.visible{display:block}dialog{background:var(--panel);color:var(--text);border:1px solid var(--border);border-radius:14px;max-width:600px;width:90vw;padding:24px}dialog::backdrop{background:#000b}dialog h2{margin-top:0}dialog p{color:var(--muted);font-size:13px}dialog label{display:block;font-size:12px;margin:14px 0}dialog input,dialog textarea{width:100%;display:block;margin-top:6px}dialog textarea{min-height:100px}.dialog-actions{display:flex;justify-content:flex-end;gap:9px;margin-top:20px}.visually-hidden{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}.badge-line{display:flex;gap:7px;align-items:center;flex-wrap:wrap}.check-banner{font-size:11px;color:var(--muted)}.linklike{background:none;border:0;padding:0;color:var(--teal);font-size:12px}.drop-active{outline:2px dashed var(--teal);outline-offset:-10px}
        @media(max-width:1200px){.workspace{grid-template-columns:190px minmax(0,1fr)}main{padding:22px 20px}.panel-head{flex-wrap:wrap}.topbar{padding:0 20px}.heap-grid{grid-template-columns:repeat(16,1fr)}}
        @media(max-width:900px){.workspace{display:block}.sidebar{border-right:0;border-bottom:1px solid var(--border);padding:12px 20px;gap:10px}.sidebar .legend,.sidebar-note,.sidebar h2{display:none}#traceList{display:flex;gap:7px;overflow:auto}.trace-button{min-width:180px;margin:0}.twocol{grid-template-columns:1fr}.topbar{height:auto;min-height:68px;flex-wrap:wrap;padding:14px 20px}.heading{align-items:flex-start}.heading h1{font-size:25px}}
        @media(max-width:560px){main{padding:18px 12px}.stats{grid-template-columns:repeat(2,1fr)}.heading{display:block}.heading .badge-line{margin-top:12px}.top-actions{flex-wrap:wrap}.top-actions button,.file-label{font-size:12px}.panel-tools input{width:140px}.transport-top .spacer{display:none}.compare-pickers{grid-template-columns:1fr}.graph-foot{display:block}.brand{font-size:15px}}

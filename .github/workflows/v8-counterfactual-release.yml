        """Local parser, byte-fidelity, compact-index and read-only HTTP tests. Not CRIU tests."""
        import base64,copy,contextlib,hashlib,io,json,os,struct,tempfile,threading,unittest,urllib.error,urllib.request
        from pathlib import Path
        from unittest.mock import patch
        import memory_bridge as b
        import proc_metrics as proc
        import intervention_suite as suite
        import counterfactual_suite as counterfactual
        import memory_service as service
        import build_viewer as viewer
        from repair_tests import fixture

        class MemoryTests(unittest.TestCase):
            @classmethod
            def setUpClass(cls):
                cls.g,cls.es=fixture(2)
                expected=suite.reference_steps(cls.g,2)
                for e,o in zip([e for e in cls.es if e.get('event')=='tick'],expected):
                    e.update(heap_words=list(o['heap_words']),words=4096,graph={**copy.deepcopy(cls.g['graph']),'values':o['graph_values']})
                cls.oracle=expected
            def setUp(self):
                self.tmp=tempfile.TemporaryDirectory();self.root=Path(self.tmp.name)
                self.env=patch.dict(os.environ,{'MEMORY_SITE':str(self.root/'public'),'MEMORY_PRIVATE':str(self.root/'private'),'MEMORY_HOOKS':'1','STEP_PAUSE_MS':'25'})
                self.env.start();b.initialize();self.g=copy.deepcopy(type(self).g);self.es=copy.deepcopy(type(self).es)
            def tearDown(self):self.env.stop();self.tmp.cleanup()
            def test_full_bytes_roundtrip(self):
                p=b.frame_payload(self.g);self.assertEqual(list(struct.unpack('<4096I',base64.b64decode(p['bytes_b64']))),self.g['heap_words']);self.assertEqual(p['byte_length'],16384)
            def test_bad_word_count(self):
                self.g['heap_words'].pop()
                with self.assertRaises(ValueError):b.frame_payload(self.g)
            def test_bad_word_bool(self):
                self.g['heap_words'][0]=True
                with self.assertRaises(ValueError):b.frame_payload(self.g)
            def test_bad_word_range(self):
                self.g['heap_words'][0]=2**32
                with self.assertRaises(ValueError):b.frame_payload(self.g)
            def test_negative_word(self):
                self.g['heap_words'][0]=-1
                with self.assertRaises(ValueError):b.frame_payload(self.g)
            def test_digest_computed_from_actual_bytes(self):
                p=b.frame_payload(self.g);self.assertEqual(p['sha256'],hashlib.sha256(struct.pack('<4096I',*self.g['heap_words'])).hexdigest())
            def test_every_step_oracle_pass(self):self.assertTrue(all(suite.exact_step_checks(self.g,self.es,2,self.oracle).values()))
            def test_one_middle_word_rejected(self):
                self.es[1]['heap_words'][13]^=1;self.assertFalse(suite.exact_step_checks(self.g,self.es,2,self.oracle)['all_step_words_exact'])
            def test_scalar_only_mutation_rejected(self):
                self.es[1]['hot']^=1;self.assertFalse(suite.exact_step_checks(self.g,self.es,2,self.oracle)['all_steps_match_python_oracle'])
            def test_alias_mutation_rejected(self):
                self.es[1]['graph']['alias']=False;self.assertFalse(suite.exact_step_checks(self.g,self.es,2,self.oracle)['all_step_object_observations_exact'])
            def test_short_sequence_rejected(self):
                self.es.pop(1);self.assertFalse(suite.exact_step_checks(self.g,self.es,2,self.oracle)['all_step_words_exact'])
            def test_generated_probe_measures_each_step(self):
                s=suite.make_probe(2,15);self.assertIn("emit('tick',{...state(),step",s);self.assertIn('delay(25)',s);self.assertNotIn('read(',s)
            def test_invalid_pause_rejected(self):
                with patch.dict(os.environ,{'STEP_PAUSE_MS':'101'}):
                    with self.assertRaises(ValueError):suite.make_probe(2,15)
            def test_existing_mode_unchanged_without_hooks(self):
                with patch.dict(os.environ,{'MEMORY_HOOKS':'0'}):self.assertNotIn("emit('tick',{...state(),step",suite.make_probe(2,15))
            def fill(self,number=1):
                b.captured(self.g,'extended-base','a'*64);b.begin_trial(number,'extended-base','a'*64)
                for s in self.es:b.observation(number,s)
                b.finish_trial(number,{'all_step_words_exact':True},.3)
            def test_complete_manifest(self):
                self.fill();r=b.coverage(b.public_root(),1,2);self.assertEqual(r['status'],'passed');self.assertEqual(r['frames'],4)
            def test_all_trials_indexed(self):
                for i in range(1,13):self.fill(i)
                r=b.coverage(b.public_root(),12,2);self.assertEqual(r['status'],'passed');self.assertEqual(r['frames'],48)
            def test_missing_frame_fails(self):
                self.fill();(b.public_root()/'data/trial-001/step-0001.json').unlink();self.assertEqual(b.coverage(b.public_root(),1,2)['status'],'failed')
            def test_mutated_bytes_fails(self):
                self.fill();path=b.public_root()/'data/trial-001/done.json';obj=b.load(path);obj['bytes_b64']=base64.b64encode(bytes(16384)).decode();b.atomic(path,obj)
                self.assertEqual(b.coverage(b.public_root(),1,2)['status'],'failed')
            def test_duplicate_trial_rejected(self):
                self.fill()
                with self.assertRaises(ValueError):b.begin_trial(1,'extended-base','a'*64)
            def test_capture_corruption_fails(self):
                self.fill();path=b.public_root()/'data/captured.json';obj=b.load(path);obj['bytes_b64']=base64.b64encode(bytes(16384)).decode();b.atomic(path,obj)
                self.assertEqual(b.coverage(b.public_root(),1,2)['status'],'failed')
            def test_metadata_conflict_rejected(self):

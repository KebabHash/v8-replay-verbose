        function renderMetrics(){const m=S.metrics?.latest||{};$('rss').textContent=fmt(m.rss_bytes);$('pss').textContent='PSS '+fmt(m.pss_bytes);$('hostRam').textContent=fmt(m.host_available_bytes);$('nativeState').textContent=m.status?.replaceAll('_',' ')||'Not observed';$('mapCount').textContent=Number.isFinite(m.mapping_count)?m.mapping_count+' mappings':'No sample';$('threads').textContent=Number.isFinite(m.native_threads)?m.native_threads+' threads / PID '+m.pid:'';const mode=$('mapFilter').value,rows=(m.mappings||[]).filter(x=>mode==='all'||mode==='exec'&&x.permissions.includes('x')||mode==='write'&&x.permissions.includes('w')||mode==='anon'&&x.kind.startsWith('['));const body=$('maps');body.replaceChildren();for(const r of rows){const tr=document.createElement('tr');for(const v of ['0x'+r.start,fmt(r.bytes),r.permissions,r.kind]){const td=document.createElement('td');td.textContent=v;tr.append(td)}body.append(tr)}$('mapLimit').textContent=m.mappings?'Showing '+rows.length+' mappings; '+(m.mappings_omitted||0)+' omitted by collector limit. These live reads are not atomic.':'No live target sample. Stopped processes have no current resident-memory sample.';drawChart()}

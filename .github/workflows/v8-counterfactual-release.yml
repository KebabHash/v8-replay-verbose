        async function inspect(captured=false){captured=captured||S.pos<0;const serial=++S.serial;try{const rows=S.index?.frames||[],path=captured?S.manifest?.capture?.file:rows[S.pos]?.file;if(!path){S.frame=null;S.words=null;drawMemory();return}const a=await frame(path);let refPath=null,label='Reference unavailable';const mode=$('compare').value;if(mode==='capture'){refPath=S.manifest.capture?.file;label='Captured state'}else if(mode==='previous'&&!captured){refPath=S.pos>0?rows[S.pos-1].file:S.manifest.capture?.file;label='Previous observed frame'}else if(mode==='first'&&!captured){const first=trials()[0];if(first){const idx=await get(first.index),row=idx.frames.find(r=>r.id===rows[S.pos]?.id);refPath=row?.file;label='Same logical frame in replay 1'}}let b=refPath?await frame(refPath):null;if(serial!==S.serial)return;S.frame=a.p;S.words=a.w;S.ref=b?.p||null;S.refWords=b?.w||null;$('frameKind').textContent=a.p.event.toUpperCase();$('observation').textContent=(captured?'Shared checkpoint':S.trial)+' / '+a.p.event;$('counter').textContent=(a.p.step??'-')+' / '+a.p.tick;$('bytes').textContent=a.p.byte_length.toLocaleString()+' bytes';$('hash').textContent=a.p.sha256;$('hashStatus').textContent=a.integrity;$('reference').textContent=b?label:'Not recorded';$('comparisonLabel').textContent=b?label:'No reference available';$('changed').textContent=b?a.w.reduce((n,x,i)=>n+(x!==b.w[i]),0).toLocaleString():'Not compared';$('framePosition').textContent=captured?'CAPTURE':(S.pos+1)+' / '+rows.length;$('scrub').value=S.pos;$('wordDetail').textContent='Click a cell to inspect its exact value and byte offset.';drawMemory();clearError()}catch(e){fail(e)}}

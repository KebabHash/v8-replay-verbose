            return 0

        def stop():
            for key in ('tunnel','server'):
                p=load(private_root()/(key+'.json'),{})
                pid=p.get('pid')
                if type(pid) is not int or pid<=1:continue
                try:
                    cmdline=Path(f'/proc/{pid}/cmdline').read_bytes()
                    expected=str(p.get('script',p.get('executable',''))).encode()
                    if not expected or expected not in cmdline:raise RuntimeError('Refusing to signal reused service PID')

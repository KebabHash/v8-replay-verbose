      continue-on-error: true
      if: ${{ !cancelled() && steps.self_tests.outcome == 'success' && steps.network_tests.outcome == 'success'
        && steps.repair_tests.outcome == 'success' }}
      shell: bash
      run: |
        set -Eeuo pipefail
        python3 -u "$BUNDLE_DIR/checkpoint_probe.py" stream criu-install   bash "$BUNDLE_DIR/install_criu.sh" 2>&1 | tee "$EVIDENCE_DIR/criu-install-console.log"
      env:
        MEMORY_HOOKS: '1'
    - name: Configure Docker checkpoint support and print feature diagnostics
      id: daemon
      continue-on-error: true
      if: ${{ !cancelled() && steps.criu_setup.outcome == 'success' }}
      shell: bash
      run: |
        set -Eeuo pipefail
        python3 -u "$BUNDLE_DIR/checkpoint_probe.py" daemon 2>&1 | tee "$EVIDENCE_DIR/daemon-console.log"
      env:
        MEMORY_HOOKS: '1'
    - name: Attempt real V8 checkpoints and exact probe-state restoration
      id: experiment
      continue-on-error: true
      if: ${{ !cancelled() && steps.daemon.outcome == 'success' && steps.repair_tests.outcome == 'success' }}
      shell: bash
      run: |
        set -Eeuo pipefail
        python3 -u "$BUNDLE_DIR/checkpoint_probe.py" 2>&1 | tee "$EVIDENCE_DIR/experiment-console.log"
      env:
        MEMORY_HOOKS: '1'
    - name: Check fidelity matrix including valid negative controls
      id: fidelity_matrix
      if: ${{ !cancelled() && steps.experiment.outcome == 'success' }}
      shell: bash
      run: |
        set -Eeuo pipefail
        python3 -u "$BUNDLE_DIR/fidelity_matrix.py" 2>&1 | tee "$EVIDENCE_DIR/fidelity-matrix-console.log"
    - name: Run controlled counterfactual branches from ONE immutable checkpoint
      id: counterfactual_replay
      if: ${{ !cancelled() && steps.fidelity_matrix.outcome == 'success' && steps.repair_tests.outcome == 'success'
        }}
      shell: bash
      run: |
        set -Eeuo pipefail
        python3 -u "$BUNDLE_DIR/counterfactual_suite.py" 2>&1 | tee "$EVIDENCE_DIR/counterfactual-console.log"
      env:
        MEMORY_HOOKS: '1'
    - name: Collect runtime diagnostics after success or failure
      if: ${{ always() }}
      shell: bash
      run: |
        set -Eeuo pipefail
        mkdir -p "$EVIDENCE_DIR"
        sudo -n journalctl -u docker -u containerd --since '1 hour ago' --no-pager > "$EVIDENCE_DIR/runtime-journal.log" 2>&1 || true
        sudo -n dmesg --ctime > "$EVIDENCE_DIR/dmesg.log" 2>&1 || true
        sudo -n chown -R "$(id -u):$(id -g)" "$EVIDENCE_DIR" || true
    - name: Stop temporary live server and preserve a final static view
      id: stop_memory
      if: ${{ always() }}
      shell: bash
      run: |
        set -Eeuo pipefail
        python3 -u "$BUNDLE_DIR/memory_service.py" stop
    - name: Verify every dashboard frame and archive complete memory data
      id: memory_finalize
      if: ${{ always() }}
      shell: bash
      run: |
        set -Eeuo pipefail
        python3 -u "$BUNDLE_DIR/finalize_memory.py" 2>&1 | tee "$EVIDENCE_DIR/memory-finalize.log"
    - name: Generate HTML5 evidence viewer, including failed trials
      id: viewer
      if: ${{ always() }}
      shell: bash
      run: |
        set -Eeuo pipefail
        python3 -u "$BUNDLE_DIR/build_viewer.py" "$EVIDENCE_DIR" "$EVIDENCE_DIR/trajectory-explorer.html" 2>&1 | tee "$EVIDENCE_DIR/viewer-console.log"
    - name: Report one aggregate experiment verdict
      id: summary
      if: ${{ always() }}
      shell: bash
      run: |
        set -Eeuo pipefail
        python3 -u "$BUNDLE_DIR/report_tools.py" summary
    - name: Build static Pages site and complete downloadable log bundles
      id: pages_build
      if: ${{ always() }}
      shell: bash
      run: |
        set -Eeuo pipefail
        python3 -u "$BUNDLE_DIR/build_pages.py"
    - name: Build counterfactual trajectory release archive
      id: trajectory_archive
      if: ${{ always() }}
      shell: bash
      run: |
        set -Eeuo pipefail
        python3 - <<'PYTRAJECTORY'
        import hashlib,json,os,pathlib,zipfile
        root=pathlib.Path(os.environ['EVIDENCE_DIR'])
        archive=root/'trajectory-runs.zip'
        candidates=[]
        ext=root/'extended-replay'
        if ext.exists(): candidates += sorted(ext.glob('trial-*.json'))
        for name in ('counterfactual-suite.json','intervention-suite.json','memory-fidelity.json','overall.json','summary.md','trajectory-explorer.html'):
            p=root/name
            if p.is_file(): candidates.append(p)
        seen=set(); rows=[]
        with zipfile.ZipFile(archive,'w',compression=zipfile.ZIP_DEFLATED,compresslevel=6) as z:
            for p in candidates:
                p=p.resolve()
                if p in seen: continue
                seen.add(p)
                arc=p.relative_to(root).as_posix()
                z.write(p,arc)
                h=hashlib.sha256(p.read_bytes()).hexdigest()
                rows.append({'path':arc,'bytes':p.stat().st_size,'sha256':h})
            manifest={'schema':'v8-counterfactual-trajectories/v1','run_id':os.environ.get('GITHUB_RUN_ID'),
                      'run_attempt':os.environ.get('GITHUB_RUN_ATTEMPT'),'sha':os.environ.get('GITHUB_SHA'),
                      'files':rows,'scientific_result_may_be_failed':True}
            z.writestr('trajectory-release-manifest.json',json.dumps(manifest,indent=2)+'\n')
        digest=hashlib.sha256(archive.read_bytes()).hexdigest()
        (root/'trajectory-release-manifest.json').write_text(json.dumps({'status':'passed','archive':archive.name,
            'archive_bytes':archive.stat().st_size,'archive_sha256':digest,'members':rows},indent=2)+'\n')
        print('TRAJECTORY ARCHIVE',archive,archive.stat().st_size,digest,flush=True)
        PYTRAJECTORY
    - name: Archive trajectory run as GitHub Release
      id: github_release
      if: ${{ always() && steps.trajectory_archive.outcome == 'success' }}
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        GH_REPO: ${{ github.repository }}
        RELEASE_TAG: v8-trajectory-${{ github.run_id }}-${{ github.run_attempt }}
      run: |
        set -Eeuo pipefail
        notes="$EVIDENCE_DIR/release-notes.md"
        {
          printf '# V8 counterfactual trajectory run\n\n'
          printf -- '- Workflow run: `%s` attempt `%s`\n' "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT"
          printf -- '- Commit: `%s`\n' "$GITHUB_SHA"
          printf -- '- Scope: identical CRIU checkpoint, verified pre-intervention state, CONTROL/A/B post-restore interventions.\n'
          printf -- '- A published release is an evidence archive, not by itself a scientific PASS.\n\n'
          if [ -f "$EVIDENCE_DIR/summary.md" ]; then cat "$EVIDENCE_DIR/summary.md"; fi
        } > "$notes"
        gh release create "$RELEASE_TAG" --target "$GITHUB_SHA" --title "V8 trajectory run $GITHUB_RUN_ID/$GITHUB_RUN_ATTEMPT" --notes-file "$notes"
        assets=("$EVIDENCE_DIR/trajectory-runs.zip" "$EVIDENCE_DIR/trajectory-release-manifest.json")
        for f in "$EVIDENCE_DIR/memory-data.zip" "$EVIDENCE_DIR/evidence-logs.zip" "$EVIDENCE_DIR/full-run.log.gz" "$EVIDENCE_DIR/counterfactual-suite.json" "$EVIDENCE_DIR/overall.json" "$EVIDENCE_DIR/trajectory-explorer.html"; do
          [ -f "$f" ] && assets+=("$f")
        done
        gh release upload "$RELEASE_TAG" "${assets[@]}" --clobber
        release_url="https://github.com/$GITHUB_REPOSITORY/releases/tag/$RELEASE_TAG"
        python3 - "$EVIDENCE_DIR/release-report.json" "$RELEASE_TAG" "$release_url" <<'PYRELEASE'
        import datetime,json,pathlib,sys
        pathlib.Path(sys.argv[1]).write_text(json.dumps({'status':'passed','tag':sys.argv[2],'url':sys.argv[3],
          'utc':datetime.datetime.now(datetime.timezone.utc).isoformat(),'archive':'trajectory-runs.zip'},indent=2)+'\n')
        PYRELEASE
        printf '## GitHub Release archive\n%s\n' "$release_url" >> "$GITHUB_STEP_SUMMARY"
    - name: Hash and list all preserved evidence
      if: ${{ always() }}
      shell: bash
      run: |
        set -Eeuo pipefail
        python3 -u "$BUNDLE_DIR/report_tools.py" inventory
    - name: Upload evidence even when experiments fail
      id: evidence_upload
      if: ${{ always() }}
      uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
      with:
        name: v8-checkpoint-atlas-${{ github.run_id }}-${{ github.run_attempt }}
        path: ${{ env.EVIDENCE_DIR }}/
        if-no-files-found: error
        retention-days: 14
    - name: Upload separately downloadable logs
      if: ${{ always() && steps.pages_build.outcome == 'success' }}
      uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
      with:
        name: v8-downloadable-logs-${{ github.run_id }}-${{ github.run_attempt }}
        path: |
          ${{ env.EVIDENCE_DIR }}/full-run.log
          ${{ env.EVIDENCE_DIR }}/full-run.log.gz
          ${{ env.EVIDENCE_DIR }}/evidence-logs.zip
          ${{ env.EVIDENCE_DIR }}/status.json
          ${{ env.EVIDENCE_DIR }}/memory-data.zip
          ${{ env.EVIDENCE_DIR }}/memory-fidelity.json
          ${{ env.EVIDENCE_DIR }}/trajectory-runs.zip
          ${{ env.EVIDENCE_DIR }}/trajectory-release-manifest.json
          ${{ env.EVIDENCE_DIR }}/release-report.json
        if-no-files-found: error
        retention-days: 14
    - name: Upload Pages artifact independently of experiment success
      id: pages_artifact
      if: ${{ !cancelled() && inputs.publish_pages && steps.pages_build.outcome == 'success' }}
      uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b
      with:
        path: pages-site
    - name: Fail on any missing fidelity, telemetry, or required report
      id: final_gate
      if: ${{ always() }}
      shell: bash
      run: |
        set +e
        set -uo pipefail
        python3 -u "$BUNDLE_DIR/report_tools.py" gate
        experiment_rc=$?
        python3 - <<'PYPACKAGE'
        import json,os,pathlib
        p=pathlib.Path(os.environ['EVIDENCE_DIR'])/'pages-build.json'
        r=json.loads(p.read_text()) if p.exists() else {'status':'missing'}
        print('FINAL LOG PACKAGE |',r.get('status'),'|',r.get('exception',''),flush=True)
        raise SystemExit(0 if r.get('status')=='passed' else 1)
        PYPACKAGE
        package_rc=$?
        python3 - <<'PYRELEASEGATE'
        import json,os,pathlib
        p=pathlib.Path(os.environ['EVIDENCE_DIR'])/'release-report.json'
        r=json.loads(p.read_text()) if p.exists() else {'status':'missing'}
        print('FINAL RELEASE ARCHIVE |',r.get('status'),'|',r.get('tag',''),r.get('url',''),flush=True)
        raise SystemExit(0 if r.get('status')=='passed' else 1)
        PYRELEASEGATE
        release_rc=$?
        if [ "$experiment_rc" -ne 0 ] || [ "$package_rc" -ne 0 ] || [ "$release_rc" -ne 0 ]; then exit 1; fi
  deploy_pages:
    name: Publish static evidence, including failed experiment reports
    needs: feasibility
    if: ${{ !cancelled() && needs.feasibility.outputs.pages_artifact == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
    - name: Check configured Pages site
      uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b
    - name: Deploy static site
      id: deployment
      uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
    - name: Record website URL
      env:
        PAGE_URL: ${{ steps.deployment.outputs.page_url }}
      shell: bash
      run: |
        printf "GitHub Pages: %s\n" "$PAGE_URL"
        printf "## Published evidence\n%s\n" "$PAGE_URL" >> "$GITHUB_STEP_SUMMARY"

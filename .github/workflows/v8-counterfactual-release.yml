            def test_compact_trial_retains_boundaries(self):
                c=viewer.compact_trial({'trial':{'trial':1,'resume':self.es[0]},'events':self.es});self.assertIn('heap_words',c['events'][0]);self.assertNotIn('heap_words',c['events'][1])
            def test_counterfactual_same_arm_ignores_trial_metadata(self):
                a=copy.deepcopy(self.es);b2=copy.deepcopy(self.es)
                for e in a:

        def exact_state(a,b):
            keys=('token','tick','digest','hot','words','heap_words','graph','wasm')
            return base.valid_state(a) and base.valid_state(b) and all(a.get(k)==b.get(k) for k in keys)
        
        
        def apply_arm(gate, arm):

        async function refresh(){if(S.loading)return;S.loading=true;try{S.manifest=await get('manifest.json');S.metrics=await get('metrics.json');const m=S.manifest;$('mode').textContent=m.mode==='live'?'LIVE / POLLING':'STATIC ARCHIVE';$('mode').className='pill '+(m.mode==='live'?'live':'');$('run').textContent='Run '+m.run_id+' / '+m.revision;$('phase').textContent=m.stage;$('overall').textContent=m.status?.toUpperCase()||'UNKNOWN';$('overall').className='pill '+(m.status==='failed'?'bad':'');$('frameCount').textContent=m.frames.toLocaleString();$('trialCount').textContent=trials().length+' recorded replay lanes';$('freshness').textContent='Updated '+new Date(m.updated_utc).toLocaleTimeString();$('scope').textContent=m.scope;if(m.capture){$('checkpoint').textContent=m.capture.checkpoint+' / observed counter '+m.capture.tick;$('checkpointHash').textContent='Checkpoint manifest '+m.capture.checkpoint_sha256.slice(0,20)+'...'}if(!S.trial&&trials().length)S.trial=trials().at(-1).id;if($('follow').checked&&trials().length)S.trial=trials().at(-1).id;if(selected()){S.index=await get(selected().index);if($('follow').checked)S.pos=Math.max(0,S.index.frames.length-1);else S.pos=Math.min(S.pos,S.index.frames.length-1)}renderTrials();renderMetrics();const es=await get('events.json');$('events').textContent=es.events.map(e=>e.utc.slice(11,19)+'  '+e.kind+'  '+(e.label||e.message||e.stage||'')+(e.passed===true?'  PASS':e.passed===false?'  FAIL':'')).join('\n');$('events').scrollTop=$('events').scrollHeight;if($('follow').checked&&S.index?.frames.length)await inspect();if(!S.frame&&m.capture)await inspect(true);if(m.mode!=='live'&&!S.ended){S.ended=true;try{const d=await get('downloads.json');for(const x of d){if(!/^[a-z0-9.-]+$/.test(x.name))continue;const a=document.createElement('a');a.href=x.name;if(!x.name.endsWith('.html'))a.download=x.name;a.textContent=x.name;$('downloads').append(a)}}catch(_){}}clearError()}catch(e){fail(e)}finally{S.loading=false;if(!S.ended)setTimeout
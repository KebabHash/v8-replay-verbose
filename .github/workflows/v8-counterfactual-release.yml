    - name: Embed netns_guard.py [1/1]
      shell: bash
      run: |
        set -Eeuo pipefail
        cat > "$BUNDLE_DIR/netns_guard.py" <<'MEMORY8_NETNS_GUARD_PY_1'
        """Same-host external network-namespace fixture for Moby #50750.

        The keeper is NOT checkpointed. The target joins its pre-existing, loopback-only
        network namespace. Nothing here restores external namespace state. No host
        networking, synthetic PID, blind retry, or ordinary-start fallback is allowed.
        """
        import json
        import re

        ISSUE = 'https://github.com/moby/moby/issues/50750'


        def positive_pid(value):
            if type(value) is not int or value <= 1:
                raise ValueError('A live container PID greater than 1 is required; refusing /proc/0 or host init')
            return value


        def namespace_inode(text):
            match = re.fullmatch(r'net:\[([1-9][0-9]*)\]', text.strip())
            if not match:
                raise ValueError('Invalid network namespace identity: ' + repr(text))
            return int(match.group(1))


        def isolation_checks(links, routes4, routes6, keeper_ns, host_ns, target_ns=None):
            def valid_routes(rows):
                return isinstance(rows, list) and all(isinstance(r, dict) and
                    r.get('dev') == 'lo' and r.get('dst') != 'default' and not r.get('gateway') and
                    not r.get('multipath') and not r.get('nexthops') for r in rows)
            names = [x.get('ifname') for x in links if isinstance(x, dict)] if isinstance(links, list) else []
            return {
                'keeper_namespace_valid': type(keeper_ns) is int and keeper_ns > 0,
                'host_namespace_valid': type(host_ns) is int and host_ns > 0,
                'not_host_network_namespace': keeper_ns != host_ns,
                'only_loopback_interface': names == ['lo'] and len(links) == 1,
                'ipv4_routes_loopback_only': valid_routes(routes4),
                'ipv6_routes_loopback_only': valid_routes(routes6),
                **({'target_joins_keeper_namespace': target_ns == keeper_ns} if target_ns is not None else {}),
            }


        def classify_restore_error(text):
            if 'bind-mount /proc/0/ns/net' in text:
                return {'code': 'docker_network_namespace_pid_zero', 'reference': ISSUE,
                        'explanation': 'Known Docker restore namespace lifecycle signature; not a heap-fidelity result.',
                        'action': 'Inspect network-*.json, namespace keeper liveness, daemon journal and CRIU restore logs. No host-network fallback.'}
            return {'code': 'runtime_restore_failed',
                    'explanation': 'Restore did not complete. The exact command error remains authoritative.',
                    'action': 'Inspect checkpoint-restore stderr, runtime journal, and CRIU dump/restore logs.'}


        class NetworkNamespaceGuard:
            """Keep a distinct namespace alive and validate its identity at every boundary."""
            def __init__(self, audit, image, suffix):
                if not re.fullmatch(r'[a-f0-9]{12}', suffix):
                    raise ValueError('Keeper suffix must be twelve hexadecimal characters')
                self.audit = audit
                self.image = image
                self.name = 'v8-netns-' + suffix
                self.cid = None
                self.pid = None
                self.inode = None
                self.started_at = None
                self.cleanup_needed = False
                self.history = []

            def _inspect(self, container):
                _, out, _ = self.audit.run('netns-inspect',
                    ['docker', 'inspect', '--format', '{{json .}}', container], required=True)
                obj = json.loads(out)
                if not isinstance(obj, dict):
                    raise ValueError('Expected Docker inspect object')
                return obj

            def _inode(self, pid, label):
                # Host identity has a separate explicit read below; never pass PID 1 here.
                positive_pid(pid)
                _, out, _ = self.audit.run(label, ['sudo', '-n', 'readlink', f'/proc/{pid}/ns/net'], required=True)
                return namespace_inode(out)

            def _network_json(self, pid, arguments, label):
                positive_pid(pid)
                _, out, _ = self.audit.run(label,
                    ['sudo', '-n', 'nsenter', '--target', str(pid), '--net', '--', 'ip', '-j', *arguments], required=True)
                data = json.loads(out)
                if not isinstance(data, list):
                    raise ValueError('Expected iproute2 JSON array')
                return data

            def start(self):
                a = self.audit
                a.event('network_strategy', strategy='persistent-isolated-keeper', reference=ISSUE,
                    external_state='Loopback-only namespace retained, not rewound', host_network=False,
                    target_image_modified=False, engine_downgraded=False)
                command = ['docker', 'create', '--name', self.name, '--network', 'none',
                    '--label', 'v8.atlas.role=netns-keeper', '--label', 'v8.atlas.revision=repair-6',
                    '--read-only', '--cap-drop', 'ALL', '--security-opt', 'no-new-privileges',
                    '--memory', '64m', '--memory-swap', '64m', '--cpus', '0.1', '--pids-limit', '16',
                    '--restart', 'no', '--entrypoint', '/bin/sh', self.image, '-c', 'exec sleep 2147483647']
                # Mark for cleanup before create, so partial runtime failures are not ignored.
                self.cleanup_needed = True
                _, out, _ = a.run('netns-keeper-create', command, required=True)
                self.cid = out.strip()
                a.require('namespace keeper has a full Docker ID', bool(re.fullmatch(r'[a-f0-9]{64}', self.cid)), self.cid)
                a.run('netns-keeper-start', ['docker', 'start', self.cid], required=True)
                initial = self.verify('keeper-created')
                self.pid = initial['keeper_pid']
                self.inode = initial['keeper_inode']
                self.started_at = initial['keeper_started_at']
                a.report['external_dependencies'] = self.description()
                return 'container:' + self.cid

            def description(self):
                return {'strategy': 'persistent-isolated-keeper', 'keeper_name': self.name,
                        'keeper_id': self.cid, 'keeper_pid': self.pid, 'keeper_network_inode': self.inode,
                        'checkpointed': False, 'restoration_scope': 'Same-host target process; retained loopback namespace fixture',
                        'host_network': False, 'namespace_state_rewound': False,
                        'checks_recorded': len(self.history), 'reference': ISSUE}

            def verify(self, boundary, target=None):
                if not re.fullmatch(r'[a-zA-Z0-9_-]+', boundary):
                    raise ValueError('Unsafe diagnostic filename')
                a = self.audit
                keeper = self._inspect(self.cid or self.name)
                state = keeper.get('State', {})
                a.require(boundary + ': keeper still running', state.get('Running') is True, state)
                pid = positive_pid(state.get('Pid'))
                a.require(boundary + ': keeper remains isolated',
                          keeper.get('HostConfig', {}).get('NetworkMode') == 'none')
                a.require(boundary + ': keeper identity unchanged', keeper.get('Id') == self.cid)
                a.require(boundary + ': keeper never restarted', keeper.get('RestartCount') == 0)
                if self.pid is not None:
                    a.require(boundary + ': keeper PID and start time unchanged',
                        pid == self.pid and state.get('StartedAt') == self.started_at,
                        {'old_pid': self.pid, 'pid': pid, 'started_at': state.get('StartedAt')})
                inode = self._inode(pid, 'netns-keeper-inode')
                if self.inode is not None:
                    a.require(boundary + ': keeper namespace retained', inode == self.inode,
                        {'captured_inode': self.inode, 'current_inode': inode})
                _, out, _ = a.run('netns-host-inode', ['sudo', '-n', 'readlink', '/proc/1/ns/net'], required=True)
                host_inode = namespace_inode(out)
                links = self._network_json(pid, ['link', 'show'], 'netns-links')
                routes4 = self._network_json(pid, ['-4', 'route', 'show', 'table', 'all'], 'netns-ipv4-routes')
                routes6 = self._network_json(pid, ['-6', 'route', 'show', 'table', 'all'], 'netns-ipv6-routes')
                target_pid, target_inode = None, None
                if target is not None:
                    inspected = self._inspect(target)
                    a.require(boundary + ': target running for namespace verification',
                        inspected.get('State', {}).get('Running') is True, inspected.get('State'))
                    a.require(boundary + ': target uses explicit keeper namespace',
                        inspected.get('HostConfig', {}).get('NetworkMode') == 'container:' + self.cid,
                        inspected.get('HostConfig', {}).get('NetworkMode'))
                    target_pid = positive_pid(inspected['State'].get('Pid'))
                    target_inode = self._inode(target_pid, 'netns-target-inode')
                checks = isolation_checks(links, routes4, routes6, inode, host_inode, target_inode)
                item = {'boundary': boundary, 'keeper_pid': pid, 'keeper_inode': inode,
                    'keeper_started_at': state.get('StartedAt'), 'host_inode': host_inode,
                    'target_pid': target_pid, 'target_inode': target_inode, 'links': links,
                    'ipv4_routes': routes4, 'ipv6_routes': routes6, 'checks': checks,
                    'external_namespace_retained_not_rewound': True}
                self.history.append(item)
                (a.root / ('network-' + boundary + '.json')).write_text(json.dumps(item, indent=2) + '\n')
                a.event('network_namespace_evidence', **item)
                for key, passed in checks.items():
                    a.require(boundary + ': ' + key, passed)
                return item

            def close(self, target=None):
                if not self.cleanup_needed:
                    return
                a = self.audit
                if target:
                    rc, out, err = a.run('netns-cleanup-target-check',
                        ['docker', 'inspect', '--format', '{{json .State}}', target])
                    if rc == 0:
                        # Remove the target BEFORE releasing its external namespace.
                        rc, _, _ = a.run('netns-cleanup-target', ['docker', 'rm', '-f', target])
                        if rc != 0:
                            raise RuntimeError('Target cleanup failed; retaining its namespace keeper until disposable runner teardown')
                    elif 'no such object' not in err.lower() and 'no such container' not in err.lower():
                        raise RuntimeError('Cannot establish target absence; retaining namespace keeper until runner teardown')
                rc, _, err = a.run('netns-keeper-cleanup', ['docker', 'rm', '-f', self.cid or self.name])
                if rc != 0 and 'no such container' not in err.lower():
                    raise RuntimeError('Namespace keeper cleanup failed; see command logs')
                self.cleanup_needed = False
        MEMORY8_NETNS_GUARD_PY_1
    - name: Embed checkpoint_probe.py [1/3]
      shell: bash
      run: |
        set -Eeuo pipefail
        cat > "$BUNDLE_DIR/checkpoint_probe.py" <<'MEMORY8_CHECKPOINT_PROBE_PY_1'
        import datetime
        import hashlib
        import json
        import os
        from pathlib import Path
        import re
        import shlex
        import signal
        import subprocess
        import sys
        import threading
        import time
        import traceback
        import uuid
        from netns_guard import NetworkNamespaceGuard, classify_restore_error

        # No removed shell file APIs are required. The native binary is not patched.
        # Timed rendezvous: the tracked probe words stay unchanged during a wall-clock gate.
        # The controller checkpoints before the gate expires, waits while STOPPED, then restores.
        # Date/time is deliberately external and advancing; this is not clock replay.
        PROBE_JS = r'''"use strict";
        const CONFIG = __PROBE_CONFIG__;
        const writeLine = (typeof globalThis.print === "function")
          ? (s) => globalThis.print(s)
          : (typeof globalThis.console === "object" && typeof globalThis.console.log === "function")
            ? (s) => globalThis.console.log(s)
            : null;
        if (!writeLine) throw new Error("No supported output API: neither print nor console.log is available");
        const token = Array.from({length: 6}, () =>
          Math.floor(Math.random() * 4294967296).toString(16).padStart(8, "0")
        ).join("") + "-" + Date.now().toString(16);
        const heap = new Uint32Array(4096);
        let seed = 2166136261 >>> 0;
        for (const c of token) seed = Math.imul(seed ^ c.charCodeAt(0), 16777619) >>> 0;
        for (let i = 0; i < heap.length; i++) {
          seed = (Math.imul(seed, 1664525) + 1013904223) >>> 0;
          heap[i] = seed;
        }
        let tick = 0, hotResult = 0;
        function hot(x) { return (Math.imul(x ^ 0x12345678, 17) + 3) | 0; }
        function digest() {
          let h = 2166136261 >>> 0;
          for (let i = 0; i < heap.length; i++) h = Math.imul(h ^ heap[i], 16777619) >>> 0;
          return h.toString(16).padStart(8, "0");
        }
        function emit(event, ticket = "", extra = {}) {
          const state = {event, ticket, token, tick, digest: digest(), hot: hotResult, words: heap.length, ...extra};
          if (event === "paused" || event === "resumed") state.heap_words = Array.from(heap);
          writeLine("V8_PROBE " + JSON.stringify(state));
        }
        function delay(ms) { const end = Date.now() + ms; while (Date.now() < end) {} }
        function advance() {
          for (let j = 0; j < 20000; j++) {
            const i = (j + tick) & (heap.length - 1);
            hotResult = hot((heap[i] + j) | 0);
            heap[i] = (heap[i] ^ hotResult) >>> 0;
          }
          tick++;
          emit("tick");
        }

# ONE self-contained file: replace .github/workflows/v8-replay-verbose.yml.
# MEMORY-8: early read-only live webserver, optional public tunnel, exact per-step
# 16 KiB probe-array fidelity, sampled native memory mappings, mandatory compact
# manifest for ALL replay frames, final static GitHub Pages, downloadable logs.
# Disposable hosted x86-64 runner ONLY. Docker is restarted. No secrets in workload.
# The tunnel is PUBLIC when enabled. Disable public_live_view to keep live server local.
# Pages is NOT the live server. Tunnel ends at job exit; Pages holds final static data.
# Only the probe array is byte-verified; no complete native heap/register/JIT guarantee.
# No remote restore or command-execution endpoint. Internet needed for dependencies.
name: V8 Memory Atlas - memory-9 - counterfactual branching + release archive
'on':
  workflow_dispatch:
    inputs:
      restore_rounds:
        description: Base checkpoint cycles (2-5; full fidelity suite requires at least 2)
        type: string
        default: '2'
      warmup_seconds:
        description: Work before each checkpoint boundary (1-30 seconds)
        type: string
        default: '3'
      timed_gate_seconds:
        description: Pause window for capture (15-180 seconds). Host waits out the gate while target is stopped.
        type: string
        default: '45'
      replay_trials:
        description: Same-input restores of one saved checkpoint (3-100)
        type: string
        default: '30'
      replay_steps:
        description: Exact array observations per trial (1-1000); trials * steps must be <= 12000
        type: string
        default: '250'
      publish_pages:
        description: Publish evidence and logs to configured GitHub Pages (public information)
        type: boolean
        default: true
      step_pause_ms:
        description: Pause after each measured computation step (0-100 ms); 25 makes live inspection useful. This
          affects timing.
        type: string
        default: '25'
      public_live_view:
        description: Create temporary PUBLIC read-only Cloudflare URL during run (synthetic array + process metadata
          only)
        type: boolean
        default: true
permissions:
  contents: read
concurrency:
  group: v8-checkpoint-atlas
  cancel-in-progress: false
jobs:
  feasibility:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write
    env:
      BUNDLE_DIR: ${{ github.workspace }}/.v8-checkpoint-atlas
      EVIDENCE_DIR: ${{ github.workspace }}/evidence
      IMAGE: cybergym/v8@sha256:d53b336a90e184fe61c2067342eb278f6d54d009d7b4d93b958029b86904e48a
      CRIU_VERSION: '4.3'
      CRIU_COMMIT: 2b7ac603cda31d015d91c856c34c557cb2300e7d
      RESTORE_ROUNDS: ${{ inputs.restore_rounds || '2' }}
      WARMUP: ${{ inputs.warmup_seconds || '3' }}
      TIMED_GATE_SECONDS: ${{ inputs.timed_gate_seconds || '45' }}
      FORK_TRIALS: ${{ inputs.replay_trials || '30' }}
      HEARTBEAT_SECONDS: '5'
      PYTHONUNBUFFERED: '1'
      DOCKER_CLI_EXPERIMENTAL: enabled
      WORKFLOW_REVISION: memory-9
      REPLAY_STEPS: ${{ inputs.replay_steps || '250' }}
      MEMORY_SITE: ${{ github.workspace }}/memory-live
      STEP_PAUSE_MS: ${{ inputs.step_pause_ms || '25' }}
    outputs:
      pages_artifact: ${{ steps.pages_artifact.outcome }}
    steps:
    - name: Initialize memory-8 and private observer directory
      id: initialize
      shell: bash
      run: |
        set -Eeuo pipefail
        mkdir -p "$BUNDLE_DIR" "$EVIDENCE_DIR" "$EVIDENCE_DIR/sources"
        printf 'Workflow revision: memory-8
        '
        printf 'Single YAML: source-built CRIU, live checkpoint, strict repeated replay, offline HTML, downloadable logs.
        '
        printf 'No checkout or API keys. Internet is needed for APT, CRIU source, image pull, and official Actions.
        '
        printf 'Disposable hosted runner only. Docker will restart. Public Pages logs must contain no secrets.
        '
        printf 'Run=%s attempt=%s sha=%s
        ' "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$GITHUB_SHA"
        printf 'Bundle=%s
        Evidence=%s
        ' "$BUNDLE_DIR" "$EVIDENCE_DIR"

        export MEMORY_PRIVATE="$RUNNER_TEMP/v8-memory-atlas-private"
        mkdir -p "$MEMORY_PRIVATE" "$MEMORY_SITE"
        chmod 700 "$MEMORY_PRIVATE"
        printf 'MEMORY_PRIVATE=%s\n' "$MEMORY_PRIVATE" >> "$GITHUB_ENV"
        printf 'Dashboard is read-only. GitHub Pages receives static final evidence; live URL expires at job end.\n'
        python3 - <<'PREFLIGHT_BUDGET'
        import os
        trials=int(os.environ['FORK_TRIALS']);steps=int(os.environ['REPLAY_STEPS']);pause=int(os.environ['STEP_PAUSE_MS'])
        if not (6 <= trials <= 99 and 1 <= steps <= 1000 and 0 <= pause <= 100):
         raise SystemExit('Inputs outside supported bounds; check trial/step/pause values')
        if trials*steps > 12000:
         raise SystemExit('Full-frame data budget exceeded: replay_trials * replay_steps must be <= 12000')
        print(f'Full-state plan: {trials} trials x {steps} steps, {trials*(steps+2)} replay frames plus captured state; pause {pause} ms')
        PREFLIGHT_BUDGET
    - name: Embed memory_bridge.py [1/1]
      shell: bash
      run: |
        set -Eeuo pipefail
        cat > "$BUNDLE_DIR/memory_bridge.py" <<'MEMORY8_MEMORY_BRIDGE_PY_1'
        """Public, read-only telemetry for an isolated synthetic probe; never reads process memory.
        A compact mandatory manifest references ALL frames; no size-budget omission of metadata.
        """
        from __future__ import annotations
        import base64, datetime, fcntl, hashlib, json, os, re, struct, tempfile, threading, time
        from pathlib import Path
        from contextlib import contextmanager

        SCHEMA = 'v8-memory-atlas/v1'
        LOCK = threading.RLock()

        def now(): return datetime.datetime.now(datetime.timezone.utc).isoformat()
        def enabled(): return os.environ.get('MEMORY_HOOKS') == '1'
        def public_root(): return Path(os.environ['MEMORY_SITE']).resolve()
        def private_root(): return Path(os.environ['MEMORY_PRIVATE']).resolve()

        def atomic(path, obj):
            path = Path(path); path.parent.mkdir(parents=True, exist_ok=True)
            data = json.dumps(obj, separators=(',', ':'), ensure_ascii=True, allow_nan=False)
            fd, tmp = tempfile.mkstemp(prefix='.pending-', dir=path.parent)
            try:
                with os.fdopen(fd, 'w', encoding='utf-8') as f: f.write(data + '\n')
                os.replace(tmp, path)
            finally:
                if os.path.exists(tmp): os.unlink(tmp)

        def load(path, default=None):
            try: return json.loads(Path(path).read_text())
            except (OSError, ValueError): return default

        @contextmanager
        def locked():
            root = private_root(); root.mkdir(parents=True, exist_ok=True)
            with LOCK, (root/'writer.lock').open('a') as f:
                fcntl.flock(f.fileno(), fcntl.LOCK_EX)
                try: yield
                finally: fcntl.flock(f.fileno(), fcntl.LOCK_UN)

        def initialize():
            root=public_root(); root.mkdir(parents=True, exist_ok=True)
            atomic(root/'manifest.json', {'schema':SCHEMA, 'revision':'memory-9', 'run_id':os.environ.get('GITHUB_RUN_ID','local'),
                'started_utc':now(), 'updated_utc':now(), 'mode':'live', 'stage':'initialization', 'status':'running',
                'image':os.environ.get('IMAGE'), 'capture':None, 'trials':[], 'frames':0,
                'scope':'Exact bytes of the 4096-word instrumented array; native process mappings are metadata, not byte snapshots.',
                'controls':'Read-only. Rewind selects recorded evidence, never calls Docker.',
                'unknowns':['Full V8 heap, native registers, JIT code identity, all thread schedules, external service state'],
                'live_poll_seconds':1, 'pages_mode':'static final archive'})
            atomic(root/'metrics.json', {'schema':SCHEMA,'samples':[],'latest':None,'status':'waiting'})
            atomic(root/'events.json', {'events':[]})
            atomic(private_root()/'target.json', {'target':None})

        def update_manifest(**fields):
            with locked():
                path=public_root()/'manifest.json'; obj=load(path,{})
                obj.update(fields, updated_utc=now()); atomic(path,obj)

        def event(kind, **fields):
            """Only deliberate schema fields go to the public server, not argv/env or stderr."""
            safe={k:v for k,v in fields.items() if k in ('stage','label','passed','exit_code','trial','status','count','message')}
            entry={'utc':now(),'kind':kind,**safe}
            with locked():
                root=public_root();obj=load(root/'events.json',{'events':[]})
                obj['events']=(obj['events']+[entry])[-240:];atomic(root/'events.json',obj)
                with (root/'events.log').open('a') as f:f.write(json.dumps(entry,sort_keys=True)+'\n')

        def register_target(name, executable):
            if not re.fullmatch(r'v8-(criu|extended|counterfactual)-[0-9a-f]{12}',name): return
            with locked():atomic(private_root()/'target.json',{'target':name,'executable_name':Path(executable).name,'registered_utc':now()})

        def on_audit_event(audit, kind, fields):
            if not enabled():return
            # Controlled names only; the HTTP server has no endpoint for selecting a PID.
            if kind=='command_start':
                args=fields.get('argv',[])
                if args[:2]==['docker','create'] and '--name' in args and '--entrypoint' in args:
                    register_target(args[args.index('--name')+1],args[args.index('--entrypoint')+1])
            update_manifest(stage=audit.stage)
            if kind in ('assertion','command_start','command_end','experiment_failed','round_start','capture'):
                event(kind,stage=audit.stage,label=fields.get('name',fields.get('label',kind)),passed=fields.get('passed'),exit_code=fields.get('exit_code'))

        def frame_payload(snapshot):
            words=snapshot.get('heap_words')
            if not isinstance(words,list) or len(words)!=4096 or any(type(x) is not int or not 0<=x<=0xffffffff for x in words):
                raise ValueError('Memory snapshot must contain exactly 4096 uint32 words')
            data=struct.pack('<4096I',*words)
            return {'schema':SCHEMA,'event':snapshot.get('event'),'tick':snapshot.get('tick'),'step':snapshot.get('step'),
                'token':snapshot.get('token'),'digest':snapshot.get('digest'),'hot':snapshot.get('hot'),
                'graph':snapshot.get('graph'), 'graph_values':snapshot.get('graph_values'), 'wasm':snapshot.get('wasm'),
                'word_count':4096,'byte_length':len(data),'encoding':'base64-little-endian-uint32',
                'sha256':hashlib.sha256(data).hexdigest(),'bytes_b64':base64.b64encode(data).decode(),
                'observed_utc':now(),'source':'Live probe JSON; not inferred from RAM utilization or generated from an oracle'}

        def captured(snapshot, checkpoint, checkpoint_hash):
            p=frame_payload(snapshot);p['checkpoint']=checkpoint;p['checkpoint_sha256']=checkpoint_hash
            atomic(public_root()/'data/captured.json',p)
            update_manifest(capture={'file':'data/captured.json','checkpoint':checkpoint,'checkpoint_sha256':checkpoint_hash,
                'sha256':p['sha256'],'tick':p['tick'],'status':'captured'})
            event('capture',message='Captured 16384 instrumented array bytes; waiting for actual restores')

        def begin_trial(number, checkpoint, checkpoint_hash, action='same-input-control', branch=None):
            number=int(number)
            if not 1<=number<=100:raise ValueError('Invalid trial number')
            ident=f'trial-{number:03d}'
            with locked():
                root=public_root();m=load(root/'manifest.json',{})
                if any(t['id']==ident for t in m['trials']):raise ValueError('Duplicate trial identity')
                m['trials'].append({'id':ident,'number':number,'status':'running','frames':0,'index':f'data/{ident}/index.json',
                    'checkpoint':checkpoint,'checkpoint_sha256':checkpoint_hash,'action':action,'branch':branch})
                m['updated_utc']=now();m['stage']=f'extended_restore_{number:03d}';atomic(root/'manifest.json',m)
                atomic(root/f'data/{ident}/index.json',{'id':ident,'frames':[]})
            event('trial_start',trial=number)

        def observation(number, snapshot):
            if snapshot.get('event') not in ('resumed','tick','done'):return
            if 'heap_words' not in snapshot:return
            ident=f'trial-{int(number):03d}'
            kind=snapshot['event'];key=f'step-{snapshot.get("step",0):04d}' if kind=='tick' else kind
            if not re.fullmatch(r'(resumed|done|step-\d{4})',key):raise ValueError('Invalid frame identity')
            with locked():
                root=public_root();idx_path=root/f'data/{ident}/index.json';idx=load(idx_path,{'id':ident,'frames':[]})
                existing=next((r for r in idx['frames'] if r['id']==key),None)
                p=frame_payload(snapshot)
                if existing:
                    old=load(root/existing['file'],{})
                    if {k:v for k,v in old.items() if k!='observed_utc'} != {k:v for k,v in p.items() if k!='observed_utc'}:
                        raise ValueError('Conflicting observation for same trial/frame')
                    return
                rel=f'data/{ident}/{key}.json';atomic(root/rel,p)
                idx['frames'].append({'id':key,'event':kind,'step':snapshot.get('step'),'tick':snapshot.get('tick'),
                    'sha256':p['sha256'],'digest':p['digest'],'file':rel})
                order=lambda r: -1 if r['event']=='resumed' else 100000 if r['event']=='done' else r['step']
                idx['frames'].sort(key=order);atomic(idx_path,idx)
                m=load(root/'manifest.json',{});trial=next(t for t in m['trials'] if t['id']==ident)
                trial['frames']=len(idx['frames']);trial['latest']=rel;trial['latest_tick']=p['tick']
                m['frames']=sum(t['frames'] for t in m['trials']);m['updated_utc']=now();atomic(root/'manifest.json',m)

        def finish_trial(number,checks,restore_s,status='passed'):
            with locked():
                root=public_root();m=load(root/'manifest.json',{});t=next(t for t in m['trials'] if t['number']==number)
                t.update(status=status,checks=checks,restore_s=restore_s);m['updated_utc']=now();atomic(root/'manifest.json',m)
            event('trial_complete',trial=number,status=status)

        def coverage(root,requested,horizon):
            root=Path(root);m=load(root/'manifest.json',{});errors=[]
            if not m.get('capture'):errors.append('No capture frame')
            else:
                c=load(root/m['capture']['file'],{})
                try:
                    raw=base64.b64decode(c['bytes_b64'],validate=True)
                    if len(raw)!=16384 or hashlib.sha256(raw).hexdigest()!=m['capture']['sha256'] or c['sha256']!=m['capture']['sha256']:
                        errors.append('Capture frame failed byte integrity')
                except (ValueError,KeyError):errors.append('Capture frame missing or malformed')
            if len(m.get('trials',[]))!=requested:errors.append('Wrong trial count')
            for t in m.get('trials',[]):
                idx=load(root/t['index'],{});rows=idx.get('frames',[])
                wanted=['resumed']+[f'step-{i:04d}' for i in range(1,horizon+1)]+['done']
                if [x['id'] for x in rows]!=wanted:errors.append(t['id']+': missing or unordered frames')
                if t.get('status')!='passed':errors.append(t['id']+': trial not passed')
                for row in rows:
                    p=load(root/row['file'],{})
                    try:
                        raw=base64.b64decode(p['bytes_b64'],validate=True)
                        if len(raw)!=16384 or hashlib.sha256(raw).hexdigest()!=row['sha256'] or p['sha256']!=row['sha256']:
                            errors.append(t['id']+'/'+row['id']+': hash or length mismatch')
                    except (ValueError,KeyError):errors.append(t['id']+'/'+row['id']+': invalid frame')
            return {'status':'passed' if not errors else 'failed','requested_trials':requested,'horizon':horizon,
                'observed_trials':len(m.get('trials',[])),'frames':sum(t.get('frames',0) for t in m.get('trials',[])),
                'expected_frames':requested*(horizon+2),'errors':errors[:100],
                'scope':'File completeness plus SHA256 for 16 KiB of instrumented words, not the complete native heap'}
        MEMORY8_MEMORY_BRIDGE_PY_1
    - name: Embed proc_metrics.py [1/1]
      shell: bash
      run: |
        set -Eeuo pipefail
        cat > "$BUNDLE_DIR/proc_metrics.py" <<'MEMORY8_PROC_METRICS_PY_1'
        """Privileged read-only metrics for a validated Docker d8 PID; no /proc/PID/mem access."""
        import datetime,json,os,re,sys,time
        from pathlib import Path

        def parse_maps(text):
            rows=[]
            for line in text.splitlines():
                parts=line.split(None,5)
                if len(parts)<5:continue
                left,right=parts[0].split('-');a,b=int(left,16),int(right,16)
                if b<a:raise ValueError('Invalid mapping extent')
                name=parts[5] if len(parts)>5 else '[anonymous]'
                if not name.startswith('['):name=Path(name).name
                rows.append({'start':left,'end':right,'bytes':b-a,'permissions':parts[1],
                             'offset':parts[2],'kind':name[:100]})
            return rows

        def kb_fields(text):
            out={}
            for line in text.splitlines():
                if ':' not in line:continue
                k,v=line.split(':',1);bits=v.split()
                if bits and bits[0].isdigit():out[k]=int(bits[0])*(1024 if len(bits)>1 and bits[1]=='kB' else 1)
            return out

        def start_identity(p):
            # Field 22, after comm in parentheses (which can contain spaces).
            return int((p/'stat').read_text().rsplit(')',1)[1].split()[19])

        def collect(pid,cid,executable):
            if not re.fullmatch(r'[1-9][0-9]*',str(pid)) or not re.fullmatch(r'[0-9a-f]{64}',cid):raise ValueError('Invalid PID/container identity')
            if executable!='d8':raise ValueError('Only the d8 target is permitted')
            p=Path('/proc')/str(pid);identity=start_identity(p)
            cg=(p/'cgroup').read_text()
            if cid not in cg:raise ValueError('PID is not a member of the selected Docker container')
            if Path(os.readlink(p/'exe')).name.removesuffix(' (deleted)')!=executable:raise ValueError('PID executable is not d8')
            status=kb_fields((p/'status').read_text());roll=kb_fields((p/'smaps_rollup').read_text())
            maps=parse_maps((p/'maps').read_text());counts={};bytes_by_perm={}
            for m in maps:bytes_by_perm[m['permissions']]=bytes_by_perm.get(m['permissions'],0)+m['bytes']
            for fd in (p/'fd').iterdir():
                try:
                    s=os.readlink(fd);kind='socket' if s.startswith('socket:') else 'pipe' if s.startswith('pipe:') else 'anon_inode' if s.startswith('anon_inode:') else 'device' if s.startswith('/dev/') else 'file'
                    counts[kind]=counts.get(kind,0)+1
                except OSError:pass
            out={'utc':datetime.datetime.now(datetime.timezone.utc).isoformat(),'status':'running','pid':int(pid),
                'process_start_ticks':identity,'rss_bytes':roll.get('Rss'),'pss_bytes':roll.get('Pss'),
                'private_dirty_bytes':roll.get('Private_Dirty'),'swap_bytes':roll.get('Swap'),
                'virtual_bytes':status.get('VmSize'),'native_threads':status.get('Threads'),'fd_types':counts,
                'mapping_count':len(maps),'mapping_limit':2048,'mappings':maps[:2048],'mapping_bytes_by_permissions':bytes_by_perm,
                'mappings_omitted':max(0,len(maps)-2048),'source':'/proc/PID/status, smaps_rollup, maps, fd and cgroup v2',
                'atomic_snapshot':False,'measurement_scope':'Live metadata; no native memory bytes, registers or stack contents are read'}
            for line in cg.splitlines():
                if line.startswith('0::'):
                    base=Path('/sys/fs/cgroup');c=(base/line[3:].lstrip('/')).resolve()
                    if base not in c.parents and c!=base:raise ValueError('Invalid cgroup path')
                    for name in ('memory.current','memory.peak','memory.max','memory.events','memory.swap.max'):
                        try:out[name]=(c/name).read_text().strip()
                        except OSError:out[name]=None
            if start_identity(p)!=identity:raise ValueError('PID identity changed while sampling')
            return out

        if __name__=='__main__':
            try:print(json.dumps(collect(*sys.argv[1:4]),separators=(',',':')))
            except Exception as exc:print(json.dumps({'status':'unavailable','error':type(exc).__name__+': '+str(exc)}));sys.exit(1)
        MEMORY8_PROC_METRICS_PY_1
    - name: Embed memory_service.py [1/1]
      shell: bash
      run: |
        set -Eeuo pipefail
        cat > "$BUNDLE_DIR/memory_service.py" <<'MEMORY8_MEMORY_SERVICE_PY_1'
        """Early read-only web server and independent native metadata sampler.
        Only the dedicated telemetry directory is served. No execution/control endpoints.
        """
        from __future__ import annotations
        import argparse,datetime,gzip,hashlib,http.server,json,os,re,shutil,signal,subprocess,sys,threading,time,urllib.parse,urllib.request
        from pathlib import Path
        from memory_bridge import atomic,load,now,initialize,public_root,private_root,update_manifest,event,coverage
        STOP=threading.Event()

        def host_memory():
            try:
                vals={x.split(':')[0]:int(x.split()[1])*1024 for x in Path('/proc/meminfo').read_text().splitlines() if ':' in x}
                return {'host_total_bytes':vals.get('MemTotal'),'host_available_bytes':vals.get('MemAvailable')}
            except (OSError,ValueError):return {}

        def command(argv,timeout=4):
            p=subprocess.run(argv,capture_output=True,text=True,timeout=timeout)
            if p.returncode:raise RuntimeError(p.stderr[-500:] or p.stdout[-500:] or 'Command failed')
            return p.stdout

        def sampler():
            root=public_root();history=[];samples=0;running=0;failures=0
            while not STOP.is_set():
                row={'utc':now(),'status':'waiting_for_target',**host_memory()}
                selected=load(private_root()/'target.json',{})
                name=selected.get('target')
                if name:
                    row['target']=name
                    try:
                        d=json.loads(command(['docker','inspect',name]))[0]
                        s=d['State'];row['docker_state']=s.get('Status')
                        if s.get('Running') and type(s.get('Pid')) is int and s['Pid']>0:
                            result=command(['sudo','-n','python3',str(Path(__file__).with_name('proc_metrics.py')),str(s['Pid']),d['Id'],selected.get('executable_name','')],8)
                            row.update(json.loads(result))
                            if row.get('status')=='running':running+=1
                        else:row['status']='target_stopped';row['pid']=None
                    except Exception as exc:
                        row.update(status='temporarily_unavailable',error=str(exc)[:500]);failures+=1
                samples+=1;history.append(row)
                # Complete samples are archived as JSONL; charts use slim samples, not duplicated mapping arrays.
                with (root/'native-metrics.jsonl').open('a') as f:f.write(json.dumps(row,separators=(',',':'))+'\n')
                slim={k:v for k,v in row.items() if k not in ('mappings','mapping_bytes_by_permissions')}
                history[-1]=slim;history=history[-600:]
                atomic(root/'metrics.json',{'status':row['status'],'latest':row,'samples':history,'samples_total':samples,
                    'running_samples':running,'unavailable_samples':failures,'retained_chart_samples':len(history),
                    'scope':'Sampled native metadata, not a stopped process or full-memory fidelity check'})
                if samples%5==0:print('MEMORY SAMPLER '+json.dumps({'status':row['status'],'samples':samples,'running':running,'rss':row.get('rss_bytes')}),flush=True)
                STOP.wait(1)

        class Handler(http.server.BaseHTTPRequestHandler):
            server_version='MemoryAtlas/8'
            def log_message(self,fmt,*args):
                # No query strings, headers or credential logging.
                print('HTTP '+str(self.command)+' '+str(self.path.split('?',1)[0])[:160],flush=True)
            def do_POST(self):self.send_error(405,'Read-only evidence server')
            do_PUT=do_POST;do_DELETE=do_POST;do_PATCH=do_POST
            def do_HEAD(self):self.do_GET(head=True)
            def do_GET(self,head=False):
                decoded=urllib.parse.unquote(urllib.parse.urlsplit(self.path).path)
                if decoded=='/health':
                    body=json.dumps({'status':'ready','utc':now(),'read_only':True}).encode();self.reply(body,'application/json',head);return
                rel=decoded.lstrip('/') or 'index.html'
                if not re.fullmatch(r'[A-Za-z0-9_./-]+',rel) or any(x in ('..','.') or x.startswith('.') for x in rel.split('/')):
                    self.send_error(403);return
                root=public_root();p=root/rel
                if p.suffix not in ('.html','.json','.log','.jsonl','.gz','.zip') or not p.is_file():self.send_error(404);return
                if any((root.joinpath(*Path(rel).parts[:i])).is_symlink() for i in range(1,len(Path(rel).parts)+1)):
                    self.send_error(403);return
                typ={'.html':'text/html; charset=utf-8','.json':'application/json','.gz':'application/gzip','.zip':'application/zip'}.get(p.suffix,'text/plain; charset=utf-8')
                try:
                    self.send_response(200);self.response_headers(typ);self.send_header('Content-Length',str(p.stat().st_size));self.end_headers()
                    if not head:
                        with p.open('rb') as f:shutil.copyfileobj(f,self.wfile,131072)
                except (BrokenPipeError,ConnectionResetError,FileNotFoundError):pass
            def response_headers(self,typ):
                self.send_header('Content-Type',typ);self.send_header('Cache-Control','no-store');self.send_header('X-Content-Type-Options','nosniff')
                self.send_header('Referrer-Policy','no-referrer');self.send_header('X-Frame-Options','DENY')
                self.send_header('Content-Security-Policy',"default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; connect-src 'self'; img-src 'self' data:; frame-ancestors 'none'; base-uri 'none'; form-action 'none'")
            def reply(self,body,typ,head=False):
                self.send_response(200);self.response_headers(typ);self.send_header('Content-Length',str(len(body)));self.end_headers()
                if not head:self.wfile.write(body)

        class Server(http.server.ThreadingHTTPServer):
            daemon_threads=True
            request_queue_size=32

        def serve(port):
            thread=threading.Thread(target=sampler,daemon=True);thread.start()
            server=Server(('127.0.0.1',port),Handler)
            def end(*_):STOP.set();threading.Thread(target=server.shutdown,daemon=True).start()
            signal.signal(signal.SIGTERM,end);signal.signal(signal.SIGINT,end)
            print(f'READ-ONLY MEMORY SERVER http://127.0.0.1:{port}/',flush=True)
            server.serve_forever(poll_interval=.2);server.server_close();STOP.set();thread.join(timeout=10)

        def start(port):
            initialize();shutil.copyfile(Path(__file__).with_name('memory-dashboard.html'),public_root()/'index.html')
            root=Path(os.environ['EVIDENCE_DIR']);root.mkdir(parents=True,exist_ok=True)
            log=(root/'memory-server.log').open('a')
            p=subprocess.Popen([sys.executable,str(Path(__file__).resolve()),'serve','--port',str(port)],stdin=subprocess.DEVNULL,stdout=log,stderr=subprocess.STDOUT,start_new_session=True)
            atomic(private_root()/'server.json',{'pid':p.pid,'port':port,'script':str(Path(__file__).resolve())})
            for _ in range(100):
                if p.poll() is not None:raise RuntimeError('Memory server exited early; see memory-server.log')
                try:
                    response=json.load(urllib.request.urlopen(f'http://127.0.0.1:{port}/health',timeout=1))
                    if response.get('status')=='ready':break
                except Exception:time.sleep(.1)
            else:raise TimeoutError('Memory web server readiness failed')
            atomic(root/'memory-server-start.json',{'status':'passed','utc':now(),'port':port,'read_only':True,'before_criu_install':True})
            print(f'EARLY SERVER READY: http://127.0.0.1:{port}/ (runner-local)',flush=True)


        def fetch_json(url,timeout=20):
            request=urllib.request.Request(url,headers={'User-Agent':'V8-Memory-Atlas','Accept':'application/vnd.github+json'})
            with urllib.request.urlopen(request,timeout=timeout) as f:return json.load(f)

        def tunnel(port):
            root=Path(os.environ['EVIDENCE_DIR']);record={'status':'unavailable','provider':'Cloudflare Quick Tunnel','purpose':'temporary public read-only probe dashboard'}
            try:
                # No moving binary is executed unchecked. Pin its release tag + GitHub-provided digest for this run.
                release=fetch_json('https://api.github.com/repos/cloudflare/cloudflared/releases/latest')
                a=next(x for x in release['assets'] if x['name']=='cloudflared-linux-amd64')
                digest=a.get('digest','')
                if not re.fullmatch(r'sha256:[a-f0-9]{64}',digest):raise RuntimeError('Official release has no SHA256 digest; refusing unchecked execution')
                url=a['browser_download_url']
                if not url.startswith('https://github.com/cloudflare/cloudflared/releases/download/'):raise RuntimeError('Unexpected binary origin')
                dest=private_root()/'cloudflared';h=hashlib.sha256()
                with urllib.request.urlopen(urllib.request.Request(url,headers={'User-Agent':'V8-Memory-Atlas'}),timeout=90) as src,dest.open('wb') as out:
                    while data:=src.read(1048576):out.write(data);h.update(data)
                if h.hexdigest()!=digest.split(':')[1]:raise RuntimeError('cloudflared digest mismatch')

    - name: Embed report_tools.py [1/1]
      shell: bash
      run: |
        set -Eeuo pipefail
        cat > "$BUNDLE_DIR/report_tools.py" <<'MEMORY8_REPORT_TOOLS_PY_1'
        """One aggregate verdict; publishing evidence is never scientific success."""
        import datetime
        import hashlib
        import json
        import os
        from pathlib import Path
        import sys
        ROOT=Path(os.environ.get('EVIDENCE_DIR','evidence'));ROOT.mkdir(parents=True,exist_ok=True)
        REQUIRED=('asset-integrity.json','self-tests.json','network-self-tests.json','repair-self-tests.json',
                  'setup.json','daemon-setup.json','report.json','fidelity-matrix.json','intervention-suite.json','viewer-build.json','memory-server-start.json','memory-fidelity.json','memory-self-tests.json')


        def read(name):
            try:
                obj=json.loads((ROOT/name).read_text())
                if not isinstance(obj,dict):raise ValueError('Expected JSON object')
                return obj
            except (OSError,ValueError) as exc:return {'status':'not_run','exception':str(exc)}


        def aggregate():
            records={n:read(n) for n in REQUIRED}
            return {'workflow_revision':'memory-9','run_id':os.environ.get('GITHUB_RUN_ID'),
                'sha':os.environ.get('GITHUB_SHA'),'passed':all(x.get('status')=='passed' for x in records.values()),
                'stages':records,'scope':'finite same-host V8 controlled counterfactual branching; not yet semantic agent actions or mitigation outcomes',
                'public_logs_warning':'Logs expose environment and probe data. No secrets should be added to this workload.'}


        def summary():
            obj=aggregate();lines=['# V8 Checkpoint Atlas / memory-9','',
                '**Overall experiment: '+('PASS (finite probe scope only)' if obj['passed'] else 'NOT PASSED / incomplete or failed')+'**','',
                '| Stage | Status | Error / phase |','|---|---|---|']
            for name,r in obj['stages'].items():
                info=' / '.join(str(r.get(k,'')) for k in ('failed_stage','last_phase','exception','error','cleanup_error') if r.get(k))
                lines.append('| '+name+' | '+str(r.get('status','unknown'))+' | '+info.replace('|','/').replace('\n',' ')+' |')
            x=obj['stages']['intervention-suite.json']
            lines+=['','## Counterfactual branching',
                f"Completed {len(x.get('trials',[]))} / {x.get('requested_trials','unknown')} restorations; requested horizon {x.get('horizon','unknown')} steps.",
                'Controlled CONTROL/A/B interventions are applied only after exact pre-branch checkpoint identity is observed. Real cold-start and synthetic pre-branch mutation controls remain separate.',
                '', '## Limits',
                'Probe words, object observations, RNG output and small Wasm calculations are not full V8/JIT equivalence.',
                'The network namespace is externally retained, not restored. Wall clock continues.',
                'HTML rewind navigates recorded evidence; GitHub Pages is not a live CRIU control service.',
                'Publishing reports does not turn failed or missing experiments into a pass.']
            text='\n'.join(lines)+'\n';(ROOT/'summary.md').write_text(text);(ROOT/'overall.json').write_text(json.dumps(obj,indent=2)+'\n')
            print(text,flush=True)
            if os.environ.get('GITHUB_STEP_SUMMARY'):
                with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f:f.write(text)
            return 0


        def inventory():
            rows=[]
            for p in sorted(ROOT.rglob('*')):
                if p.is_symlink() or not p.is_file() or p.name=='artifact-manifest.json':continue
                h=hashlib.sha256()
                with p.open('rb') as f:
                    while chunk:=f.read(1048576):h.update(chunk)
                row={'path':p.relative_to(ROOT).as_posix(),'bytes':p.stat().st_size,'sha256':h.hexdigest()};rows.append(row)
                print(f"ARTIFACT | {row['bytes']:>10} bytes | SHA256 {row['sha256']} | {row['path']}",flush=True)
            obj={'files':rows,'file_count':len(rows),'bytes':sum(x['bytes'] for x in rows),'manifest_excludes_itself':True,'raw_memory_images_uploaded':False}
            (ROOT/'artifact-manifest.json').write_text(json.dumps(obj,indent=2)+'\n');return 0


        def gate():
            obj=aggregate()
            for n,r in obj['stages'].items():
                print(f"FINAL GATE {n} | status={r.get('status')} | phase={r.get('failed_stage',r.get('last_phase',''))} | error={r.get('exception',r.get('error',''))} | cleanup={r.get('cleanup_error','')}",flush=True)
                for a in r.get('assertions',r.get('tests',[])):
                    if a.get('passed') is False:print('FAILED ASSERTION: '+json.dumps(a),flush=True)
            print('FINAL OVERALL: '+('PASS (finite probe counterfactual branching scope)' if obj['passed'] else 'FAIL / NOT DEMONSTRATED. Reports may still be published.'),flush=True)
            return 0 if obj['passed'] else 1

        if __name__=='__main__':
            functions={'summary':summary,'inventory':inventory,'gate':gate}
            if len(sys.argv)!=2 or sys.argv[1] not in functions:raise SystemExit('Use summary, inventory, or gate')
            raise SystemExit(functions[sys.argv[1]]())
        MEMORY8_REPORT_TOOLS_PY_1

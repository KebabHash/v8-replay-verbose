        probe OS uname -a
        probe DISTRIBUTION cat /etc/os-release
        probe ID id
        probe SUDO sudo -n true
        probe CPU lscpu
        probe MEMORY free -h
        probe MEMINFO cat /proc/meminfo
        probe DISK df -hT
        probe MEMORY_MAPPING sh -c 'ulimit -a; sysctl vm.overcommit_memory vm.overcommit_ratio vm.max_map_count kernel.randomize_va_space kernel.yama.ptrace_scope'
        probe CGROUPS sh -c 'cat /proc/self/cgroup; stat -fc %T /sys/fs/cgroup; for f in memory.max memory.current memory.peak memory.swap.max memory.events; do echo "$f"; cat "/sys/fs/cgroup/$f" 2>/dev/null || true; done'
        probe SECURITY sh -c 'grep -E "^(Cap|Seccomp|NoNewPrivs)" /proc/self/status'
        probe DOCKER_VERSION docker version
        probe DOCKER_INFO docker info
        probe DOCKER_CHECKPOINT_HELP docker checkpoint --help
        probe RUNC runc --version
        probe CONTAINERD containerd --version
        probe PREEXISTING_CRIU sh -c 'command -v criu; criu --version'
        printf '\nNo environment dump, model API key, exploit payload, Docker socket mount, or public service is used.\n'

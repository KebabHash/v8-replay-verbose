name: V8 ExploitGym - Capture Restore Branch
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/v8-capture-restore.yml'
permissions:
  contents: read
jobs:
  capture-restore:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      V8_IMAGE: cybergym/v8:human-446124892-nosandbox-buildable
    steps:
      - name: Capture S0, branch A, restore S0, branch B, verify
        shell: python
        run: |
          import datetime, hashlib, json, os, pathlib, subprocess, time, traceback
          out = pathlib.Path('capture-restore-artifacts')
          out.mkdir(exist_ok=True)
          events = []
          containers = []
          images = []
          image = os.environ['V8_IMAGE']
          def log(kind, **fields):
              event = {'time': datetime.datetime.now(datetime.timezone.utc).isoformat(), 'kind': kind, **fields}
              events.append(event)
              print(json.dumps(event, sort_keys=True), flush=True)
              (out / 'events.json').write_text(json.dumps(events, indent=2))
          def run(args, check=True, timeout=180):
              start = time.monotonic()
              p = subprocess.run(args, capture_output=True, text=True, errors='replace', timeout=timeout)
              log('command', argv=args, code=p.returncode, duration_s=round(time.monotonic()-start, 3),
                  stdout=p.stdout[-10000:], stderr=p.stderr[-10000:])
              if check and p.returncode:
                  raise RuntimeError(f'command failed: {args}: {p.stderr[-1000:]}')
              return p.stdout.strip()
          def sha(data):
              return hashlib.sha256(data.encode()).hexdigest()
          def start(name, base):
              run(['docker', 'run', '-d', '--name', name, '--network', 'none', '--memory', '4g',
                   '--memory-swap', '4g', '--pids-limit', '256', '--entrypoint', '/bin/sh', base,
                   '-c', 'while :; do sleep 3600; done'])
              containers.append(name)
              return name
          def script(container, code):
              return run(['docker', 'exec', container, '/bin/sh', '-c', code])
          def state(container):
              # A deliberately controlled workspace: no volumes, external services, or processes included.
              return script(container, 'cd /tmp/agent-replay && sha256sum state.txt && cat state.txt')
          try:
              log('start', task='v8:human/446124892', image=image,
                  guarantee='filesystem snapshot and restart, NOT process-memory checkpoint')
              run(['docker', 'pull', image], timeout=600)
              digest = run(['docker', 'image', 'inspect', image, '--format', '{{index .RepoDigests 0}}'])
              log('provenance', digest=digest)
              base = start('v8-capture-base', image)
              script(base, 'mkdir -p /tmp/agent-replay && printf "origin=clean\\nstep=0\\n" > /tmp/agent-replay/state.txt')
              s0 = state(base)
              # Capture S0 as an immutable local Docker image. Running processes are NOT preserved.
              snapshot = 'v8-agent-checkpoint:s0'
              run(['docker', 'commit', base, snapshot])
              images.append(snapshot)
              log('capture', checkpoint='S0', snapshot=snapshot, state_sha256=sha(s0), state=s0)
              # Branch A modifies workspace after S0.
              script(base, 'printf "origin=clean\\nstep=1\\nchoice=A\\n" > /tmp/agent-replay/state.txt')
              a = state(base)
              log('branch', branch='A', state_sha256=sha(a), state=a)
              # Restore S0 by creating a NEW container from the checkpoint image.
              restored = start('v8-capture-restored', snapshot)
              s0_restored = state(restored)
              assert s0_restored == s0, 'RESTORE FAILED: S0 state differs'
              assert s0_restored != a, 'RESTORE FAILED: branch A state leaked into restored environment'
              log('restore', checkpoint='S0', exact_match=True, state_sha256=sha(s0_restored))
              # Branch B starts from the restored S0 and diverges.
              script(restored, 'printf "origin=clean\\nstep=1\\nchoice=B\\n" > /tmp/agent-replay/state.txt')
              b = state(restored)
              assert b != a and b != s0, 'BRANCH FAILED: expected distinct states'
              log('branch', branch='B', state_sha256=sha(b), state=b)
              result = {'task': 'v8:human/446124892', 'image_digest': digest,
                        'checkpoint': 'Docker filesystem image', 's0': s0, 'branch_a': a,
                        'restored_s0': s0_restored, 'branch_b': b,
                        'restore_exact': s0 == s0_restored, 'branches_differ': a != b,
                        'limitations': ['No agent LLM is invoked', 'No exploit attempted',
                                        'No V8 process memory restored', 'No volumes or external state captured']}
              (out / 'results.json').write_text(json.dumps(result, indent=2))
              (out / 'image-digest.txt').write_text(digest + '\n')
              print('CAPTURE / RESTORE / BRANCH: PASS', flush=True)
              with open(os.environ.get('GITHUB_STEP_SUMMARY', '/dev/null'), 'a') as f:
                  f.write('## V8 capture/restore/branch: PASS\n\n'
                          f'- Image: `{digest}`\n- S0 restored exactly: **yes**\n'
                          '- Branches A and B diverged: **yes**\n\n'
                          'Filesystem-only demonstration; no process-memory restoration or exploit run.\n')
          except Exception as e:
              log('failure', error=str(e), traceback=traceback.format_exc())
              raise
          finally:
              for c in containers:
                  run(['docker', 'rm', '-f', c], check=False)
              for i in images:
                  run(['docker', 'image', 'rm', i], check=False)
      - name: Upload event log and verification results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v8-capture-restore-evidence
          path: capture-restore-artifacts/
          if-no-files-found: warn

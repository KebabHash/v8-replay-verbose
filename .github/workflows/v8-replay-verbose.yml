name: V8 Full Execution Checkpoint Feasibility (Ultra Verbose)

on:
  workflow_dispatch:
    inputs:
      image:
        description: 'V8 ExploitGym Docker image (pin by digest for rigorous comparisons)'
        required: false
        default: 'cybergym/v8@sha256:d53b336a90e184fe61c2067342eb278f6d54d009d7b4d93b958029b86904e48a'
      checkpoint_wait_seconds:
        description: 'Seconds to allow target to warm up before checkpoint'
        required: false
        default: '8'

permissions:
  contents: read

jobs:
  feasibility:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      DOCKER_CLI_EXPERIMENTAL: enabled
      IMAGE: ${{ inputs.image || 'cybergym/v8@sha256:d53b336a90e184fe61c2067342eb278f6d54d009d7b4d93b958029b86904e48a' }}
      WARMUP: ${{ inputs.checkpoint_wait_seconds || '8' }}
    steps:
      - name: Host and Docker preflight (never hide errors)
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p evidence
          exec > >(tee evidence/host-preflight.log) 2>&1
          echo '=== UTC ==='; date -u --iso-8601=seconds
          echo '=== OS ==='; uname -a; cat /etc/os-release
          echo '=== USER ==='; id; sudo -n true; echo "sudo_status=$?"
          echo '=== CPU / RAM ==='; nproc; free -h; cat /proc/meminfo | head -n 25
          echo '=== DISK ==='; df -h; mount | head -n 40
          echo '=== KERNEL CRIU RELEVANT ==='
          for f in /proc/sys/kernel/yama/ptrace_scope /proc/sys/kernel/ns_last_pid /proc/sys/kernel/unprivileged_userns_clone /proc/sys/kernel/kptr_restrict; do
            echo "--- $f"; cat "$f" 2>&1 || true
          done
          echo '=== DOCKER ==='; docker version || true; docker info || true
          echo '=== DOCKER CHECKPOINT COMMAND ==='; docker checkpoint --help || true
          echo '=== CRIU VERSION (before install) ==='; command -v criu && criu --version || true
          echo '=== CGROUPS ==='; cat /proc/self/cgroup; stat -fc %T /sys/fs/cgroup
          echo '=== SECURITY ==='; grep -E '^(Cap|Seccomp|NoNewPrivs)' /proc/self/status || true

      - name: Install checkpoint tools and record versions
        shell: bash
        run: |
          set -uo pipefail
          { sudo apt-get update; sudo DEBIAN_FRONTEND=noninteractive apt-get install -y criu jq; } 2>&1 | tee evidence/criu-install.log
          { echo '=== CRIU ==='; criu --version || true; echo '=== CRIU CHECK ==='; sudo criu check -v 4 || true; echo '=== DOCKER EXPERIMENTAL ==='; docker info --format '{{json .}}' | jq '{ServerVersion, ExperimentalBuild, SecurityOptions, CgroupVersion, Driver, Runtimes}' || true; } 2>&1 | tee evidence/criu-preflight.log

      - name: Pull pinned V8 image and inspect executable availability
        shell: bash
        run: |
          set -uo pipefail
          { echo "IMAGE=$IMAGE"; docker pull "$IMAGE"; docker image inspect "$IMAGE"; echo '=== D8 CANDIDATES ==='; docker run --rm --entrypoint /bin/sh "$IMAGE" -c 'pwd; id; command -v d8 || true; find / -type f \( -name d8 -o -name "d8.*" \) 2>/dev/null | head -n 30' || true; } 2>&1 | tee evidence/v8-image-inspection.log

      - name: Run native V8 heap-and-JIT continuity test with Docker checkpoint/restore
        id: experiment
        shell: bash
        run: |
          set -uo pipefail
          cat > /tmp/checkpoint_probe.py <<'PY'
          import datetime, hashlib, json, os, pathlib, shlex, subprocess, sys, time, traceback
          root=pathlib.Path('evidence'); root.mkdir(exist_ok=True)
          image=os.environ['IMAGE']; warmup=max(2,min(30,int(os.environ.get('WARMUP','8'))))
          result={'image':image,'started_utc':datetime.datetime.now(datetime.timezone.utc).isoformat(),'tests':{},'caveats':[]}
          def run(label,cmd,timeout=120):
              print('\n'+'='*110,flush=True); print('COMMAND:',label,'\nARGV:',repr(cmd),'\nTIME:',datetime.datetime.now(datetime.timezone.utc).isoformat(),flush=True)
              t=time.monotonic()
              try:
                  p=subprocess.run(cmd,text=True,stdout=subprocess.PIPE,stderr=subprocess.PIPE,timeout=timeout)
                  rc=p.returncode; out=p.stdout; err=p.stderr
              except subprocess.TimeoutExpired as e:
                  rc=124; out=(e.stdout or b'').decode(errors='replace') if isinstance(e.stdout,bytes) else (e.stdout or ''); err=(e.stderr or b'').decode(errors='replace') if isinstance(e.stderr,bytes) else (e.stderr or '')
              elapsed=time.monotonic()-t
              (root/(label+'.stdout.txt')).write_text(out); (root/(label+'.stderr.txt')).write_text(err)
              print('EXIT:',rc,'ELAPSED_SEC:',round(elapsed,3),'\nSTDOUT:\n',out[-16000:],'\nSTDERR:\n',err[-16000:],flush=True)
              return rc,out,err
          def record(key,passed,detail):
              result['tests'][key]={'passed':bool(passed),'detail':detail}; print(('PASS' if passed else 'FAIL')+' '+key+' '+str(detail),flush=True)
          name='v8-criu-fidelity-'+os.environ.get('GITHUB_RUN_ID','local')
          try:
              # This JS mutates a live heap object, exercises hot function calls, and emits monotonically increasing markers.
              js='''let count=0; let heap={token:"V8-HEAP-STATE-UNIQUE-6f8c", history:[]}; function hot(x){return (x*17+3)|0;} while(true){count++; let value=hot(count); if(count%500000===0){heap.history.push(value); if(heap.history.length>40)heap.history.shift(); print("V8_LIVE_MARKER count="+count+" heap="+heap.token+" value="+value+" history="+heap.history.length); } }'''
              (root/'probe.js').write_text(js)
              # Locate a real d8 binary; do not substitute a fake executable.
              rc,out,_=run('locate-d8',['docker','run','--rm','--entrypoint','/bin/sh',image,'-c','command -v d8 || find / -type f -name d8 2>/dev/null | head -n 1'],120)
              path=next((x.strip() for x in out.splitlines() if x.strip().startswith('/') and ' ' not in x.strip()),None)
              if not path:
                  record('real_v8_binary_present',False,'No d8 found; no real V8 execution claim permitted'); return_code=0
              else:
                  record('real_v8_binary_present',True,path)
                  run('remove-old-container',['docker','rm','-f',name],30)
                  # Mount JS from workspace: Docker checkpoint cannot preserve external file mutations, so keep it immutable.
                  script=str((root/'probe.js').resolve())
                  cmd=['docker','run','-d','--name',name,'--memory','4g','--cpus','2','-v',script+':/tmp/checkpoint_probe.js:ro','--entrypoint',path,image,'/tmp/checkpoint_probe.js']
                  rc,_,_=run('start-real-v8',cmd,90)
                  if rc:
                      record('real_v8_started',False,'d8 invocation failed; inspect command stderr')
                  else:
                      time.sleep(warmup)
                      rc,logs,_=run('before-checkpoint-logs',['docker','logs','--tail','80',name],30)
                      marker_lines=[l for l in logs.splitlines() if 'V8_LIVE_MARKER count=' in l]
                      running=run('before-checkpoint-inspect',['docker','inspect','-f','{{.State.Running}} {{.State.Pid}} {{.State.ExitCode}}',name],30)[1]
                      record('real_v8_running',bool(marker_lines) and 'true' in running,{'markers':len(marker_lines),'inspect':running.strip()})
                      if marker_lines and 'true' in running:
                          last=marker_lines[-1]
                          print('LAST PRE-CHECKPOINT MARKER:',last,flush=True)
                          # IMPORTANT: this is a real process-memory checkpoint attempt, not docker commit.
                          rc,_,err=run('docker-checkpoint-create',['docker','checkpoint','create',name,'checkpoint0'],180)
                          record('docker_checkpoint_create',rc==0,err[-2000:])
                          if rc==0:
                              run('checkpoint-container-inspect',['docker','inspect',name],30)
                              rc,_,err=run('docker-checkpoint-restore',['docker','start','--checkpoint','checkpoint0',name],180)
                              record('docker_checkpoint_restore',rc==0,err[-2000:])
                              if rc==0:
                                  time.sleep(3)
                                  _,after,_=run('after-restore-logs',['docker','logs','--tail','150',name],30)
                                  post=[l for l in after.splitlines() if 'V8_LIVE_MARKER count=' in l]
                                  def extract(line):
                                      try:return int(line.split('count=')[1].split()[0])
                                      except Exception:return -1
                                  before_count=extract(last)
                                  after_count=max((extract(l) for l in post),default=-1)
                                  record('heap_execution_continuity',after_count>before_count and 'V8-HEAP-STATE-UNIQUE-6f8c' in after,{'before_count':before_count,'after_max_count':after_count,'note':'Log persistence alone is insufficient; post-checkpoint count must advance.'})
                                  record('process_alive_after_restore','true' in run('after-restore-inspect',['docker','inspect','-f','{{.State.Running}} {{.State.Pid}}',name],30)[1],'Inspect state')
                          else:
                              result['caveats'].append('Docker daemon may not enable CRIU checkpoint/restore on GitHub-hosted runners; see checkpoint stderr. This is an environment feasibility result, not proof the approach is impossible.')
          except Exception as e:
              traceback.print_exc(); result['exception']=repr(e)
          finally:
              run('cleanup',['docker','rm','-f',name],45)
              result['finished_utc']=datetime.datetime.now(datetime.timezone.utc).isoformat()
              (root/'report.json').write_text(json.dumps(result,indent=2))
              print('\n'+'#'*110+'\nFINAL MACHINE-READABLE REPORT\n'+json.dumps(result,indent=2)+'\n'+'#'*110,flush=True)
          PY
          python3 -u /tmp/checkpoint_probe.py 2>&1 | tee evidence/full-execution-console.log
          # Do not hide feasibility failure: preserve artifacts and set the job outcome after upload.
          python3 - <<'PY'
          import json,os
          p=json.load(open('evidence/report.json'))
          required=['real_v8_binary_present','real_v8_running','docker_checkpoint_create','docker_checkpoint_restore','heap_execution_continuity','process_alive_after_restore']
          good=all(p['tests'].get(k,{}).get('passed',False) for k in required)
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:f.write(f'feasible={str(good).lower()}\n')
          print('FULL_EXECUTION_CHECKPOINT_FEASIBLE=',good)
          PY

      - name: Explain results in GitHub summary
        if: always()
        shell: bash
        run: |
          python3 - <<'PY'
          import json,os,pathlib
          p=pathlib.Path('evidence/report.json')
          lines=['# Full V8 execution checkpoint feasibility','', '**Scope:** Live `d8` process checkpoint/restore via Docker/CRIU, not filesystem-only `docker commit`.','', '| Assertion | Outcome |','|---|---|']
          if p.exists():
              d=json.loads(p.read_text())
              for k,v in d.get('tests',{}).items():lines.append(f"| `{k}` | {'PASS' if v['passed'] else 'FAIL'} |")
              lines+=['','**Interpretation:** Failure on GitHub-hosted runners may reflect unavailable kernel/daemon checkpoint features. Success demonstrates continuity for this V8 probe only, not fidelity for every ExploitGym target, network socket, or agent process.','', '**Next validation:** Repeat checkpoint/restore at multiple pause points; verify object/heap contents, open FDs, sockets, threads, ASLR, JIT state, and exploit outcomes; repeat on self-hosted Linux with configured CRIU.']
          else:lines+=['','No report generated; inspect logs.']
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f:f.write('\n'.join(lines)+'\n')
          PY

      - name: Upload all evidence including failure diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v8-full-execution-checkpoint-evidence
          path: evidence/
          if-no-files-found: warn
          retention-days: 14

      - name: Mark experiment failed when real execution checkpoint is unproven
        if: always() && steps.experiment.outputs.feasible != 'true'
        shell: bash
        run: |
          echo 'FAIL-CLOSED: Full V8 execution checkpoint continuity was NOT demonstrated. Read uploaded evidence and job summary.'
          exit 1

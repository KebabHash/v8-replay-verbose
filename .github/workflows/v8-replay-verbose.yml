5;margin:10px 0}details summary{cursor:pointer;color:var(--muted);font-size:12px;margin-top:10px}.compare-pickers{display:grid;grid-template-columns:1fr 1fr;gap:10px}.compare-pickers label{font-size:10px;letter-spacing:.06em;text-transform:uppercase}.compare-pickers select{width:100%;font-size:11px;margin-top:5px}.diff-table,.matrix{width:100%;border-collapse:collapse;font-size:12px}.diff-table{margin:12px 0}.diff-table td,.diff-table th{padding:7px 6px;text-align:left;border-bottom:1px solid #263246}.diff-table th{font-weight:500;color:var(--muted);font-size:10px}.diff-table td{font-family:var(--mono);font-size:11px}.diff-table td:first-child{font-family:inherit;color:var(--muted)}.match{color:var(--teal)}.mismatch{color:var(--red)}.unknown{color:var(--dim)}.heap-head{display:flex;justify-content:space-between;gap:15px;font-size:11px;margin:14px 0 9px}.heap-grid{display:grid;grid-template-columns:repeat(32,1fr);gap:3px}.heap-cell{height:12px;border:0;border-radius:2px;background:#2c3547;min-width:0;padding:0}.heap-cell.same{background:#2b786f}.heap-cell.changed{background:var(--red)}.heap-cell:focus{outline:2px solid white}.heap-explain{font-size:10px;color:var(--muted);margin-top:8px;min-height:15px}.matrix-scroll{overflow:auto;max-height:340px}.matrix th{background:#151e2c;color:var(--muted);font-size:10px;text-align:center;padding:12px;position:sticky;top:0;font-weight:500}.matrix td{padding:10px 14px;border-top:1px solid var(--border);text-align:center;font-family:var(--mono);font-size:11px}.matrix th:first-child,.matrix td:first-child{text-align:left;font-family:inherit;min-width:160px}.matrix td:first-child span{display:block;font-size:10px;color:var(--dim);margin-top:2px}.empty{padding:30px 18px;color:var(--muted);font-size:13px;line-height:1.7}.resources{margin:18px 0}.resources svg{width:100%;height:150px;display:block}.footer{margin-top:18px;display:flex;gap:15px;justify-content:space-between;font-size:11px;color:var(--dim);flex-wrap:wrap}.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#22384a;border:1px solid #567486;box-shadow:0 12px 40px #0008;border-radius:9px;padding:12px 20px;color:var(--text);max-width:90vw;z-index:20;display:none}.toast.visible{display:block}dialog{background:var(--panel);color:var(--text);border:1px solid var(--border);border-radius:14px;max-width:600px;width:90vw;padding:24px}dialog::backdrop{background:#000b}dialog h2{margin-top:0}dialog p{color:var(--muted);font-size:13px}dialog label{display:block;font-size:12px;margin:14px 0}dialog input,dialog textarea{width:100%;display:block;margin-top:6px}dialog textarea{min-height:100px}.dialog-actions{display:flex;justify-content:flex-end;gap:9px;margin-top:20px}.visually-hidden{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}.badge-line{display:flex;gap:7px;align-items:center;flex-wrap:wrap}.check-banner{font-size:11px;color:var(--muted)}.linklike{background:none;border:0;padding:0;color:var(--teal);font-size:12px}.drop-active{outline:2px dashed var(--teal);outline-offset:-10px}

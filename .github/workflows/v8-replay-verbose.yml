        import hashlib
        import importlib.util
        import io
        import json
        import os
        from pathlib import Path
        import re
        import sys
        import tempfile
        import traceback

        HERE=Path(__file__).resolve().parent
        spec=importlib.util.spec_from_file_location('checkpoint_probe',HERE/'checkpoint_probe.py')
        m=importlib.util.module_from_spec(spec);spec.loader.exec_module(m)
        results=[]

        def check(name,condition,detail=None):
            entry={'name':name,'passed':bool(condition),'detail':detail}
            results.append(entry)
            print(('PASS ' if condition else 'FAIL ')+name,flush=True)
            if not condition: raise AssertionError(name+': '+str(detail))

        def marker(e): return 'V8_PROBE '+json.dumps(e,sort_keys=True)+'\n'

        try:
            for p in HERE.glob('*.py'):
                compile(p.read_text(),str(p),'exec')
            check('Every embedded Python source compiles',True)
            check('HTML has an inert evidence payload placeholder','__EMBEDDED_EVIDENCE__' in (HERE/'viewer-template.html').read_text())
            check('Timed probe does not call removed shell file APIs',not re.search(r'\b(read|readline)\s*\(',m.PROBE_JS))
            check('Timed probe has an explicit standard console fallback','globalThis.console.log' in m.PROBE_JS)
            source=m.probe_source(2,3,45)
            check('Probe configuration is fully embedded','__PROBE_CONFIG__' not in source and '45000' in source)
            caps={'console_log':'function','print':'undefined','read':'undefined','uint32array':'function','date_now':'function'}
            check('Capability parser accepts restricted shell output',m.parse_capabilities('V8_API_CAPABILITIES:'+json.dumps(caps))==caps)
            check('Capability parser does not invent missing APIs',m.parse_capabilities('ReferenceError')=={})
            check('Capability parser tolerates diagnostic prefix',m.parse_capabilities('Error: V8_API_CAPABILITIES:'+json.dumps(caps)+' trailing')==caps)
            check('Capability parser rejects corrupt JSON',m.parse_capabilities('V8_API_CAPABILITIES:{oops}')=={})
            paused={'event':'paused','ticket':'ticket-1','token':'a'*48,'tick':10,'digest':'12345678','hot':123,'words':4096,'heap_words':list(range(4096))}
            resumed={**copy.deepcopy(paused),'event':'resumed'}
            tick={**copy.deepcopy(paused),'event':'tick','tick':11};tick.pop('heap_words')
            baseline=marker(paused)
            after=baseline+marker(resumed)+marker(tick)
            good=m.continuity_checks(paused,baseline,after,'ticket-1',True)
            check('Valid fixture passes all continuity assertions',all(good.values()),good)
            for key,value in [('token','b'*48),('tick',0),('digest','00000000'),('hot',999),('words',2048)]:
                bad=copy.deepcopy(resumed);bad[key]=value
                checks=m.continuity_checks(paused,baseline,baseline+marker(bad)+marker(tick),'ticket-1',True)
                check('Changed '+key+' is rejected',not all(checks.values()))
            bad=copy.deepcopy(resumed);bad['heap_words'][2048]^=1
            check('One changed array word is rejected',not m.continuity_checks(paused,baseline,baseline+marker(bad)+marker(tick),'ticket-1',True)['all_4096_probe_words_exact'])
            check('Old logs alone cannot pass',not all(m.continuity_checks(paused,baseline,baseline,'ticket-1',True).values()))
            check('Cold restart marker is rejected',not m.continuity_checks(paused,baseline,baseline+marker({'event':'boot'})+marker(resumed)+marker(tick),'ticket-1',True)['no_cold_boot_in_new_output'])
            check('Duplicate resume event is rejected',not m.continuity_checks(paused,baseline,after+marker(resumed),'ticket-1',True)['exactly_one_matching_resume'])
            check('Changed old-log prefix is rejected',not m.continuity_checks(paused,baseline,'different\n'+after,'ticket-1',True)['old_log_prefix_preserved'])
            check('Dead process is rejected',not m.continuity_checks(paused,baseline,after,'ticket-1',False)['process_alive_after_restore'])
            check('Wrong resume ticket is rejected',not all(m.continuity_checks(paused,baseline,after,'wrong',True).values()))
            check('No progress after resume is rejected',not m.continuity_checks(paused,baseline,baseline+marker(resumed),'ticket-1',True)['execution_advances_after_resume'])
            original={'log-driver':'json-file','features':{'x':True}}
            updated=m.merged_daemon_config(original)
            check('Daemon config keeps unrelated settings',updated['log-driver']=='json-file' and updated['experimental'] is True and 'experimental' not in original)
            with tempfile.TemporaryDirectory() as td:
                a=m.Audit(td);a.heartbeat_s=.05
                capture=io.StringIO()
                with contextlib.redirect_stdout(capture):
                    rc,out,err=a.run('streams',[sys.executable,'-u','-c','import sys,time; print("hello"); print("error-text",file=sys.stderr); time.sleep(.18)'])
                check('Real subprocess stdout/stderr preserved',rc==0 and out=='hello\n' and err=='error-text\n')
                check('Live command heartbeat emitted','HEARTBEAT' in capture.getvalue())
                check('Timestamped stream labels emitted','STDOUT | hello' in capture.getvalue() and 'STDERR | error-text' in capture.getvalue())
                with contextlib.redirect_stdout(io.StringIO()):
                    rc,_,_=a.run('timeout',[sys.executable,'-c','import time;time.sleep(30)'],timeout=.1)
                check('Timeout terminates subprocess',rc==124)
                with contextlib.redirect_stdout(io.StringIO()):
                    rc,_,_=a.run('nonzero',[sys.executable,'-c','raise SystemExit(7)'])
                check('Nonzero child exit is preserved',rc==7)
                with contextlib.redirect_stdout(io.StringIO()):
                    rc,_,_=a.run('missing',['/nonexistent/v8-audit-command'])
                check('Missing executable is explicit failure',rc==127)
                check('Raw stdout and stderr files exist',any(Path(td).glob('*.stdout.txt')) and any(Path(td).glob('*.stderr.txt')))
                check('Events remain parseable JSONL',all(isinstance(json.loads(x),dict) for x in (Path(td)/'events.jsonl').read_text().splitlines()))
            # Immediate failure on a dead target, not a heartbeat timeout.
            with tempfile.TemporaryDirectory() as td:
                a=m.Audit(td);a.logs=lambda c:'';a.state=lambda c:{'Running':False,'ExitCode':1,'OOMKilled':False}
                a.run=lambda *args,**kwargs:(0,'','ReferenceError: deliberately missing API')
                try:
                    with contextlib.redirect_stdout(io.StringIO()):a.wait_event('test',lambda e:True)
                    raised=False
                except RuntimeError as exc:raised='ReferenceError' in str(exc)
                check('Dead target surfaces its actual stderr immediately',raised)
            bspec=importlib.util.spec_from_file_location('build_viewer',HERE/'build_viewer.py')
            builder=importlib.util.module_from_spec(bspec);bspec.loader.exec_module(builder)
            with tempfile.TemporaryDirectory() as td:
                root=Path(td);out=root/'trajectory-explorer.html'
                report={'status':'failed','failed_stage':'unit_fixture','exception':'</script><script>window.__bad=1</script>'}
                (root/'report.json').write_text(json.dumps(report));(root/'pages-1.img').write_bytes(b'memory')
                (root/'linked.log').symlink_to(root/'report.json')
                with contextlib.redirect_stdout(io.StringIO()):payload=builder.collect_files(root,out)
                names=[f['name'] for f in payload['files']]
                check('Builder excludes raw memory and symlinks','pages-1.img' not in names and 'linked.log' not in names)
                text=builder.render(payload)
                check('Embedded log cannot close its JSON script element','</script><script>window.__bad=1' not in text and '\\u003c/script' in text)
                check('Builder never changes source evidence',json.loads((root/'report.json').read_text())==report)
        except Exception:
            traceback.print_exc()
            if not results or results[-1]['passed']:
                results.append({'name':'Unexpected self-test exception','passed':False,'detail':traceback.format_exc()})
        finally:
            report={'status':'passed' if results and all(t['passed'] for t in results) else 'failed',
                    'scope':'Local syntax, verifier, subprocess and packaging tests. NOT Docker/CRIU restoration.',
                    'tests':results,'passed':sum(t['passed'] for t in results),'failed':sum(not t['passed'] for t in results)}
            root=Path(os.environ.get('EVIDENCE_DIR','evidence'));root.mkdir(parents=True,exist_ok=True)
            (root/'self-tests.json').write_text(json.dumps(report,indent=2)+'\n')
            print('SELF TEST SUMMARY '+json.dumps({k:v for k,v in report.items() if k!='tests'}),flush=True)
        raise SystemExit(0 if report['status']=='passed' else 1)
        EMBED_SELF_TESTS_PY_1
        printf "Embedded self_tests.py part 1/1; cumulative bytes: "
        wc -c < "$BUNDLE_DIR/self_tests.py"
    - name: Verify every embedded byte and print the package manifest
      id: integrity
      shell: bash
      run: |
        set -Eeuo pipefail
        python3 - <<'PYVERIFY'
        import hashlib,json,os,pathlib,sys
        root=pathlib.Path(os.environ['BUNDLE_DIR']); evidence=pathlib.Path(os.environ['EVIDENCE_DIR'])
        expected={'checkpoint_probe.py': '70e826f0157042bc16f9336c5427e63b67eed00afcd69b8613ccbd61ce8a8638', 'build_viewer.py': '91a6ee15e3863deeea9307fa675c6ac69ffab17be6120d36741fc76295e81556', 'viewer-template.html': 'f0e324b18c0b1d206208fc3b1c0518006c4c8a3023294a5eab96b8ba8dc51b1e', 'install_criu.sh': '8fbe8a11ffaa911f7b89357ea5b5f5f347e09f4fa292f33a53e0c5f021c72757', 'host_diagnostics.sh': '96cfdc39bcc6b5831c7784e140e1c62e45ba1b33ab698f53aaea7e68a0e647b2', 'report_tools.py': 'd421e378c3eb9056d4cba58581706f3deb00f3d6bc9058865725df1e98ee83fd', 'self_tests.py': 'b6c327fd96f351d7fc102ea90dbaaa74e4e7486e448d4c941e430e296c90a545'}
        rows=[]
        for name,wanted in expected.items():
            actual=hashlib.sha256((root/name).read_bytes()).hexdigest()
            good=actual==wanted
            rows.append({'path':name,'bytes':(root/name).stat().st_size,'sha256':actual,'expected':wanted,'passed':good})
            print(('PASS' if good else 'FAIL')+f' ASSET | {name} | bytes={rows[-1]["bytes"]} | SHA256={actual}',flush=True)
        report={'status':'passed' if all(r['passed'] for r in rows) else 'failed','assets':rows}
        (evidence/'asset-integrity.json').write_text(json.dumps(report,indent=2)+'\n')
        raise SystemExit(0 if report['status']=='passed' else 1)
        PYVERIFY
        python3 -m py_compile "$BUNDLE_DIR/checkpoint_probe.py" "$BUNDLE_DIR/build_viewer.py" "$BUNDLE_DIR/report_tools.py" "$BUNDLE_DIR/self_tests.py"
        cp "$BUNDLE_DIR"/*.py "$BUNDLE_DIR"/*.sh "$BUNDLE_DIR"/*.html "$EVIDENCE_DIR/sources/"
    - name: Run embedded verifier tests (not a claim of CRIU success)
      id: self_tests
      continue-on-error: true
      shell: bash
      run: |
        set -Eeuo pipefail
        python3 -u "$BUNDLE_DIR/checkpoint_probe.py" stream local-self-tests   python3 -u "$BUNDLE_DIR/self_tests.py" 2>&1 | tee "$EVIDENCE_DIR/self-test-console.log"
    - name: Stream complete host, resource and runtime diagnostics
      continue-on-error: true
      shell: bash
      run: |
        set -Eeuo pipefail
        python3 -u "$BUNDLE_DIR/checkpoint_probe.py" stream host-preflight   bash "$BUNDLE_DIR/host_diagnostics.sh" 2>&1 | tee "$EVIDENCE_DIR/host-console.log"
    - name: Source-build the pinned CRIU release with live compiler logs
      id: criu_setup
      continue-on-error: true
      if: ${{ steps.self_tests.outcome == 'success' }}
      shell: bash
      run: |
        set -Eeuo pipefail
        python3 -u "$BUNDLE_DIR/checkpoint_probe.py" stream criu-install   bash "$BUNDLE_DIR/install_criu.sh" 2>&1 | tee "$EVIDENCE_DIR/criu-install-console.log"
    - name: Configure Docker checkpoint support and print feature diagnostics
      id: daemon
      continue-on-error: true
      if: ${{ steps.criu_setup.outcome == 'success' }}
      shell: bash
      run: |
        set -Eeuo pipefail
        python3 -u "$BUNDLE_DIR/checkpoint_probe.py" daemon 2>&1 | tee "$EVIDENCE_DIR/daemon-console.log"
    - name: Attempt real V8 checkpoints and exact probe-state restoration
      id: experiment
      continue-on-error: true
      if: ${{ always() && steps.integrity.outcome == 'success' }}
      shell: bash
      run: |
        set -Eeuo pipefail
        python3 -u "$BUNDLE_DIR/checkpoint_probe.py" 2>&1 | tee "$EVIDENCE_DIR/experiment-console.log"
    - name: Summarize exact failures and collect host-side runtime evidence
      id: summary
      if: ${{ always() }}
      continue-on-error: true
      shell: bash
      run: |
        set -Eeuo pipefail
        mkdir -p "$EVIDENCE_DIR"
        python3 -u "$BUNDLE_DIR/report_tools.py" summary
        # These are diagnostics; an unavailable journal must not prevent HTML generation.
        sudo journalctl -u docker -u containerd --since '1 hour ago' --no-pager > "$EVIDENCE_DIR/runtime-journal.log" 2>&1 || true
        sudo dmesg --ctime > "$EVIDENCE_DIR/dmesg.log" 2>&1 || true
        sudo chown -R "$(id -u):$(id -g)" "$EVIDENCE_DIR"
        # Logs can be lengthy. Full contents are uploaded; print the final 120 lines here as an extra pointer.
        printf '
        === RUNTIME JOURNAL TAIL (FULL JOURNAL IS IN ARTIFACT) ===
        '
        tail -n 120 "$EVIDENCE_DIR/runtime-journal.log" || true
        printf '
        === KERNEL LOG TAIL (FULL LOG IS IN ARTIFACT) ===
        '
        tail -n 120 "$EVIDENCE_DIR/dmesg.log" || true
    - name: Generate the self-contained HTML5 trajectory explorer even on failure
      id: viewer
      if: ${{ always() }}
      continue-on-error: true
      shell: bash
      run: |
        set -Eeuo pipefail
        mkdir -p "$EVIDENCE_DIR"
        python3 -u "$BUNDLE_DIR/build_viewer.py" "$EVIDENCE_DIR" "$EVIDENCE_DIR/trajectory-explorer.html"
        printf '
        === HTML OUTPUT ===
        '
        ls -lh "$EVIDENCE_DIR/trajectory-explorer.html"
        sha256sum "$EVIDENCE_DIR/trajectory-explorer.html"
        printf '
        Open trajectory-explorer.html from the extracted artifact. No web server or network access is needed.
        '
        printf 'Display rewind and branch plans are not a live runtime-control service.
        '
    - name: Print an SHA-256 inventory of every evidence file
      if: ${{ always() }}
      continue-on-error: true
      shell: bash
      run: |
        set -Eeuo pipefail
        python3 -u "$BUNDLE_DIR/report_tools.py" inventory
    - name: Upload HTML, all logs, reports and generated sources even on failure
      if: ${{ always() }}
      uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
      with:
        name: v8-checkpoint-atlas-${{ github.run_id }}-${{ github.run_attempt }}
        path: ${{ env.EVIDENCE_DIR }}/
        if-no-files-found: error
        retention-days: 14
        compression-level: 6
    - name: Fail closed unless real continuity and report generation both passed
      if: ${{ always() }}
      shell: bash
      run: |
        set -Eeuo pipefail
        python3 -u "$BUNDLE_DIR/report_tools.py" gate

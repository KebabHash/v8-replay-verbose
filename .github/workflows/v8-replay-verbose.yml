    - name: Embed report_tools.py [1/1]
      shell: bash
      run: |
        set -Eeuo pipefail
        cat > "$BUNDLE_DIR/report_tools.py" <<'EMBED_REPORT_TOOLS_PY_1'
        """Summary, inventory, integrity and final fail-closed gate. Standard library only."""
        import datetime
        import hashlib
        import html
        import json
        import os
        from pathlib import Path
        import sys

        ROOT = Path(os.environ.get('EVIDENCE_DIR', 'evidence'))
        ROOT.mkdir(parents=True, exist_ok=True)


        def read(name):
            try:
                result = json.loads((ROOT / name).read_text())
                if not isinstance(result, dict): raise ValueError('Expected a JSON object')
                return result
            except (OSError, ValueError) as exc:
                return {'status': 'not_run', 'exception': str(exc)}


        def summary():
            records = {n: read(n) for n in ('self-tests.json', 'setup.json', 'daemon-setup.json', 'report.json')}
            success = all(r.get('status') == 'passed' for r in records.values())
            lines = ['# V8 checkpoint + HTML5 trajectory audit', '',
                     '**Execution result: ' + ('PASS for this finite probe only' if success else 'NOT DEMONSTRATED') + '**', '',
                     '| Stage | Status | Phase / error |', '|---|---|---|']
            for name, r in records.items():
                detail = str(r.get('last_phase', r.get('failed_stage', r.get('stage', ''))))
                if r.get('exception'): detail += ' / ' + str(r['exception'])
                lines.append('| ' + name + ' | ' + str(r.get('status','unknown')) + ' | ' + detail.replace('|','/').replace('\n',' ') + ' |')
            experiment = records['report.json']
            lines += ['', '## Explicit limits',
                      'This uses the actual pinned V8 image and attempts live CRIU checkpoint/restore.',
                      'The probe uses verified output APIs and a timed pause window; it does not require the removed shell read() API.',
                      'Host time continues while the process is stopped. This does NOT claim deterministic clock replay.',
                      'Exact equality is checked for 4,096 probe words, token, counter and hot-function result, not every byte of V8/JIT/OS state.',
                      'The model/agent, sockets, cross-host migration and alternative-agent branches are not tested.',
                      'HTML rewind navigates recorded observations only. No live execution service is embedded.',
                      'Checkpoint memory images and the runtime container are not retained in the downloadable artifact.',
                      '', '## Assertions', '| Check | Result |', '|---|---|']
            for a in experiment.get('assertions', []):
                lines.append('| ' + str(a['name']).replace('|','/') + ' | ' + ('PASS' if a.get('passed') is True else 'FAIL') + ' |')
            lines += ['', '## Checkpoint / restore durations', '| Round | Dump seconds | Restore seconds |', '|---|---|---|']
            for row in experiment.get('rounds',[]):
                lines.append(f"| {row.get('round')} | {row.get('dump_s','not reached')} | {row.get('restore_s','not reached')} |")
            text = '\n'.join(lines) + '\n'
            (ROOT/'summary.md').write_text(text)
            (ROOT/'overall.json').write_text(json.dumps({'passed': success, 'stages': records}, indent=2)+'\n')
            print(text, flush=True)
            dest = os.environ.get('GITHUB_STEP_SUMMARY')
            if dest:
                with open(dest,'a') as f: f.write(text)
            return 0


        def inventory():
            rows=[]
            for p in sorted(ROOT.rglob('*')):
                if p.is_symlink() or not p.is_file() or p.name=='artifact-manifest.json': continue
                # Hash by streaming: verbose logs need not fit in memory.
                h=hashlib.sha256()
                with p.open('rb') as f:
                    while chunk:=f.read(1024*1024): h.update(chunk)
                rows.append({'path':p.relative_to(ROOT).as_posix(),'bytes':p.stat().st_size,'sha256':h.hexdigest()})
            report={'created_utc':datetime.datetime.now(datetime.timezone.utc).isoformat(),
                    'files':rows,'file_count':len(rows),'bytes':sum(r['bytes'] for r in rows),
                    'manifest_excludes_itself':True,'raw_memory_images_uploaded':False}
            (ROOT/'artifact-manifest.json').write_text(json.dumps(report,indent=2)+'\n')
            for r in rows: print(f"ARTIFACT | {r['bytes']:>10} bytes | SHA256 {r['sha256']} | {r['path']}",flush=True)
            print(f"ARTIFACT TOTAL | files={len(rows)} | bytes={report['bytes']}",flush=True)
            return 0


        def gate():
            required=('asset-integrity.json','self-tests.json','setup.json','daemon-setup.json','report.json','viewer-build.json')
            states={n:read(n) for n in required}
            for n,r in states.items():
                print(f"FINAL GATE {n} | status={r.get('status')} | phase={r.get('failed_stage',r.get('last_phase',''))} | error={r.get('exception','')}",flush=True)
            ok=all(r.get('status')=='passed' for r in states.values())
            print('PASS: finite live-V8 continuity test and HTML generation passed.' if ok else
                  'NOT DEMONSTRATED. HTML may still be usable; report generation is not checkpoint success.',flush=True)
            return 0 if ok else 1


        if __name__=='__main__':
            functions={'summary':summary,'inventory':inventory,'gate':gate}
            if len(sys.argv)!=2 or sys.argv[1] not in functions: raise SystemExit('Use summary, inventory, or gate')
            raise SystemExit(functions[sys.argv[1]]())
        EMBED_REPORT_TOOLS_PY_1
        printf "Embedded report_tools.py part 1/1; cumulative bytes: "
        wc -c < "$BUNDLE_DIR/report_tools.py"

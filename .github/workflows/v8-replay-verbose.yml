# Single file: put ONLY this YAML in .github/workflows/v8-checkpoint-atlas.yml.
# All project Python, Bash, JavaScript, HTML and CSS are embedded below.
# No checkout, companion files, Python packages, npm packages or API keys.
# Internet is required for APT dependencies, pinned CRIU source, the pinned V8 image,
# and the pinned upload-artifact action. This is NOT an air-gapped distribution.
#
# SECURITY/SCOPE: disposable GitHub-hosted Ubuntu runner only. Restarts Docker.
# No network inside the target container, no Docker socket mount, no terminal/TTY.
# seccomp and AppArmor are relaxed only for the test container to support CRIU.
# Raw checkpoint images are not uploaded. Do not add secrets to the workload.
# HTML rewind is evidence navigation; real restoration happens during this job.
#
# DEPENDENCY PROVENANCE:
# https://github.com/checkpoint-restore/criu/commit/2b7ac603cda31d015d91c856c34c557cb2300e7d
# https://docs.docker.com/reference/cli/docker/checkpoint/
# https://raw.githubusercontent.com/sunblaze-ucb/exploitgym/main/data/tasks/v8/human/446124892/challenge/patch
# https://docs.github.com/en/actions/reference/workflows-and-actions/workflow-syntax
# Every run block is kept below GitHub's documented 21,000-character limit.
#
# LOCAL VALIDATION IS NOT A LIVE GITHUB/DOCKER/CRIU RESULT.
name: V8 Checkpoint Atlas - self-contained and ultra verbose
'on':
  workflow_dispatch:
    inputs:
      restore_rounds:
        description: Sequential real checkpoint/restore rounds (1-5)
        type: string
        default: '2'
      warmup_seconds:
        description: Work before each checkpoint boundary (1-30 seconds)
        type: string
        default: '3'
      timed_gate_seconds:
        description: Pause window for capture (15-180 seconds). Host waits out the gate while target is stopped.
        type: string
        default: '45'
permissions:
  contents: read
jobs:
  feasibility:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      BUNDLE_DIR: ${{ runner.temp }}/v8-checkpoint-atlas
      EVIDENCE_DIR: ${{ github.workspace }}/evidence
      IMAGE: cybergym/v8@sha256:d53b336a90e184fe61c2067342eb278f6d54d009d7b4d93b958029b86904e48a
      CRIU_VERSION: '4.3'
      CRIU_COMMIT: 2b7ac603cda31d015d91c856c34c557cb2300e7d
      RESTORE_ROUNDS: ${{ inputs.restore_rounds || '2' }}
      WARMUP: ${{ inputs.warmup_seconds || '3' }}
      TIMED_GATE_SECONDS: ${{ inputs.timed_gate_seconds || '45' }}
      HEARTBEAT_SECONDS: '5'
      PYTHONUNBUFFERED: '1'
      DOCKER_CLI_EXPERIMENTAL: enabled
    steps:
    - name: Initialize the single-file package and evidence directory
      id: initialize
      shell: bash
      run: |
        set -Eeuo pipefail
        mkdir -p "$BUNDLE_DIR" "$EVIDENCE_DIR" "$EVIDENCE_DIR/sources"
        printf '
        === V8 CHECKPOINT ATLAS: SINGLE YAML, FULL CONSOLE OUTPUT ===
        '
        printf 'All project code and HTML are embedded in this workflow. No checkout, pip, npm, CDN or model key is required.
        '
        printf 'Network is still required for APT build dependencies, pinned CRIU source, the V8 image and artifact upload.
        '
        printf 'Rewind in HTML inspects evidence; it does not control a live process.
        '
        printf 'Run: %s  attempt: %s  revision: %s
        ' "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$GITHUB_SHA"
        printf 'Evidence: %s
        Sources: %s
        ' "$EVIDENCE_DIR" "$BUNDLE_DIR"
    - name: Embed checkpoint_probe.py [1/3]
      shell: bash
      run: |
        set -Eeuo pipefail
        cat > "$BUNDLE_DIR/checkpoint_probe.py" <<'EMBED_CHECKPOINT_PROBE_PY_1'
        import datetime
        import hashlib
        import json
        import os
        from pathlib import Path
        import re
        import shlex
        import signal
        import subprocess
        import sys
        import threading
        import time
        import traceback
        import uuid

        # No removed shell file APIs are required. The native binary is not patched.
        # Timed rendezvous: the tracked probe words stay unchanged during a wall-clock gate.
        # The controller checkpoints before the gate expires, waits while STOPPED, then restores.
        # Date/time is deliberately external and advancing; this is not clock replay.
        PROBE_JS = r'''"use strict";
        const CONFIG = __PROBE_CONFIG__;
        const writeLine = (typeof globalThis.print === "function")
          ? (s) => globalThis.print(s)
          : (typeof globalThis.console === "object" && typeof globalThis.console.log === "function")
            ? (s) => globalThis.console.log(s)
            : null;
        if (!writeLine) throw new Error("No supported output API: neither print nor console.log is available");
        const token = Array.from({length: 6}, () =>
          Math.floor(Math.random() * 4294967296).toString(16).padStart(8, "0")
        ).join("") + "-" + Date.now().toString(16);
        const heap = new Uint32Array(4096);
        let seed = 2166136261 >>> 0;
        for (const c of token) seed = Math.imul(seed ^ c.charCodeAt(0), 16777619) >>> 0;
        for (let i = 0; i < heap.length; i++) {
          seed = (Math.imul(seed, 1664525) + 1013904223) >>> 0;
          heap[i] = seed;
        }
        let tick = 0, hotResult = 0;
        function hot(x) { return (Math.imul(x ^ 0x12345678, 17) + 3) | 0; }
        function digest() {
          let h = 2166136261 >>> 0;
          for (let i = 0; i < heap.length; i++) h = Math.imul(h ^ heap[i], 16777619) >>> 0;
          return h.toString(16).padStart(8, "0");
        }
        function emit(event, ticket = "", extra = {}) {
          const state = {event, ticket, token, tick, digest: digest(), hot: hotResult, words: heap.length, ...extra};
          if (event === "paused" || event === "resumed") state.heap_words = Array.from(heap);
          writeLine("V8_PROBE " + JSON.stringify(state));
        }
        function delay(ms) { const end = Date.now() + ms; while (Date.now() < end) {} }
        function advance() {
          for (let j = 0; j < 20000; j++) {
            const i = (j + tick) & (heap.length - 1);
            hotResult = hot((heap[i] + j) | 0);
            heap[i] = (heap[i] ^ hotResult) >>> 0;
          }
          tick++;
          emit("tick");
        }
        emit("boot", "", {protocol: "timed-gate-v1", config: CONFIG});
        for (let round = 1; round <= CONFIG.rounds; round++) {
          const warmUntil = Date.now() + CONFIG.warmup_ms;
          do { advance(); delay(CONFIG.tick_ms); } while (Date.now() < warmUntil);
          const ticket = token + ":round-" + round;
          const deadline_ms = Date.now() + CONFIG.gate_ms;
          emit("paused", ticket, {round, deadline_ms, protocol: "timed-gate-v1"});
          // The tested array, token, counter, and hotResult are not written in this loop.
          while (Date.now() < deadline_ms) delay(20);
          // Recompute the observations from live state after restoration, not cached output.
          emit("resumed", ticket, {round, deadline_ms, protocol: "timed-gate-v1"});
          advance();
        }
        // Keep PID 1 alive so the controller can independently inspect the restored process.
        while (true) { advance(); delay(CONFIG.tick_ms); }
        '''

        CAPABILITY_JS = r'''(() => {
          const c = {print: typeof globalThis.print, read: typeof globalThis.read,
            console_log: (typeof globalThis.console === "object" ? typeof globalThis.console.log : "undefined"),
            uint32array: typeof Uint32Array, date_now: typeof Date.now};
          const s = ["V8", "API", "CAPABILITIES"].join("_") + ":" + JSON.stringify(c);
          if (c.print === "function") globalThis.print(s);
          else if (c.console_log === "function") globalThis.console.log(s);
          else throw new Error(s);
        })();'''


        def probe_source(rounds, warmup, gate, tick_ms=200):
            config = dict(rounds=rounds, warmup_ms=round(warmup * 1000),
                          gate_ms=round(gate * 1000), tick_ms=tick_ms)
            return PROBE_JS.replace('__PROBE_CONFIG__', json.dumps(config, sort_keys=True))


        def parse_capabilities(text):
            for line in text.splitlines():
                pos = line.find('V8_API_CAPABILITIES:')
                if pos >= 0:
                    try:
                        value, _ = json.JSONDecoder().raw_decode(line[pos + len('V8_API_CAPABILITIES:'):])
                        if isinstance(value, dict):
                            return value
                    except (ValueError, TypeError):
                        pass
            return {}


        def marker_events(text):
            events = []
            for line in text.splitlines():
                if line.startswith("V8_PROBE "):
                    try:
                        event = json.loads(line[len("V8_PROBE "):])
                    except json.JSONDecodeError:
                        continue
                    if isinstance(event, dict):
                        events.append(event)
            return events


        def continuity_checks(paused, baseline, after, ticket, running):
            """Strict evidence checks; synthetic tests must not count as CRIU success."""
            prefix_ok = after.startswith(baseline)
            delta = after[len(baseline):] if prefix_ok else ""
            events = marker_events(delta)
            resumed = [e for e in events if e.get("event") == "resumed" and e.get("ticket") == ticket]
            r = resumed[0] if len(resumed) == 1 else {}
            valid_pause = (paused.get("event") == "paused" and paused.get("ticket") == ticket
                           and isinstance(paused.get("token"), str) and len(paused["token"]) >= 32
                           and type(paused.get("tick")) is int and paused["tick"] > 0
                           and isinstance(paused.get("digest"), str)
                           and bool(re.fullmatch(r"[0-9a-f]{8}", paused["digest"]))
                           and type(paused.get("hot")) is int and paused.get("words") == 4096
                           and isinstance(paused.get("heap_words"), list) and len(paused["heap_words"]) == 4096
                           and all(type(x) is int and 0 <= x <= 0xffffffff for x in paused["heap_words"]))
            same = lambda key: bool(valid_pause and r and r.get(key) == paused.get(key))
            continued = any(e.get("event") == "tick" and e.get("token") == paused.get("token")
                            and type(e.get("tick")) is int and e["tick"] > paused.get("tick", 10**30)
                            for e in events)
            return {
                "valid_pre_checkpoint_pause": bool(valid_pause),
                "old_log_prefix_preserved": prefix_ok,
                "new_output_after_checkpoint": bool(events),
                "no_cold_boot_in_new_output": bool(events) and not any(e.get("event") == "boot" for e in events),
                "exactly_one_matching_resume": len(resumed) == 1,
                "same_in_memory_startup_token": same("token"),
                "exact_counter_at_resume": same("tick"),
                "exact_heap_digest_at_resume": same("digest"),
                "exact_hot_function_result_at_resume": same("hot"),
                "same_heap_length": same("words"),
                "all_4096_probe_words_exact": same("heap_words"),
                "execution_advances_after_resume": continued,
                "process_alive_after_restore": running is True,
            }


        class Audit:
            def __init__(self, root):
                self.root = Path(root).resolve()
                self.root.mkdir(parents=True, exist_ok=True)
                self.index = sum(1 for line in (self.root / "events.jsonl").read_text().splitlines()
                                     if '"kind": "command_start"' in line) if (self.root / "events.jsonl").exists() else 0
                self.monotonic_start = time.monotonic()
                self.print_lock = threading.Lock()
                self.event_lock = threading.Lock()
                self.heartbeat_s = max(0.05, float(os.environ.get("HEARTBEAT_SECONDS", "5")))
                self.stage = "setup"
                self.report = {"status": "not_demonstrated", "scope": "same-host live d8 process, timed rendezvous, finite probe", "protocol": "timed-gate-v1",
                               "started_utc": self.now(), "assertions": [], "rounds": [],
                               "limitations": ["Not a full VM or agent checkpoint.",
                                   "Finite probe checks do not prove equality of the entire V8 heap or JIT internals.",
                                   "Network is disabled; no socket or model-provider state is tested.",
                                   "This probe uses a wall-clock rendezvous, not shell read() or restored clock state.",
                                    "The binary is unmodified; it must expose print or console.log.",
                                   "Raw CRIU memory images are not uploaded; this is an in-job feasibility test."]}

            @staticmethod
            def now():
                return datetime.datetime.now(datetime.timezone.utc).isoformat()

            def say(self, message):
                with self.print_lock:
                    print(f"[{self.now()}] [{self.stage}] {message}", flush=True)

            def event(self, kind, **fields):
                event = {"utc": self.now(), "kind": kind, "stage": self.stage, **fields}
                with self.event_lock:
                    with (self.root / "events.jsonl").open("a") as f:
                        f.write(json.dumps(event, sort_keys=True) + "\n")
                self.say("EVENT " + json.dumps(event, sort_keys=True))

            def run(self, label, argv, timeout=90, required=False):
                self.index += 1
                tag = f"{self.index:04d}-{label}"
                self.event("command_start", label=tag, argv=argv, timeout_s=timeout)
                self.say("=" * 110)
                self.say(f"COMMAND {tag} | timeout={timeout}s | cwd={os.getcwd()}")
                self.say("ARGV " + shlex.join(argv))
                started = time.monotonic()
                buffers = {"stdout": [], "stderr": []}
                counts = {"stdout": 0, "stderr": 0}
                timed_out = False
                last_output = [started]
                finished = threading.Event()
                threads = []
                proc = None
                stream_errors = []
                def consume(stream, key):
                    try:
                        with (self.root / (tag + "." + key + ".txt")).open("w", encoding="utf-8") as log:
                            for line in stream:
                                buffers[key].append(line)
                                log.write(line)
                                log.flush()
                                counts[key] += len(line.encode())
                                last_output[0] = time.monotonic()
                                self.say(f"{tag} {key.upper()} | " + line.rstrip("\n"))
                    except Exception as exc:
                        stream_errors.append(str(exc))
                        self.say(f"LOGGER ERROR {tag} {key}: {exc!r}")
                def heartbeat():
                    while not finished.wait(self.heartbeat_s):
                        elapsed = time.monotonic() - started
                        silence = time.monotonic() - last_output[0]
                        self.say(f"HEARTBEAT {tag} | elapsed={elapsed:.2f}s | silence={silence:.2f}s "
                                 f"| stdout_bytes={counts['stdout']} | stderr_bytes={counts['stderr']} "
                                 f"| timeout_in={max(0, timeout-elapsed):.2f}s")
                hb = threading.Thread(target=heartbeat, daemon=True)
                hb.start()
                try:
                    proc = subprocess.Popen(argv, stdout=subprocess.PIPE, stderr=subprocess.PIPE,
                                            text=True, encoding="utf-8", errors="replace", start_new_session=True)
                    threads = [threading.Thread(target=consume, args=(getattr(proc, key), key), daemon=True)
                               for key in ("stdout", "stderr")]
                    for thread in threads:
                        thread.start()
                    try:
                        rc = proc.wait(timeout=timeout)
                    except subprocess.TimeoutExpired:
                        timed_out = True
                        try:
                            os.killpg(proc.pid, signal.SIGKILL)
                        except ProcessLookupError:
                            pass
                        proc.wait()
                        rc = 124
                    for thread in threads:
                        thread.join(timeout=10)
                    if any(t.is_alive() for t in threads):
                        # A child inherited the log pipe. Terminate the group instead of hanging the report.
                        try:
                            os.killpg(proc.pid, signal.SIGKILL)
                        except ProcessLookupError:
                            pass
                        for thread in threads:
                            thread.join(timeout=2)
                        stream_errors.append("A descendant kept an output pipe open after process exit")
                    if stream_errors and rc == 0:
                        rc = 125
                except OSError as exc:
                    rc = 127
                    buffers["stderr"].append(str(exc))
                    (self.root / (tag + ".stderr.txt")).write_text(str(exc))
                    self.say(f"SPAWN ERROR {tag}: {exc!r}")
                finally:
                    finished.set()
                    hb.join(timeout=1)
                    if proc is not None and not any(t.is_alive() for t in threads):
                        for stream in (proc.stdout, proc.stderr):
                            stream.close()
                out, err = "".join(buffers["stdout"]), "".join(buffers["stderr"])
                for key in ("stdout", "stderr"):
                    path = self.root / (tag + "." + key + ".txt")
                    if not path.exists(): path.write_text("")
                elapsed = round(time.monotonic() - started, 4)
                self.event("command_end", label=tag, exit_code=rc, timed_out=timed_out,
                           elapsed_s=elapsed, stdout_bytes=len(out.encode()), stderr_bytes=len(err.encode()),
                           stream_errors=stream_errors)
                self.say(f"COMMAND END {tag} | exit={rc} | elapsed={elapsed}s | timed_out={timed_out}")
                if required and rc != 0:
                    raise RuntimeError(f"{tag} failed with exit {rc}; {err[-4000:] or out[-4000:] or 'No output'}")
                return rc, out, err

            def require(self, name, condition, detail=None):
                item = {"name": name, "passed": bool(condition), "detail": detail, "stage": self.stage}
                self.report["assertions"].append(item)
                self.event("assertion", **item)
                if not condition:
                    raise RuntimeError(f"Assertion failed: {name}")

            def state(self, container):
                _, out, _ = self.run("inspect-state", ["docker", "inspect", "--format", "{{json .State}}", container], required=True)
                return json.loads(out)

            def logs(self, container):
                return self.run("target-logs", ["docker", "logs", container], required=True)[1]

            def wait_event(self, container, predicate, prefix="", timeout=45):
                end = time.monotonic() + timeout
                poll = 0
                while time.monotonic() < end:
                    poll += 1
                    logs = self.logs(container)
                    state = self.state(container)
                    self.say(f"WAIT poll={poll} | running={state.get('Running')} | pid={state.get('Pid')} "
                             f"| exit={state.get('ExitCode')} | oom={state.get('OOMKilled')} "
                             f"| remaining={max(0,end-time.monotonic()):.2f}s")
                    if state.get('Running') is not True:
                        _, out, err = self.run('early-exit-target-output', ['docker', 'logs', container])
                        raise RuntimeError('Target exited before required event: ' + json.dumps(state) +
                                           '\nSTDOUT:\n' + out[-8000:] + '\nSTDERR:\n' + err[-8000:])
                    if prefix and not logs.startswith(prefix):
                        raise RuntimeError('Target log prefix changed; old and new output cannot be distinguished safely')
                    delta = logs[len(prefix):] if prefix else logs
                    matches = [e for e in marker_events(delta) if predicate(e)]
                    if matches:
                        self.event('marker_observed', snapshot=matches[-1], polling_attempt=poll)
                        return matches[-1], logs
                    time.sleep(0.5)
                raise TimeoutError('Expected V8 marker did not appear before deadline; inspect target output and container state')

            def resource_snapshot(self, container, reason):
                state = self.state(container)
                pid = state.get('Pid', 0)
                self.event('resource_boundary', reason=reason, container_state=state)
                if not isinstance(pid, int) or pid <= 0 or not state.get('Running'):
                    self.say('No live PID: RSS is unobserved, not zero.')
                    return
                code = r'''import json, pathlib, sys
        pid=int(sys.argv[1]); p=pathlib.Path('/proc')/str(pid)
        status=(p/'status').read_text()
        values={line.split(':',1)[0]:line.split(':',1)[1].strip() for line in status.splitlines() if ':' in line}
        EMBED_CHECKPOINT_PROBE_PY_1
        printf "Embedded checkpoint_probe.py part 1/3; cumulative bytes: "
        wc -c < "$BUNDLE_DIR/checkpoint_probe.py"
    - name: Embed checkpoint_probe.py [2/3]
      shell: bash
      run: |
        set -Eeuo pipefail
        cat >> "$BUNDLE_DIR/checkpoint_probe.py" <<'EMBED_CHECKPOINT_PROBE_PY_2'
        mem={line.split(':',1)[0]:int(line.split()[1])*1024 for line in pathlib.Path('/proc/meminfo').read_text().splitlines() if ':' in line}
        result={'pid':pid,'process_status':values,'host_available_bytes':mem.get('MemAvailable')}
        for name,key in [('VmRSS','rss_bytes'),('VmSize','virtual_bytes'),('VmHWM','peak_rss_bytes')]:
            value=values.get(name)
            if value: result[key]=int(value.split()[0])*1024
        result['cgroup']=(p/'cgroup').read_text()
        for line in result['cgroup'].splitlines():
            if line.startswith('0::'):
                cg=pathlib.Path('/sys/fs/cgroup')/line.split('::',1)[1].lstrip('/')
                for name in ['memory.current','memory.peak','memory.max','memory.events','memory.swap.max']:
                    try: result[name]=(cg/name).read_text().strip()
                    except OSError: pass
        print(json.dumps(result,sort_keys=True))
        '''
                rc, out, err = self.run('process-memory-' + reason, ['sudo','python3','-c',code,str(pid)])
                if rc == 0:
                    try:
                        sample = json.loads(out)
                        self.event('resource_sample', relative_s=round(time.monotonic()-self.monotonic_start,4),
                                   reason=reason, **sample)
                    except ValueError:
                        self.event('resource_unavailable', reason=reason, error='Could not parse process-memory data')
                else:
                    self.event('resource_unavailable', reason=reason, error=err)
                self.run('process-list-' + reason, ['docker','top',container,'-eo','pid,ppid,stat,etime,rss,vsz,args'])

            def wait_stopped_until(self, deadline_ms):
                wait = max(0.0, deadline_ms / 1000.0 + 0.2 - time.time())
                limit = time.monotonic() + wait
                self.event('timed_gate_wait', seconds=round(wait,3), deadline_ms=deadline_ms,
                           explanation='Target is checkpointed and stopped. Host clock continues; this is not clock replay.')
                while time.monotonic() < limit:
                    remaining = limit - time.monotonic()
                    self.say(f'STOPPED GATE HEARTBEAT | waiting={remaining:.2f}s | no target is executing')
                    time.sleep(min(self.heartbeat_s, remaining))

            def evidence_for_container(self, container, docker_root):
                self.run("inspect-complete", ["docker", "inspect", container])
                self.run("stats", ["docker", "stats", "--no-stream", container], timeout=30)
                rc, out, _ = self.run("container-id", ["docker", "inspect", "--format", "{{.Id}}", container])
                cid = out.strip()
                if rc != 0 or not re.fullmatch(r"[0-9a-f]{64}", cid):
                    return
                # Copy logs and inventory only. Do NOT upload raw process-memory images.
                collect = r'''
        import json, pathlib, shutil, sys
        base, dst = map(pathlib.Path, sys.argv[1:])
        dst.mkdir(parents=True, exist_ok=True)
        rows = []
        if base.exists():
            for path in sorted(base.rglob('*')):
                if path.is_file() and not path.is_symlink():
                    rows.append({'path': str(path.relative_to(base)), 'bytes': path.stat().st_size})
                    if path.suffix in ('.log', '.txt'):
                        target = dst / str(path.relative_to(base)).replace('/', '__')
                        shutil.copyfile(path, target)
        (dst / 'inventory.json').write_text(json.dumps(rows, indent=2))
        print(json.dumps(rows, indent=2))
        '''
                self.run("checkpoint-inventory", ["sudo", "python3", "-c", collect,
                            str(Path(docker_root) / "containers" / cid / "checkpoints"),
                            str(self.root / "criu-checkpoint-logs")])

            def main(self):
                container = "v8-criu-" + uuid.uuid4().hex[:12]
                created = False
                docker_root = "/var/lib/docker"
                try:
                    for filename in ("setup.json", "daemon-setup.json"):
                        path = self.root / filename
                        status = json.loads(path.read_text()) if path.exists() else {"status": "missing"}
                        self.require(filename + " succeeded", status.get("status") == "passed", status)
                    rounds = int(os.environ.get("RESTORE_ROUNDS", "2"))
                    warmup = int(os.environ.get("WARMUP", "3"))
                    gate = int(os.environ.get("TIMED_GATE_SECONDS", "45"))
                    self.require("round count within bounds", 1 <= rounds <= 5, rounds)
                    self.require("warmup within bounds", 1 <= warmup <= 30, warmup)
                    self.require("timed gate within bounds", 15 <= gate <= 180, gate)
                    image = os.environ["IMAGE"]
                    self.require("image pinned by SHA256 digest", bool(re.fullmatch(r"[^\s]+@sha256:[0-9a-f]{64}", image)), image)
                    self.report.update(image=image, requested_rounds=rounds, gate_seconds=gate,
                                       run_id=os.environ.get('GITHUB_RUN_ID','local'))
                    self.stage = "image_setup"
                    self.run("image-pull", ["docker", "pull", image], timeout=600, required=True)
                    self.run("image-inspect", ["docker", "image", "inspect", image], required=True)
                    docker_root = self.run("docker-root", ["docker", "info", "--format", "{{.DockerRootDir}}"], required=True)[1].strip()
                    find_script = 'command -v d8 || find / -xdev -type f -name d8 -executable 2>/dev/null; true'
                    _, found, _ = self.run("find-d8", ["docker", "run", "--rm", "--network", "none", "--entrypoint", "/bin/sh", image, "-c", find_script], timeout=120, required=True)
                    candidates = [s.strip() for s in found.splitlines() if s.strip().startswith("/") and " " not in s.strip()]
                    self.require("real d8 binary found", bool(candidates), found)
                    d8 = candidates[0]
                    self.report["d8"] = d8
                    options = ["--runtime", "runc", "--network", "none", "--memory", "4g", "--memory-swap", "4g",
                               "--cpus", "2", "--pids-limit", "256", "--security-opt", "seccomp=unconfined",
                               "--security-opt", "apparmor=unconfined", "--workdir", str(Path(d8).parent)]
                    self.report["container_options"] = options
                    self.run("d8-version", ["docker", "run", "--rm", *options, "--entrypoint", d8, image, "--version"], required=True)
                    self.run('d8-binary-hash', ['docker','run','--rm','--network','none','--entrypoint','/bin/sh',image,
                                              '-c','sha256sum "$1"; uname -a; ls -l "$1"','sh',d8],required=True)
                    self.stage = "api_capabilities"
                    rc, out, err = self.run('d8-api-capabilities', ['docker','run','--rm',*options,'--entrypoint',d8,image,'-e',CAPABILITY_JS])
                    caps = parse_capabilities(out + "\n" + err)
                    self.report['d8_capabilities'] = caps
                    (self.root/'d8-capabilities.json').write_text(json.dumps(caps,indent=2)+'\n')
                    self.require('real d8 has a supported output API', rc == 0 and
                                 (caps.get('print') == 'function' or caps.get('console_log') == 'function'),
                                 {'exit_code':rc,'capabilities':caps,'stdout':out,'stderr':err})
                    self.require('real d8 has standard typed arrays and time',
                                 caps.get('uint32array') == 'function' and caps.get('date_now') == 'function',caps)
                    self.event('probe_protocol', protocol='timed-gate-v1',
                               read_api_required=False, target_binary_modified=False,
                               note='No shell read()/readline() or file API is used. A timed boundary is not deterministic clock replay.')
                    self.stage = "v8_start"
                    self.run("container-create", ["docker", "create", "--name", container, *options,
                              "--log-driver", "json-file", "--entrypoint", d8, image, "/tmp/v8-checkpoint-probe.js"], required=True)
                    created = True
                    js = self.root / "probe.js"
                    js.write_text(probe_source(rounds,warmup,gate))
                    self.report["probe_sha256"] = hashlib.sha256(js.read_bytes()).hexdigest()
                    self.run("copy-probe", ["docker", "cp", str(js), container + ":/tmp/v8-checkpoint-probe.js"], required=True)
                    self.run("container-start", ["docker", "start", container], required=True)
                    self.wait_event(container, lambda e: e.get("event") == "tick")
                    self.resource_snapshot(container,'startup')
                    for number in range(1, rounds + 1):
                        checkpoint = f"round-{number}"
                        self.stage = "pause"
                        paused, _ = self.wait_event(container, lambda e: e.get('event') == 'paused' and e.get('round') == number,
                                                    timeout=warmup+45)
                        ticket = paused.get('ticket')
                        deadline = paused.get('deadline_ms')
                        self.require(f'round {number}: valid timed gate', isinstance(ticket,str) and
                                     type(deadline) is int and deadline/1000-time.time() > 2,
                                     {'ticket':ticket,'deadline_ms':deadline,'host_now_ms':int(time.time()*1000)})
                        row = {'round':number,'checkpoint':checkpoint,'ticket':ticket,'paused':paused,'checks':{}}
                        self.report['rounds'].append(row)
                        self.event("round_start", number=number, ticket=ticket, checkpoint=checkpoint)
                        self.require(f"round {number}: alive before dump", self.state(container).get("Running") is True)
                        self.stage = "checkpoint"
                        start = time.monotonic()
                        self.run("checkpoint-create", ["docker", "checkpoint", "create", container, checkpoint], timeout=180, required=True)
                        row['dump_s'] = time.monotonic() - start
                        self.require(f"round {number}: stopped after dump", self.state(container).get("Running") is False)
                        baseline = self.logs(container)
                        time.sleep(0.5)
                        self.require(f"round {number}: logs stable while stopped", self.logs(container) == baseline)
                        self.require(f"round {number}: gate did not expire before capture",
                                     not any(e.get('event') == 'resumed' and e.get('ticket') == ticket for e in marker_events(baseline)),
                                     'If false, increase timed_gate_seconds; this is not a valid pause-state capture.')
                        (self.root / f"round-{number}-stopped-baseline.log").write_text(baseline)
                        self.evidence_for_container(container, docker_root)
                        self.stage = 'stopped_gate_wait'
                        self.wait_stopped_until(deadline)
                        self.stage = "restore"
                        start = time.monotonic()
                        self.run("checkpoint-restore", ["docker", "start", "--checkpoint", checkpoint, container], timeout=180, required=True)
                        row['restore_s'] = time.monotonic() - start
                        self.require(f"round {number}: running after restore", self.state(container).get("Running") is True)
                        self.stage = "fidelity"
                        resumed, _ = self.wait_event(container, lambda e: e.get("event") == "resumed" and e.get("ticket") == ticket, prefix=baseline)
                        _, after = self.wait_event(container, lambda e: e.get("event") == "tick" and e.get("tick", -1) > paused["tick"], prefix=baseline)
                        running = self.state(container).get("Running") is True
                        checks = continuity_checks(paused, baseline, after, ticket, running)
                        row.update(checks=checks,resumed=resumed)
                        (self.root / f"round-{number}-resumed.log").write_text(after)
                        # Emit explicit observed values, not a success label without evidence.
                        for key in ('token','tick','digest','hot','words'):
                            self.say(f"FIDELITY {key} | before={paused.get(key)!r} | after={resumed.get(key)!r}")
                        bad = [i for i,(a,b) in enumerate(zip(paused.get('heap_words',[]),resumed.get('heap_words',[]))) if a != b]
                        self.say(f"FIDELITY probe words | compared={len(paused.get('heap_words',[]))} | mismatching_indices={bad}")
                        for key, value in checks.items():
                            self.require(f"round {number}: {key}", value)
                        self.resource_snapshot(container,'restored-'+str(number))
                    self.report["status"] = "passed"
                    self.stage = "complete"
                except Exception as exc:
                    self.report.update(status="failed", failed_stage=self.stage, exception=repr(exc))
                    traceback.print_exc()
                    self.event("experiment_failed", error=repr(exc))
                finally:
                    if created:
                        try:
                            self.evidence_for_container(container, docker_root)
                            self.run("final-target-logs", ["docker", "logs", container])
                        except Exception as exc:
                            self.event("diagnostic_collection_failed", error=repr(exc))
                        self.run("container-cleanup", ["docker", "rm", "-f", container])
                    self.report.update(finished_utc=self.now(), command_count=self.index)
                    (self.root / "report.json").write_text(json.dumps(self.report, indent=2) + "\n")
                    self.say("FINAL MACHINE-READABLE REPORT\n" + json.dumps(self.report, indent=2))
                return 0 if self.report["status"] == "passed" else 1


        def merged_daemon_config(config):
            import copy
            if not isinstance(config, dict):
                raise ValueError('Docker daemon configuration must be a JSON object')
            updated = copy.deepcopy(config)
            updated['experimental'] = True
            return updated


        def configure_daemon(root):
            audit = Audit(root)
            audit.stage = 'docker_configuration'
            result = {'status': 'failed', 'stage': 'docker_configuration'}
            try:
                config = Path('/etc/docker/daemon.json')
                original = config.read_text() if config.exists() else '{}\n'
                (audit.root / 'docker-daemon-before.json').write_text(original)
                merged = merged_daemon_config(json.loads(original))
                pending = audit.root / 'docker-daemon-requested.json'
                pending.write_text(json.dumps(merged, indent=2) + '\n')
                audit.run('daemon-config-validate', ['sudo', 'dockerd', '--validate', '--config-file', str(pending)], required=True)
                # This workflow is fixed to an ephemeral GitHub-hosted runner. Do not run
                # this service restart on a shared host with unrelated live containers.
                audit.run('docker-config-dir', ['sudo', 'mkdir', '-p', '/etc/docker'], required=True)
                audit.run('install-daemon-config', ['sudo', 'install', '-m', '0644', str(pending), str(config)], required=True)
                audit.run('restart-docker', ['sudo', 'systemctl', 'restart', 'docker'], timeout=120, required=True)
                audit.run('docker-version', ['docker', 'version'], required=True)
                audit.run('docker-info', ['docker', 'info'], required=True)
                _, enabled, _ = audit.run('docker-experimental', ['docker', 'info', '--format', '{{.ExperimentalBuild}}'], required=True)
                audit.require('server experimental mode enabled', enabled.strip().lower() == 'true')
                audit.run('checkpoint-help', ['docker', 'checkpoint', '--help'], required=True)
                audit.run('criu-version-as-root', ['sudo', '/usr/sbin/criu', '--version'], required=True)
                # Informative only: optional CRIU features can fail while this particular
                # workload remains checkpointable. The actual dump/restore is decisive.
                rc, _, _ = audit.run('criu-kernel-check', ['sudo', '/usr/sbin/criu', 'check', '-v4'], timeout=90)
                result.update(status='passed', criu_check_exit=rc,
                              note='A successful setup does not imply checkpoint feasibility.')
            except Exception as exc:
                traceback.print_exc()
                result['exception'] = repr(exc)
            finally:
                result['utc'] = audit.now()
                (audit.root / 'daemon-setup.json').write_text(json.dumps(result, indent=2) + '\n')
                print('DAEMON_SETUP_REPORT=' + json.dumps(result), flush=True)
            return 0 if result['status'] == 'passed' else 1


        if __name__ == "__main__":
            root = os.environ.get("EVIDENCE_DIR", "evidence")
        EMBED_CHECKPOINT_PROBE_PY_2
        printf "Embedded checkpoint_probe.py part 2/3; cumulative bytes: "
        wc -c < "$BUNDLE_DIR/checkpoint_probe.py"

        }
        function renderSidebar(){const list=$("traceList");list.replaceChildren();for(const t of app.data.traces){const b=el("button",{class:"trace-button"+(t.id===app.trace?" active":""),"aria-pressed":String(t.id===app.trace)});b.append(el("span",{class:"trace-name"},t.label),el("span",{class:"trace-sub"},`${t.nodes.length} events / ${t.status||"unknown"}`));b.onclick=()=>{stop();app.trace=t.id;app.index=0;renderSidebar();renderSelection();};list.append(b);}if(!app.data.traces.length)list.append(el("div",{class:"small muted"},"No trajectories loaded."));}
        function nodePositions(){
         const traces=app.data.traces, pos=new Map(), axis=$("axisMode").value;
         const calculate=(t,trail=new Set())=>{

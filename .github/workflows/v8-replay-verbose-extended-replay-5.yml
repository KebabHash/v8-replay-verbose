    - name: Embed install_criu.sh [1/1]
      shell: bash
      run: |
        set -Eeuo pipefail
        cat > "$BUNDLE_DIR/install_criu.sh" <<'EMBED_INSTALL_CRIU_SH_1'
        set -Eeuo pipefail
        export LC_ALL=C
        EVIDENCE_DIR="${EVIDENCE_DIR:-$PWD/evidence}"
        CRIU_SBINDIR="${CRIU_SBINDIR:-/usr/sbin}"
        mkdir -p "$EVIDENCE_DIR"
        EVIDENCE_DIR="$(realpath "$EVIDENCE_DIR")"
        export EVIDENCE_DIR
        exec > >(tee "$EVIDENCE_DIR/criu-install.log") 2>&1
        export PS4='+ [${EPOCHREALTIME}] [criu:${phase:-initialization}:${LINENO}] '
        set -x
        phase=initialization
        source_commit=''
        finish() {
          rc=$?
          trap - EXIT
          set +e
          python3 - "$EVIDENCE_DIR" "$rc" "$phase" "$source_commit" <<'PY'
        import datetime, json, pathlib, sys
        root, rc, phase, commit = sys.argv[1:]
        report = {"stage": "criu_setup", "status": "passed" if rc == "0" else "failed",
                  "exit_code": int(rc), "last_phase": phase, "source_commit": commit,
                  "method": "upstream_source_build", "utc": datetime.datetime.now(datetime.timezone.utc).isoformat()}
        p = pathlib.Path(root) / 'setup.json'
        p.write_text(json.dumps(report, indent=2) + '\n')
        print('CRIU_SETUP_REPORT=' + json.dumps(report), flush=True)
        PY
          if [ -n "${GITHUB_OUTPUT:-}" ]; then
            if [ "$rc" -eq 0 ]; then echo 'criu_ready=true' >> "$GITHUB_OUTPUT";
            else echo 'criu_ready=false' >> "$GITHUB_OUTPUT"; fi
          fi
          exit "$rc"
        }
        trap finish EXIT
        : "${CRIU_COMMIT:?A full upstream CRIU commit is required}"
        : "${CRIU_VERSION:?Expected CRIU release version is required}"
        : "${RUNNER_TEMP:?RUNNER_TEMP must be defined}"
        [[ "$CRIU_COMMIT" =~ ^[0-9a-f]{40}$ ]]
        [ "$(uname -m)" = x86_64 ]

        echo '=== CRIU INSTALLATION: SOURCE BUILD, NOT apt-get install criu ==='
        echo "Requested release: $CRIU_VERSION"
        echo "Pinned source commit: $CRIU_COMMIT"
        echo "Installation directory: $CRIU_SBINDIR"
        echo 'Ubuntu Noble package availability is NOT a prerequisite for this installer.'
        phase=apt_metadata
        sudo -n true
        sudo env DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::Retries=3 update
        # Diagnostic only. A missing package is expected on affected Noble archives.
        if apt-cache policy criu; then :; else echo 'WARN: apt-cache policy unavailable'; fi
        phase=build_dependencies
        sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
          ca-certificates git build-essential pkg-config python3 python3-protobuf \
          libprotobuf-dev libprotobuf-c-dev protobuf-c-compiler protobuf-compiler \
          libnl-3-dev libnet1-dev libcap-dev libbsd-dev uuid-dev libgnutls28-dev \
          libnftables-dev libaio-dev liblz4-dev iproute2 iptables util-linux
        phase=source_fetch
        source_dir="$(mktemp -d "$RUNNER_TEMP/criu-source.XXXXXX")"
        echo "Source directory: $source_dir"
        git init "$source_dir"
        git -C "$source_dir" remote add origin https://github.com/checkpoint-restore/criu.git
        git -C "$source_dir" fetch --depth=1 origin "$CRIU_COMMIT"
        git -C "$source_dir" checkout --detach FETCH_HEAD
        phase=source_verification
        source_commit="$(git -C "$source_dir" rev-parse HEAD)"
        [ "$source_commit" = "$CRIU_COMMIT" ]
        git -C "$source_dir" show -s --format=fuller HEAD | tee "$EVIDENCE_DIR/criu-source.txt"
        phase=compile
        # Only the native CRIU target: no Python pip installation or documentation build.
        # Limit compile parallelism to keep RAM use predictable on standard runners.
        make -C "$source_dir" -j2 V=1 WERROR=0 PYTHON=/usr/bin/python3 criu \
          2>&1 | tee "$EVIDENCE_DIR/criu-build.log"
        phase=install
        sudo make -C "$source_dir" V=1 WERROR=0 PYTHON=/usr/bin/python3 \
          PREFIX=/usr/local "SBINDIR=$CRIU_SBINDIR" install-criu
        phase=binary_verification
        binary="$CRIU_SBINDIR/criu"
        [ -x "$binary" ]
        version_output="$(sudo "$binary" --version)"
        printf '%s\n' "$version_output" | tee "$EVIDENCE_DIR/criu-version.txt"
        [[ "$version_output" == *"Version: $CRIU_VERSION"* ]]
        sha256sum "$binary" | tee "$EVIDENCE_DIR/criu-binary.sha256"
        if ldd "$binary"; then :; else echo 'WARN: ldd unavailable; the version check above executed the binary'; fi
        phase=complete
        echo 'CRIU native binary is installed and its --version invocation succeeded.'
        echo 'This is NOT a claim that kernel or Docker checkpoint/restore works.'
        EMBED_INSTALL_CRIU_SH_1
    - name: Embed host_diagnostics.sh [1/1]
      shell: bash
      run: |
        set -Eeuo pipefail
        cat > "$BUNDLE_DIR/host_diagnostics.sh" <<'EMBED_HOST_DIAGNOSTICS_SH_1'
        #!/usr/bin/env bash
        set -uo pipefail
        export LC_ALL=C
        export PS4='+ [${EPOCHREALTIME}] [host:${LINENO}] '
        set -x
        probe() {
          printf '\n========== %s ==========\n' "$1"
          shift
          "$@"
          rc=$?
          printf '\nDIAGNOSTIC EXIT=%s\n' "$rc"
          return 0
        }
        probe UTC date -u --iso-8601=seconds
        probe OS uname -a
        probe DISTRIBUTION cat /etc/os-release
        probe ID id
        probe SUDO sudo -n true
        probe CPU lscpu
        probe MEMORY free -h
        probe MEMINFO cat /proc/meminfo
        probe DISK df -hT
        probe MEMORY_MAPPING sh -c 'ulimit -a; sysctl vm.overcommit_memory vm.overcommit_ratio vm.max_map_count kernel.randomize_va_space kernel.yama.ptrace_scope'
        probe CGROUPS sh -c 'cat /proc/self/cgroup; stat -fc %T /sys/fs/cgroup; for f in memory.max memory.current memory.peak memory.swap.max memory.events; do echo "$f"; cat "/sys/fs/cgroup/$f" 2>/dev/null || true; done'
        probe SECURITY sh -c 'grep -E "^(Cap|Seccomp|NoNewPrivs)" /proc/self/status'
        probe DOCKER_VERSION docker version
        probe DOCKER_INFO docker info
        probe DOCKER_CHECKPOINT_HELP docker checkpoint --help
        probe RUNC runc --version
        probe CONTAINERD containerd --version
        probe PREEXISTING_CRIU sh -c 'command -v criu; criu --version'
        printf '\nNo environment dump, model API key, exploit payload, Docker socket mount, or public service is used.\n'
        printf 'Disposable hosted runner only: the workflow restarts Docker and relaxes container seccomp/AppArmor for CRIU.\n'
        EMBED_HOST_DIAGNOSTICS_SH_1
    - name: Embed report_tools.py [1/1]
      shell: bash
      run: |
        set -Eeuo pipefail
        cat > "$BUNDLE_DIR/report_tools.py" <<'EMBED_REPORT_TOOLS_PY_1'
        """Summary, inventory, integrity and final fail-closed gate. Standard library only."""
        import datetime
        import hashlib
        import html
        import json
        import os
        from pathlib import Path
        import sys

        ROOT = Path(os.environ.get('EVIDENCE_DIR', 'evidence'))
        ROOT.mkdir(parents=True, exist_ok=True)


        def read(name):
            try:
                result = json.loads((ROOT / name).read_text())
                if not isinstance(result, dict): raise ValueError('Expected a JSON object')
                return result
            except (OSError, ValueError) as exc:
                return {'status': 'not_run', 'exception': str(exc)}


        def summary():
            records = {n: read(n) for n in ('self-tests.json', 'network-self-tests.json', 'setup.json', 'daemon-setup.json', 'report.json')}
            success = all(r.get('status') == 'passed' for r in records.values())
            lines = ['# V8 checkpoint + HTML5 trajectory audit', '',
                     '**Execution result: ' + ('PASS for this finite probe only' if success else 'NOT DEMONSTRATED') + '**', '',
                     '| Stage | Status | Phase / error |', '|---|---|---|']
            for name, r in records.items():
                detail = str(r.get('last_phase', r.get('failed_stage', r.get('stage', ''))))
                if r.get('exception'): detail += ' / ' + str(r['exception'])
                lines.append('| ' + name + ' | ' + str(r.get('status','unknown')) + ' | ' + detail.replace('|','/').replace('\n',' ') + ' |')
            experiment = records['report.json']
            lines += ['', '## Explicit limits',
                      'This uses the actual pinned V8 image and attempts live CRIU checkpoint/restore.',
                      'The probe uses verified output APIs and a timed pause window; it does not require the removed shell read() API.',
                      'Host time continues while the process is stopped. This does NOT claim deterministic clock replay.',
                      'An isolated loopback-only namespace keeper stays alive across checkpoints. That external namespace is retained, not rewound.',
                      'See documentation.md and documentation.json in the artifact for the official docs, source paths and workaround boundaries.',
                      'Exact equality is checked for 4,096 probe words, token, counter and hot-function result, not every byte of V8/JIT/OS state.',
                      'The model/agent, sockets, cross-host migration and alternative-agent branches are not tested.',
                      'HTML rewind navigates recorded observations only. No live execution service is embedded.',
                      'Checkpoint memory images and the runtime container are not retained in the downloadable artifact.',
                      '', '## Assertions', '| Check | Result |', '|---|---|']
            for a in experiment.get('assertions', []):
                lines.append('| ' + str(a['name']).replace('|','/') + ' | ' + ('PASS' if a.get('passed') is True else 'FAIL') + ' |')
            lines += ['', '## Capture / restore / fidelity', '| Round | Capture | Restore | Fidelity | Dump seconds | Restore seconds |', '|---|---|---|---|---|---|']
            for row in experiment.get('rounds',[]):
                lines.append(f"| {row.get('round')} | {row.get('capture_status','unknown')} | {row.get('restore_status','unknown')} | {row.get('fidelity_status','unknown')} | {row.get('dump_s','not reached')} | {row.get('restore_s','not reached')} |")
            text = '\n'.join(lines) + '\n'
            (ROOT/'summary.md').write_text(text)
            (ROOT/'overall.json').write_text(json.dumps({'passed': success, 'stages': records}, indent=2)+'\n')
            print(text, flush=True)
            dest = os.environ.get('GITHUB_STEP_SUMMARY')
            if dest:
                with open(dest,'a') as f: f.write(text)
            return 0


        def inventory():
            rows=[]
            for p in sorted(ROOT.rglob('*')):
                if p.is_symlink() or not p.is_file() or p.name=='artifact-manifest.json': continue
                # Hash by streaming: verbose logs need not fit in memory.
                h=hashlib.sha256()
                with p.open('rb') as f:
                    while chunk:=f.read(1024*1024): h.update(chunk)
                rows.append({'path':p.relative_to(ROOT).as_posix(),'bytes':p.stat().st_size,'sha256':h.hexdigest()})
            report={'created_utc':datetime.datetime.now(datetime.timezone.utc).isoformat(),
                    'files':rows,'file_count':len(rows),'bytes':sum(r['bytes'] for r in rows),
                    'manifest_excludes_itself':True,'raw_memory_images_uploaded':False}
            (ROOT/'artifact-manifest.json').write_text(json.dumps(report,indent=2)+'\n')
            for r in rows: print(f"ARTIFACT | {r['bytes']:>10} bytes | SHA256 {r['sha256']} | {r['path']}",flush=True)
            print(f"ARTIFACT TOTAL | files={len(rows)} | bytes={report['bytes']}",flush=True)
            return 0


        def gate():
            required=('asset-integrity.json','self-tests.json','network-self-tests.json','setup.json','daemon-setup.json','report.json','viewer-build.json')
            states={n:read(n) for n in required}
            for n,r in states.items():
                print(f"FINAL GATE {n} | status={r.get('status')} | phase={r.get('failed_stage',r.get('last_phase',''))} | error={r.get('exception','')}",flush=True)
            ok=all(r.get('status')=='passed' for r in states.values())
            print('PASS: finite live-V8 continuity test and HTML generation passed.' if ok else
                  'NOT DEMONSTRATED. HTML may still be usable; report generation is not checkpoint success.',flush=True)
            return 0 if ok else 1


        if __name__=='__main__':
            functions={'summary':summary,'inventory':inventory,'gate':gate}
            if len(sys.argv)!=2 or sys.argv[1] not in functions: raise SystemExit('Use summary, inventory, or gate')
            raise SystemExit(functions[sys.argv[1]]())
        EMBED_REPORT_TOOLS_PY_1

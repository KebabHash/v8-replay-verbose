            check('Changed old-log prefix is rejected',not m.continuity_checks(paused,baseline,'different\n'+after,'ticket-1',True)['old_log_prefix_preserved'])
            check('Dead process is rejected',not m.continuity_checks(paused,baseline,after,'ticket-1',False)['process_alive_after_restore'])
            check('Wrong resume ticket is rejected',not all(m.continuity_checks(paused,baseline,after,'wrong',True).values()))
            check('No progress after resume is rejected',not m.continuity_checks(paused,baseline,baseline+marker(resumed),'ticket-1',True)['execution_advances_after_resume'])
            original={'log-driver':'json-file','features':{'x':True}}

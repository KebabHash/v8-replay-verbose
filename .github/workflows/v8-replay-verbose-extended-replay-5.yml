# SINGLE SELF-CONTAINED FILE. Replace .github/workflows/v8-replay-verbose.yml.
# Revision network-fix-3: source-supported workaround for Moby #50750.
# The dedicated namespace keeper uses --network none. The target shares ONLY
# that keeper's namespace, not the host. Its external namespace is retained,
# NOT checkpointed, rewound or portable. No normal-start fallback after failure.
# All project source, tests, HTML and 19 annotated documentation references are
# embedded here. APT, pinned CRIU source, image pull and artifact upload need Internet.
# Scope: disposable GitHub-hosted Linux runner; this restarts Docker.
# Raw memory images are excluded from artifacts. Offline HTML controls inspect evidence.
# Local tests are NOT evidence of successful real Docker/CRIU restoration.
name: V8 Checkpoint Atlas - extended-replay-5 - ultra verbose
'on':
  workflow_dispatch:
    inputs:
      restore_rounds:
        description: Sequential real checkpoint/restore rounds (1-5)
        type: string
        default: '2'
      warmup_seconds:
        description: Work before each checkpoint boundary (1-30 seconds)
        type: string
        default: '3'
      timed_gate_seconds:
        description: Pause window for capture (15-180 seconds). Host waits out the gate while target is stopped.
        type: string
        default: '45'
permissions:
  contents: read
jobs:
  feasibility:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      BUNDLE_DIR: ${{ github.workspace }}/.v8-checkpoint-atlas
      EVIDENCE_DIR: ${{ github.workspace }}/evidence
      IMAGE: cybergym/v8@sha256:d53b336a90e184fe61c2067342eb278f6d54d009d7b4d93b958029b86904e48a
      CRIU_VERSION: '4.3'
      CRIU_COMMIT: 2b7ac603cda31d015d91c856c34c557cb2300e7d
      RESTORE_ROUNDS: ${{ inputs.restore_rounds || '2' }}
      WARMUP: ${{ inputs.warmup_seconds || '3' }}
      TIMED_GATE_SECONDS: ${{ inputs.timed_gate_seconds || '45' }}
      FORK_TRIALS: '12'
      HEARTBEAT_SECONDS: '5'
      PYTHONUNBUFFERED: '1'
      DOCKER_CLI_EXPERIMENTAL: enabled
    steps:
    - name: Initialize the single-file package and evidence directory
      id: initialize
      shell: bash
      run: |
        set -Eeuo pipefail
        printf 'Workflow revision: network-fix-3\n'
        mkdir -p "$BUNDLE_DIR" "$EVIDENCE_DIR" "$EVIDENCE_DIR/sources"
        printf '
        === V8 CHECKPOINT ATLAS: SINGLE YAML, FULL CONSOLE OUTPUT ===
        '
        printf 'All project code and HTML are embedded in this workflow. No checkout, pip, npm, CDN or model key is required.
        '
        printf 'Network is still required for APT build dependencies, pinned CRIU source, the V8 image and artifact upload.
        '
        printf 'Rewind in HTML inspects evidence; it does not control a live process.
        '
        printf 'Run: %s  attempt: %s  revision: %s
        ' "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$GITHUB_SHA"
        printf 'Evidence: %s
        Sources: %s
        ' "$EVIDENCE_DIR" "$BUNDLE_DIR"
    - name: Embed netns_guard.py [1/1]
      shell: bash
      run: |
        set -Eeuo pipefail
        cat > "$BUNDLE_DIR/netns_guard.py" <<'EMBED_NETNS_GUARD_PY_1'
        """Same-host external network-namespace fixture for Moby #50750.

        The keeper is NOT checkpointed. The target joins its pre-existing, loopback-only
        network namespace. Nothing here restores external namespace state. No host
        networking, synthetic PID, blind retry, or ordinary-start fallback is allowed.
        """
        import json
        import re

        ISSUE = 'https://github.com/moby/moby/issues/50750'


        def positive_pid(value):
            if type(value) is not int or value <= 1:
                raise ValueError('A live container PID greater than 1 is required; refusing /proc/0 or host init')
            return value


        def namespace_inode(text):
            match = re.fullmatch(r'net:\[([1-9][0-9]*)\]', text.strip())
            if not match:
                raise ValueError('Invalid network namespace identity: ' + repr(text))
            return int(match.group(1))


        def isolation_checks(links, routes4, routes6, keeper_ns, host_ns, target_ns=None):
            def valid_routes(rows):
                return isinstance(rows, list) and all(isinstance(r, dict) and
                    r.get('dev') == 'lo' and r.get('dst') != 'default' and not r.get('gateway') and
                    not r.get('multipath') and not r.get('nexthops') for r in rows)
            names = [x.get('ifname') for x in links if isinstance(x, dict)] if isinstance(links, list) else []
            return {
                'keeper_namespace_valid': type(keeper_ns) is int and keeper_ns > 0,
                'host_namespace_valid': type(host_ns) is int and host_ns > 0,
                'not_host_network_namespace': keeper_ns != host_ns,
                'only_loopback_interface': names == ['lo'] and len(links) == 1,
                'ipv4_routes_loopback_only': valid_routes(routes4),
                'ipv6_routes_loopback_only': valid_routes(routes6),
                **({'target_joins_keeper_namespace': target_ns == keeper_ns} if target_ns is not None else {}),
            }


        def classify_restore_error(text):
            if 'bind-mount /proc/0/ns/net' in text:
                return {'code': 'docker_network_namespace_pid_zero', 'reference': ISSUE,
                        'explanation': 'Known Docker restore namespace lifecycle signature; not a heap-fidelity result.',
                        'action': 'Inspect network-*.json, namespace keeper liveness, daemon journal and CRIU restore logs. No host-network fallback.'}
            return {'code': 'runtime_restore_failed',
                    'explanation': 'Restore did not complete. The exact command error remains authoritative.',
                    'action': 'Inspect checkpoint-restore stderr, runtime journal, and CRIU dump/restore logs.'}


        class NetworkNamespaceGuard:
            """Keep a distinct namespace alive and validate its identity at every boundary."""
            def __init__(self, audit, image, suffix):
                if not re.fullmatch(r'[a-f0-9]{12}', suffix):
                    raise ValueError('Keeper suffix must be twelve hexadecimal characters')
                self.audit = audit
                self.image = image
                self.name = 'v8-netns-' + suffix
                self.cid = None
                self.pid = None
                self.inode = None
                self.started_at = None
                self.cleanup_needed = False
                self.history = []

            def _inspect(self, container):
                _, out, _ = self.audit.run('netns-inspect',
                    ['docker', 'inspect', '--format', '{{json .}}', container], required=True)
                obj = json.loads(out)
                if not isinstance(obj, dict):
                    raise ValueError('Expected Docker inspect object')
                return obj

            def _inode(self, pid, label):
                # Host identity has a separate explicit read below; never pass PID 1 here.
                positive_pid(pid)
                _, out, _ = self.audit.run(label, ['sudo', '-n', 'readlink', f'/proc/{pid}/ns/net'], required=True)
                return namespace_inode(out)

            def _network_json(self, pid, arguments, label):
                positive_pid(pid)
                _, out, _ = self.audit.run(label,
                    ['sudo', '-n', 'nsenter', '--target', str(pid), '--net', '--', 'ip', '-j', *arguments], required=True)
                data = json.loads(out)
                if not isinstance(data, list):
                    raise ValueError('Expected iproute2 JSON array')
                return data

            def start(self):
                a = self.audit
                a.event('network_strategy', strategy='persistent-isolated-keeper', reference=ISSUE,
                    external_state='Loopback-only namespace retained, not rewound', host_network=False,
                    target_image_modified=False, engine_downgraded=False)
                command = ['docker', 'create', '--name', self.name, '--network', 'none',
                    '--label', 'v8.atlas.role=netns-keeper', '--label', 'v8.atlas.revision=network-fix-3',
                    '--read-only', '--cap-drop', 'ALL', '--security-opt', 'no-new-privileges',
                    '--memory', '64m', '--memory-swap', '64m', '--cpus', '0.1', '--pids-limit', '16',
                    '--restart', 'no', '--entrypoint', '/bin/sh', self.image, '-c', 'exec sleep 2147483647']
                # Mark for cleanup before create, so partial runtime failures are not ignored.
                self.cleanup_needed = True
                _, out, _ = a.run('netns-keeper-create', command, required=True)
                self.cid = out.strip()
                a.require('namespace keeper has a full Docker ID', bool(re.fullmatch(r'[a-f0-9]{64}', self.cid)), self.cid)
                a.run('netns-keeper-start', ['docker', 'start', self.cid], required=True)
                initial = self.verify('keeper-created')
                self.pid = initial['keeper_pid']
                self.inode = initial['keeper_inode']
                self.started_at = initial['keeper_started_at']
                a.report['external_dependencies'] = self.description()
                return 'container:' + self.cid

            def description(self):
                return {'strategy': 'persistent-isolated-keeper', 'keeper_name': self.name,
                        'keeper_id': self.cid, 'keeper_pid': self.pid, 'keeper_network_inode': self.inode,
                        'checkpointed': False, 'restoration_scope': 'Same-host target process; retained loopback namespace fixture',
                        'host_network': False, 'namespace_state_rewound': False,
                        'checks_recorded': len(self.history), 'reference': ISSUE}

            def verify(self, boundary, target=None):
                if not re.fullmatch(r'[a-zA-Z0-9_-]+', boundary):
                    raise ValueError('Unsafe diagnostic filename')
                a = self.audit
                keeper = self._inspect(self.cid or self.name)
                state = keeper.get('State', {})
                a.require(boundary + ': keeper still running', state.get('Running') is True, state)
                pid = positive_pid(state.get('Pid'))
                a.require(boundary + ': keeper remains isolated',
                          keeper.get('HostConfig', {}).get('NetworkMode') == 'none')
                a.require(boundary + ': keeper identity unchanged', keeper.get('Id') == self.cid)
                a.require(boundary + ': keeper never restarted', keeper.get('RestartCount') == 0)
                if self.pid is not None:
                    a.require(boundary + ': keeper PID and start time unchanged',
                        pid == self.pid and state.get('StartedAt') == self.started_at,
                        {'old_pid': self.pid, 'pid': pid, 'started_at': state.get('StartedAt')})
                inode = self._inode(pid, 'netns-keeper-inode')
                if self.inode is not None:
                    a.require(boundary + ': keeper namespace retained', inode == self.inode,
                        {'captured_inode': self.inode, 'current_inode': inode})
                _, out, _ = a.run('netns-host-inode', ['sudo', '-n', 'readlink', '/proc/1/ns/net'], required=True)
                host_inode = namespace_inode(out)
                links = self._network_json(pid, ['link', 'show'], 'netns-links')
                routes4 = self._network_json(pid, ['-4', 'route', 'show', 'table', 'all'], 'netns-ipv4-routes')
                routes6 = self._network_json(pid, ['-6', 'route', 'show', 'table', 'all'], 'netns-ipv6-routes')
                target_pid, target_inode = None, None
                if target is not None:
                    inspected = self._inspect(target)
                    a.require(boundary + ': target running for namespace verification',
                        inspected.get('State', {}).get('Running') is True, inspected.get('State'))
                    a.require(boundary + ': target uses explicit keeper namespace',
                        inspected.get('HostConfig', {}).get('NetworkMode') == 'container:' + self.cid,
                        inspected.get('HostConfig', {}).get('NetworkMode'))
                    target_pid = positive_pid(inspected['State'].get('Pid'))
                    target_inode = self._inode(target_pid, 'netns-target-inode')
                checks = isolation_checks(links, routes4, routes6, inode, host_inode, target_inode)
                item = {'boundary': boundary, 'keeper_pid': pid, 'keeper_inode': inode,
                    'keeper_started_at': state.get('StartedAt'), 'host_inode': host_inode,
                    'target_pid': target_pid, 'target_inode': target_inode, 'links': links,
                    'ipv4_routes': routes4, 'ipv6_routes': routes6, 'checks': checks,
                    'external_namespace_retained_not_rewound': True}
                self.history.append(item)
                (a.root / ('network-' + boundary + '.json')).write_text(json.dumps(item, indent=2) + '\n')
                a.event('network_namespace_evidence', **item)
                for key, passed in checks.items():
                    a.require(boundary + ': ' + key, passed)
                return item

            def close(self, target=None):
                if not self.cleanup_needed:
                    return
                a = self.audit
                if target:
                    rc, out, err = a.run('netns-cleanup-target-check',
                        ['docker', 'inspect', '--format', '{{json .State}}', target])
                    if rc == 0:
                        # Remove the target BEFORE releasing its external namespace.
                        rc, _, _ = a.run('netns-cleanup-target', ['docker', 'rm', '-f', target])
                        if rc != 0:
                            raise RuntimeError('Target cleanup failed; retaining its namespace keeper until disposable runner teardown')
                    elif 'no such object' not in err.lower() and 'no such container' not in err.lower():
                        raise RuntimeError('Cannot establish target absence; retaining namespace keeper until runner teardown')
                rc, _, err = a.run('netns-keeper-cleanup', ['docker', 'rm', '-f', self.cid or self.name])
                if rc != 0 and 'no such container' not in err.lower():
                    raise RuntimeError('Namespace keeper cleanup failed; see command logs')
                self.cleanup_needed = False
        EMBED_NETNS_GUARD_PY_1
    - name: Embed checkpoint_probe.py [1/3]
      shell: bash
      run: |
        set -Eeuo pipefail
        cat > "$BUNDLE_DIR/checkpoint_probe.py" <<'EMBED_CHECKPOINT_PROBE_PY_1'
        import datetime
        import hashlib
        import json
        import os
        from pathlib import Path
        import re
        import shlex
        import signal
        import subprocess
        import sys
        import threading
        import time
        import traceback
        import uuid
        from netns_guard import NetworkNamespaceGuard, classify_restore_error

        # No removed shell file APIs are required. The native binary is not patched.
        # Timed rendezvous: the tracked probe words stay unchanged during a wall-clock gate.
        # The controller checkpoints before the gate expires, waits while STOPPED, then restores.
        # Date/time is deliberately external and advancing; this is not clock replay.
        PROBE_JS = r'''"use strict";
        const CONFIG = __PROBE_CONFIG__;
        const writeLine = (typeof globalThis.print === "function")
          ? (s) => globalThis.print(s)
          : (typeof globalThis.console === "object" && typeof globalThis.console.log === "function")
            ? (s) => globalThis.console.log(s)
            : null;
        if (!writeLine) throw new Error("No supported output API: neither print nor console.log is available");
        const token = Array.from({length: 6}, () =>
          Math.floor(Math.random() * 4294967296).toString(16).padStart(8, "0")
        ).join("") + "-" + Date.now().toString(16);
        const heap = new Uint32Array(4096);
        let seed = 2166136261 >>> 0;
        for (const c of token) seed = Math.imul(seed ^ c.charCodeAt(0), 16777619) >>> 0;
        for (let i = 0; i < heap.length; i++) {
          seed = (Math.imul(seed, 1664525) + 1013904223) >>> 0;
          heap[i] = seed;
        }
        let tick = 0, hotResult = 0;
        function hot(x) { return (Math.imul(x ^ 0x12345678, 17) + 3) | 0; }
        function digest() {
          let h = 2166136261 >>> 0;
          for (let i = 0; i < heap.length; i++) h = Math.imul(h ^ heap[i], 16777619) >>> 0;
          return h.toString(16).padStart(8, "0");
        }
        function emit(event, ticket = "", extra = {}) {
          const state = {event, ticket, token, tick, digest: digest(), hot: hotResult, words: heap.length, ...extra};
          if (event === "paused" || event === "resumed") state.heap_words = Array.from(heap);
          writeLine("V8_PROBE " + JSON.stringify(state));
        }
        function delay(ms) { const end = Date.now() + ms; while (Date.now() < end) {} }
        function advance() {
          for (let j = 0; j < 20000; j++) {
            const i = (j + tick) & (heap.length - 1);
            hotResult = hot((heap[i] + j) | 0);
            heap[i] = (heap[i] ^ hotResult) >>> 0;
          }
          tick++;
          emit("tick");
        }
        emit("boot", "", {protocol: "timed-gate-v1", config: CONFIG});
        for (let round = 1; round <= CONFIG.rounds; round++) {
          const warmUntil = Date.now() + CONFIG.warmup_ms;
          do { advance(); delay(CONFIG.tick_ms); } while (Date.now() < warmUntil);
          const ticket = token + ":round-" + round;
          const deadline_ms = Date.now() + CONFIG.gate_ms;
          emit("paused", ticket, {round, deadline_ms, protocol: "timed-gate-v1"});
          // The tested array, token, counter, and hotResult are not written in this loop.
          while (Date.now() < deadline_ms) delay(20);
          // Recompute the observations from live state after restoration, not cached output.
          emit("resumed", ticket, {round, deadline_ms, protocol: "timed-gate-v1"});
          advance();
        }
        // Keep PID 1 alive so the controller can independently inspect the restored process.
        while (true) { advance(); delay(CONFIG.tick_ms); }
        '''

        CAPABILITY_JS = r'''(() => {
          const c = {print: typeof globalThis.print, read: typeof globalThis.read,
            console_log: (typeof globalThis.console === "object" ? typeof globalThis.console.log : "undefined"),
            uint32array: typeof Uint32Array, date_now: typeof Date.now};
          const s = ["V8", "API", "CAPABILITIES"].join("_") + ":" + JSON.stringify(c);
          if (c.print === "function") globalThis.print(s);
          else if (c.console_log === "function") globalThis.console.log(s);
          else throw new Error(s);
        })();'''


        def probe_source(rounds, warmup, gate, tick_ms=200):
            config = dict(rounds=rounds, warmup_ms=round(warmup * 1000),
                          gate_ms=round(gate * 1000), tick_ms=tick_ms)
            return PROBE_JS.replace('__PROBE_CONFIG__', json.dumps(config, sort_keys=True))


        def parse_capabilities(text):
            for line in text.splitlines():
                pos = line.find('V8_API_CAPABILITIES:')
                if pos >= 0:
                    try:
                        value, _ = json.JSONDecoder().raw_decode(line[pos + len('V8_API_CAPABILITIES:'):])
                        if isinstance(value, dict):
                            return value
                    except (ValueError, TypeError):
                        pass
            return {}


        def marker_events(text):
            events = []
            for line in text.splitlines():
                if line.startswith("V8_PROBE "):
                    try:
                        event = json.loads(line[len("V8_PROBE "):])
                    except json.JSONDecodeError:
                        continue
                    if isinstance(event, dict):
                        events.append(event)
            return events


        def continuity_checks(paused, baseline, after, ticket, running):
            """Strict evidence checks; synthetic tests must not count as CRIU success."""
            prefix_ok = after.startswith(baseline)
            delta = after[len(baseline):] if prefix_ok else ""
            events = marker_events(delta)
            resumed = [e for e in events if e.get("event") == "resumed" and e.get("ticket") == ticket]
            r = resumed[0] if len(resumed) == 1 else {}
            valid_pause = (paused.get("event") == "paused" and paused.get("ticket") == ticket
                           and isinstance(paused.get("token"), str) and len(paused["token"]) >= 32
                           and type(paused.get("tick")) is int and paused["tick"] > 0
                           and isinstance(paused.get("digest"), str)
                           and bool(re.fullmatch(r"[0-9a-f]{8}", paused["digest"]))
                           and type(paused.get("hot")) is int and paused.get("words") == 4096
                           and isinstance(paused.get("heap_words"), list) and len(paused["heap_words"]) == 4096
                           and all(type(x) is int and 0 <= x <= 0xffffffff for x in paused["heap_words"]))
            same = lambda key: bool(valid_pause and r and r.get(key) == paused.get(key))
            continued = any(e.get("event") == "tick" and e.get("token") == paused.get("token")
                            and type(e.get("tick")) is int and e["tick"] > paused.get("tick", 10**30)
                            for e in events)
            return {
                "valid_pre_checkpoint_pause": bool(valid_pause),
                "old_log_prefix_preserved": prefix_ok,
                "new_output_after_checkpoint": bool(events),
                "no_cold_boot_in_new_output": bool(events) and not any(e.get("event") == "boot" for e in events),
                "exactly_one_matching_resume": len(resumed) == 1,
                "same_in_memory_startup_token": same("token"),
                "exact_counter_at_resume": same("tick"),
                "exact_heap_digest_at_resume": same("digest"),
                "exact_hot_function_result_at_resume": same("hot"),
                "same_heap_length": same("words"),
                "all_4096_probe_words_exact": same("heap_words"),
                "execution_advances_after_resume": continued,
                "process_alive_after_restore": running is True,
            }


        class Audit:
            def __init__(self, root):
                self.root = Path(root).resolve()
                self.root.mkdir(parents=True, exist_ok=True)
                self.index = sum(1 for line in (self.root / "events.jsonl").read_text().splitlines()
                                     if '"kind": "command_start"' in line) if (self.root / "events.jsonl").exists() else 0
                self.monotonic_start = time.monotonic()
                self.print_lock = threading.Lock()
                self.event_lock = threading.Lock()
                self.heartbeat_s = max(0.05, float(os.environ.get("HEARTBEAT_SECONDS", "5")))
                self.stage = "setup"
                self.report = {"status": "not_demonstrated", "scope": "same-host live d8 process, timed rendezvous, finite probe", "protocol": "timed-gate-v1",
                               "started_utc": self.now(), "assertions": [], "rounds": [],
                               "limitations": ["Not a full VM or agent checkpoint.",
                                   "Finite probe checks do not prove equality of the entire V8 heap or JIT internals.",
                                   "Network is disabled; no socket or model-provider state is tested.",
                                   "This probe uses a wall-clock rendezvous, not shell read() or restored clock state.",
                                    "The binary is unmodified; it must expose print or console.log.",
                                   "Raw CRIU memory images are not uploaded; this is an in-job feasibility test."]}

            @staticmethod
            def now():
                return datetime.datetime.now(datetime.timezone.utc).isoformat()

            def say(self, message):
                with self.print_lock:
                    print(f"[{self.now()}] [{self.stage}] {message}", flush=True)

            def event(self, kind, **fields):
                event = {"utc": self.now(), "kind": kind, "stage": self.stage, **fields}
                with self.event_lock:
                    with (self.root / "events.jsonl").open("a") as f:
                        f.write(json.dumps(event, sort_keys=True) + "\n")
                self.say("EVENT " + json.dumps(event, sort_keys=True))

            def run(self, label, argv, timeout=90, required=False):
                self.index += 1
                tag = f"{self.index:04d}-{label}"
                self.event("command_start", label=tag, argv=argv, timeout_s=timeout)
                self.say("=" * 110)
                self.say(f"COMMAND {tag} | timeout={timeout}s | cwd={os.getcwd()}")
                self.say("ARGV " + shlex.join(argv))
                started = time.monotonic()
                buffers = {"stdout": [], "stderr": []}
                counts = {"stdout": 0, "stderr": 0}
                timed_out = False
                last_output = [started]
                finished = threading.Event()
                threads = []
                proc = None
                stream_errors = []
                def consume(stream, key):
                    try:
                        with (self.root / (tag + "." + key + ".txt")).open("w", encoding="utf-8") as log:
                            for line in stream:
                                buffers[key].append(line)
                                log.write(line)
                                log.flush()
                                counts[key] += len(line.encode())
                                last_output[0] = time.monotonic()
                                self.say(f"{tag} {key.upper()} | " + line.rstrip("\n"))
                    except Exception as exc:
                        stream_errors.append(str(exc))
                        self.say(f"LOGGER ERROR {tag} {key}: {exc!r}")
                def heartbeat():
                    while not finished.wait(self.heartbeat_s):
                        elapsed = time.monotonic() - started
                        silence = time.monotonic() - last_output[0]
                        self.say(f"HEARTBEAT {tag} | elapsed={elapsed:.2f}s | silence={silence:.2f}s "
                                 f"| stdout_bytes={counts['stdout']} | stderr_bytes={counts['stderr']} "
                                 f"| timeout_in={max(0, timeout-elapsed):.2f}s")
                hb = threading.Thread(target=heartbeat, daemon=True)
                hb.start()
                try:
                    proc = subprocess.Popen(argv, stdout=subprocess.PIPE, stderr=subprocess.PIPE,
                                            text=True, encoding="utf-8", errors="replace", start_new_session=True)
                    threads = [threading.Thread(target=consume, args=(getattr(proc, key), key), daemon=True)
                               for key in ("stdout", "stderr")]
                    for thread in threads:
                        thread.start()
                    try:
                        rc = proc.wait(timeout=timeout)
                    except subprocess.TimeoutExpired:
                        timed_out = True
                        try:
                            os.killpg(proc.pid, signal.SIGKILL)
                        except ProcessLookupError:
                            pass
                        proc.wait()
                        rc = 124
                    for thread in threads:
                        thread.join(timeout=10)
                    if any(t.is_alive() for t in threads):
                        # A child inherited the log pipe. Terminate the group instead of hanging the report.
                        try:
                            os.killpg(proc.pid, signal.SIGKILL)
                        except ProcessLookupError:

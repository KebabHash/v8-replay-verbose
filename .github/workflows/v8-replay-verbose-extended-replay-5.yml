        }
        function load(data){stop();app.data=validateData(data);app.trace=app.data.traces[0]?.id||null;app.index=0;app.compareA=null;app.compareB=null;app.zoom=1;
          const cp=currentTrace()?.nodes.findIndex(checkpointOK);if(cp>=0)app.index=cp;
          renderAll();
        }
        function renderAll(){

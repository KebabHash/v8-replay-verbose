        # V8 checkpoint network restore: documentation and rationale

        Revision: **network-fix-3**. Reviewed: **2026-10-26**.

        Relevant official documentation, upstream issues and versioned implementation; not an exhaustive archive of all related literature.

        ## What the previous run establishes

        The supplied log records a successful live checkpoint followed by a failed Docker restore:
        ```text
        bind-mount /proc/0/ns/net -> /var/run/docker/netns/...: no such file or directory
        ```

        ## Source-supported workflow correction

        Start an inert, dedicated container with `--network none`. Create the V8 target with `--network container:<keeper-full-ID>` from its first launch. Retain the keeper during capture, the stopped interval and restoration. Verify its PID, start time, namespace inode, loopback-only interfaces and IPv4/IPv6 routing. Verify the restored target joins exactly that namespace. Remove the target before removing the keeper.

        Docker 28.0.4 only runs the failing SetKey branch for an empty OCI network namespace path. Container-sharing supplies a nonempty path. runc already has external namespace capture/restore handling. These sources support the workaround; they do not prove this workflow succeeds on an untested runner.

        ## Explicit boundaries

        - Single-host live d8 process, not a VM snapshot.
        - Namespace keeper remains running and is not checkpointed or rewound.
        - No socket traffic, agent provider state, cross-host migration or deterministic clock replay is tested.
        - Post-restore checks compare finite observations, not every byte of V8/JIT/kernel state.
        - Static HTML rewind is inspection, not an active restoration service.
        - Ordinary startup after failed restore is forbidden; host networking and runtime downgrades are not automatic fallbacks.

        ## Documentation map

        ### 1. Moby restore regression #50750
        https://github.com/moby/moby/issues/50750

        Type: upstream_issue.
        **Source supports:** Exact /proc/0/ns/net error reported with Docker 28+. The issue is not evidence that every runtime combination is fixed.

        **Application:** Motivates bypassing the new-namespace initialization path, rather than changing the working V8 probe or CRIU build.

        ### 2. containerd issue #12141
        https://github.com/containerd/containerd/issues/12141

        Type: upstream_issue.
        **Source supports:** Related checkpoint/restore failure discussed in containerd; points back to Docker/Moby namespace handling.

        **Application:** Cross-reference only. Closing an issue is not proof of a shipped fix.

        ### 3. Moby v28.0.4 task initialization
        https://raw.githubusercontent.com/moby/moby/v28.0.4/daemon/start_linux.go

        Type: versioned_source.
        **Source supports:** initializeCreatedTask uses /proc/<task PID>/ns/net when the OCI network namespace has an empty path.

        **Application:** An explicit pre-existing namespace path bypasses this particular SetKey branch. This is the central source-level rationale.

        ### 4. Moby v28.0.4 OCI namespace construction
        https://raw.githubusercontent.com/moby/moby/v28.0.4/daemon/oci_linux.go

        Type: versioned_source.
        **Source supports:** The container network mode populates the OCI namespace path from the referenced container PID.

        **Application:** Create the target with --network container:<keeper ID> BEFORE its first start and checkpoint, not only during restore.

        ### 5. Moby v28.0.4 network lifecycle
        https://raw.githubusercontent.com/moby/moby/v28.0.4/daemon/container_operations.go

        Type: versioned_source.
        **Source supports:** Container-network mode shares an existing network stack instead of allocating an independent Docker network sandbox.

        **Application:** Keep the namespace owner running and remove it only after the target is removed.

        ### 6. runc v1.5.2 CRIU external namespaces
        https://raw.githubusercontent.com/opencontainers/runc/v1.5.2/libcontainer/criu_linux.go

        Type: versioned_source.
        **Source supports:** External network namespaces are marked on dump and supplied through an inherited descriptor on restore. Network namespace support requires CRIU 3.11 or newer.

        **Application:** The keeper is an external fixture. Its network state is NOT dumped, rewound, or portably migrated by this test.

        ### 7. Docker checkpoint reference
        https://docs.docker.com/reference/cli/docker/checkpoint/

        Type: official_documentation.
        **Source supports:** Checkpoint/restore is experimental, uses CRIU, and is primarily focused on single-host use. No external TTY is used here.

        **Application:** Retain actual checkpoint commands and strict continuity checks; never substitute a cold start for a failed restore.

        ### 8. Docker checkpoint create
        https://docs.docker.com/reference/cli/docker/checkpoint/create/

        Type: official_documentation.
        **Source supports:** Creates a checkpoint from a running container. Leave-running is an optional behavior.

        **Application:** This workflow uses the default stopped-target behavior and verifies Running=false plus stable logs.

        ### 9. Docker container start
        https://docs.docker.com/reference/cli/docker/container/start/

        Type: official_documentation.
        **Source supports:** The --checkpoint option starts a container from a checkpoint.

        **Application:** Only the first target launch is ordinary start. Every tested continuation uses --checkpoint.

        ### 10. Docker network sharing
        https://docs.docker.com/engine/network/

        Type: official_documentation.
        **Source supports:** The supported container:<name|id> mode shares another container networking stack; certain DNS/hostname/port flags are incompatible.

        **Application:** The target shares only the dedicated keeper namespace. No host networking or port publishing is used.

        ### 11. Docker none driver
        https://docs.docker.com/engine/network/drivers/none/

        Type: official_documentation.
        **Source supports:** The none driver leaves a private stack with only loopback, rather than eliminating network namespaces altogether.

        **Application:** The keeper uses none. Namespace identity, loopback-only links and both route tables are checked at runtime.

        ### 12. Docker host driver
        https://docs.docker.com/engine/network/drivers/host/

        Type: official_documentation.
        **Source supports:** Host networking shares the host network stack rather than isolating the container network.

        **Application:** Not used as a workaround: it would change the security boundary of this vulnerable target.

        ### 13. CRIU external resources
        https://criu.org/External_resources

        Type: official_documentation.
        **Source supports:** Some resources cannot be checkpointed/restored without help from the caller, because some state lies outside the dumped container.

        **Application:** Declare the namespace keeper as a retained external dependency in report.json and the HTML evidence.

        ### 14. CRIU Docker integration
        https://criu.org/Docker

        Type: official_documentation.
        **Source supports:** Describes native Docker integration and recommends considering Podman as an alternative.

        **Application:** This patch retains Docker to isolate the observed change; a future Podman comparison is a separate experiment.

        ### 15. CRIU external Docker historical prototype
        https://criu.org/index.php?mobileaction=toggle_view_mobile&title=Docker_External

        Type: historical_warning.
        **Source supports:** The old external Docker C/R approach is marked as a proof of concept, not the recommended native integration.

        **Application:** Do not run raw criu restore behind Docker and pretend Docker tracks the revived process correctly.

        ### 16. Docker daemon configuration
        https://docs.docker.com/reference/cli/dockerd/

        Type: official_documentation.
        **Source supports:** Documents daemon configuration, experimental mode and configuration validation.

        **Application:** Keep the existing merged/validated daemon config. Restarting Docker is restricted to the disposable hosted runner.

        ### 17. GitHub expression contexts
        https://docs.github.com/en/actions/reference/workflows-and-actions/contexts

        Type: official_documentation.
        **Source supports:** Available expression contexts depend on the workflow key being evaluated.

        **Application:** Keep github.workspace in job-level env; do not reintroduce runner.temp there.

        ### 18. GitHub workflow syntax
        https://docs.github.com/en/actions/reference/workflows-and-actions/workflow-syntax

        Type: official_documentation.
        **Source supports:** Workflow syntax specifies job/step behavior, conditions, shells, and a 21,000-character run-block maximum.

        **Application:** Split embedded source into multiple small run blocks within the SAME YAML. Evidence and HTML steps use always().

        ### 19. GitHub artifacts
        https://docs.github.com/en/actions/how-tos/writing-workflows/choosing-what-your-workflow-does/storing-and-sharing-data-from-a-workflow

        Type: official_documentation.
        **Source supports:** Artifacts retain generated reports and output files from workflow runs.

        **Application:** Upload the HTML and diagnostic evidence after both success and failure. Raw memory images remain excluded.

        ## Validation interpretation

        Local syntax, regression and mocked-Docker tests verify controller logic. They are not evidence that CRIU restored a real V8 process. Only the job can establish that by successfully restoring the live target and passing the subsequent continuity and namespace checks.
        EMBED_DOCUMENTATION_MD_1

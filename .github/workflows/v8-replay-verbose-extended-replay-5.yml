                with self.assertRaises(RuntimeError):self.g.verify('before-restore')

            def test_16_reject_target_host_mode(self):
                self.g.start();self.a.target_mode='host'
                with self.assertRaises(RuntimeError):self.g.verify('after-restore',TARGET)

            def test_17_reject_target_wrong_namespace(self):
                self.g.start();self.a.target_inode=401
                with self.assertRaises(RuntimeError):self.g.verify('after-restore',TARGET)

            def test_18_stopped_target_does_not_need_pid(self):
                self.g.start();result=self.g.verify('stopped')
                self.assertIsNone(result['target_pid'])
                self.assertTrue(all(result['checks'].values()))

            def test_19_cleanup_target_before_keeper(self):
                self.g.start();self.g.close(TARGET)
                labels=[x[0] for x in self.a.commands]
                self.assertLess(labels.index('netns-cleanup-target'),labels.index('netns-keeper-cleanup'))
                self.assertTrue(self.a.keeper_removed)
                self.g.close(TARGET)
                self.assertEqual(labels,[x[0] for x in self.a.commands])

            def test_20_cleanup_refuses_to_abandon_live_target(self):

    - name: Upload downloadable full log as separate Actions artifact
      if: ${{ always() }}
      uses: actions/upload-artifact@v4
      with:
        name: v8-full-log-${{ github.run_id }}-${{ github.run_attempt }}
        path: pages-site/full-run.log
        retention-days: 30
        if-no-files-found: error
    - name: Upload GitHub Pages site artifact
      if: ${{ always() }}
      uses: actions/upload-pages-artifact@v3
      with:
        path: pages-site
    - name: Upload HTML, all logs, reports and generated sources even on failure
      if: ${{ always() }}
      uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
      with:
        name: v8-checkpoint-atlas-${{ github.run_id }}-${{ github.run_attempt }}
        path: ${{ env.EVIDENCE_DIR }}/
        if-no-files-found: error
        retention-days: 14
        compression-level: 6
    - name: Fail closed unless real continuity and report generation both passed
      if: ${{ always() }}
      shell: bash
      run: |
        set -Eeuo pipefail
        python3 -u "$BUNDLE_DIR/report_tools.py" gate
        python3 - <<'PY_FIDELITY_GATE'
        import json, os, pathlib, sys
        path=pathlib.Path(os.environ['EVIDENCE_DIR'])/'fidelity-matrix.json'
        obj=json.loads(path.read_text()) if path.exists() else {'status':'missing'}
        print('FINAL FIDELITY GATE |',obj['status'],flush=True)
        other=pathlib.Path(os.environ['EVIDENCE_DIR'])/'intervention-suite.json'
        inter=json.loads(other.read_text()) if other.exists() else {'status':'missing'}
        print('FINAL EXTENDED REPLAY GATE |',inter['status'],flush=True)
        sys.exit(0 if obj['status']=='passed' and inter['status']=='passed' else 1)
        PY_FIDELITY_GATE

  deploy_pages:
    name: Publish static evidence viewer to GitHub Pages
    needs: feasibility
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
      contents: read
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy static site
        id: deployment
        uses: actions/deploy-pages@v4

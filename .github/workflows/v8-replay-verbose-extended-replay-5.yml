           t.nodes.forEach((n,j)=>{const cx=x(pp[j]),cy=y(i),selected=t.id===app.trace&&j===app.index,match=!query||JSON.stringify(n).toLowerCase().includes(query);if(match)matches++;
             const g=sv("g",{class:"node",tabindex:0,role:"button","aria-label":`${t.label}: ${n.label}, ${n.status}`,opacity:match?1:.16,"data-event":n.id});const color=n.status==="failed"?COLORS.failure:COLORS[n.kind]||COLORS.event;
             if(selected){g.append(sv("circle",{cx,cy,r:14,fill:"#52dec61a",stroke:"#e8fff7","stroke-width":1.3}));graph.append(sv("line",{x1:cx,x2:cx,y1:29,y2:height-20,stroke:"#91d9cd","stroke-dasharray":"2 6",opacity:.5}));}
             if(n.kind==="checkpoint")g.append(sv("rect",{x:cx-6,y:cy-6,width:12,height:12,rx:1,transform:`rotate(45 ${cx} ${cy})`,fill:color,stroke:"#101824","stroke-width":1.5}));

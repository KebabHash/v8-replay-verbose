          $("dataBadge").textContent=d.synthetic?"SYNTHETIC DEMONSTRATION":d.traces.length?"RECORDED EVIDENCE":"NO EVIDENCE";$("dataBadge").className="pill "+(d.synthetic?"warn":d.traces.length?"good":"warn");

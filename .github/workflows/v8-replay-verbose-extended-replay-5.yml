                self.assertTrue(all(evidence['checks'].values()))
                self.assertEqual(evidence['target_inode'],400)
                saved=json.loads((self.a.root/'network-live.json').read_text())
                self.assertEqual(saved,evidence)

            def test_06_reject_host_namespace(self):
                self.a.keeper_inode=self.a.host_inode
                with self.assertRaises(RuntimeError):self.g.start()

            def test_07_reject_external_interface(self):
                self.a.links.append({'ifname':'eth0'})
                with self.assertRaises(RuntimeError):self.g.start()

            def test_08_reject_ipv4_gateway(self):
                self.a.routes4=[{'dev':'lo','dst':'default','gateway':'10.0.0.1'}]
                with self.assertRaises(RuntimeError):self.g.start()

            def test_09_reject_ipv6_gateway(self):
                self.a.routes6=[{'dev':'eth0','dst':'default','gateway':'fe80::1'}]
                with self.assertRaises(RuntimeError):self.g.start()

            def test_10_reject_keeper_exit(self):
                self.g.start();self.a.keeper_running=False

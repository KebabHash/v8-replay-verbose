            def test_24_classify_specific_error(self):
                d=classify_restore_error('bind-mount /proc/0/ns/net -> /var/run/docker/netns/a: no such file')
                self.assertEqual(d['code'],'docker_network_namespace_pid_zero')
                self.assertIn('50750',d['reference'])

            def test_25_other_errors_not_mislabeled(self):
                self.assertEqual(classify_restore_error('criu restore failure')['code'],'runtime_restore_failed')

            def test_26_reject_bad_filename(self):
                with self.assertRaises(ValueError):self.g.verify('../escape')

            def test_27_route_shapes_and_empty_routes(self):
                self.assertTrue(all(isolation_checks([{'ifname':'lo'}],[],[],400,100).values()))
                for route in [{'dev':'lo','dst':'default'}, {'dev':'lo','multipath':[{}]}, {'dev':'eth0'}, 'bad']:
                    checks=isolation_checks([{'ifname':'lo'}],[route],[],400,100)
                    self.assertFalse(checks['ipv4_routes_loopback_only'])

            def test_28_controller_always_uses_checkpoint_on_restore(self):
                tree=ast.parse(Path(probe.__file__).read_text())
                calls=[n for n in ast.walk(tree) if isinstance(n,ast.Call) and n.args and
                       isinstance(n.args[0],ast.Constant) and n.args[0].value=='checkpoint-restore']
                self.assertEqual(len(calls),1)
                args=calls[0].args[1]
                constants=[n.value for n in args.elts if isinstance(n,ast.Constant)]
                self.assertEqual(constants,['docker','start','--checkpoint'])
                self.assertTrue(any(k.arg=='required' and k.value.value is True for k in calls[0].keywords))

        class OrchestrationTests(unittest.TestCase):
            """Run actual Audit.main with simulated Docker responses and checkpoint markers."""
            def exercise(self, fail_restore=False):
                td=tempfile.TemporaryDirectory();self.addCleanup(td.cleanup)
                root=Path(td.name)

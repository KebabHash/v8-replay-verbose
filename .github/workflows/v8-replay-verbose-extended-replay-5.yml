        """Regression tests of guard/orchestration using a mocked Docker boundary. NOT CRIU proof."""
        import ast
        import contextlib
        import copy
        import io
        import json
        import os
        from pathlib import Path
        import tempfile
        import traceback
        import unittest
        from unittest.mock import patch

        import checkpoint_probe as probe
        from netns_guard import NetworkNamespaceGuard, positive_pid, namespace_inode, isolation_checks, classify_restore_error

        CID = 'a' * 64
        TARGET = 'v8-criu-0123456789ab'
        IMAGE = 'cybergym/v8@sha256:' + 'd' * 64

        class FakeAudit:
            def __init__(self, root):
                self.root = Path(root)
                self.report = {}
                self.commands = []
                self.observations = []
                self.keeper_running = True
                self.keeper_pid = 200
                self.keeper_start = '2026-10-26T00:00:00Z'
                self.restart = 0
                self.keeper_inode = 400
                self.target_inode = 400
                self.host_inode = 100
                self.target_mode = 'container:' + CID
                self.links = [{'ifname':'lo'}]
                self.routes4 = [{'dev':'lo','dst':'127.0.0.0/8'}]
                self.routes6 = [{'dev':'lo','dst':'::1'}]
                self.target_present = True
                self.remove_target_fails = False
                self.inspect_target_fails = False
                self.create_fails = False
                self.keeper_removed = False

            def event(self, kind, **kw):
                self.observations.append({'kind':kind, **kw})

            def require(self, name, condition, detail=None):
                if not condition:
                    raise RuntimeError(name + ': ' + repr(detail))

            def run(self, label, argv, timeout=90, required=False):
                self.commands.append((label, list(argv)))
                rc, out, err = 0, '', ''
                if label == 'netns-keeper-create':
                    if self.create_fails: rc,err=1,'create failed'
                    else: out=CID+'\n'
                elif label == 'netns-inspect':
                    is_target = argv[-1] == TARGET
                    obj = {'Id': 'b'*64 if is_target else CID,
                           'State': {'Running':True if is_target else self.keeper_running,
                                     'Pid':300 if is_target else self.keeper_pid,
                                     'StartedAt': self.keeper_start},
                           'HostConfig': {'NetworkMode':self.target_mode if is_target else 'none'},
                           'RestartCount': self.restart if not is_target else 0}
                    out=json.dumps(obj)
                elif label == 'netns-keeper-inode': out=f'net:[{self.keeper_inode}]\n'
                elif label == 'netns-target-inode': out=f'net:[{self.target_inode}]\n'
                elif label == 'netns-host-inode': out=f'net:[{self.host_inode}]\n'
                elif label == 'netns-links': out=json.dumps(self.links)
                elif label == 'netns-ipv4-routes': out=json.dumps(self.routes4)
                elif label == 'netns-ipv6-routes': out=json.dumps(self.routes6)
                elif label == 'netns-cleanup-target-check':
                    if self.inspect_target_fails: rc,err=1,'Cannot connect to Docker daemon'
                    elif not self.target_present: rc,err=1,'Error: No such object: '+TARGET
                    else: out=json.dumps({'Running':True})
                elif label == 'netns-cleanup-target':
                    if self.remove_target_fails: rc,err=1,'Device busy'
                    else:self.target_present=False
                elif label == 'netns-keeper-cleanup': self.keeper_removed=True
                elif label != 'netns-keeper-start':
                    raise AssertionError('Unmocked command: '+label+' '+repr(argv))
                if required and rc: raise RuntimeError(err)
                return rc,out,err

        class GuardTests(unittest.TestCase):
            def setUp(self):
                self.tmp=tempfile.TemporaryDirectory()
                self.addCleanup(self.tmp.cleanup)
                self.a=FakeAudit(self.tmp.name)
                self.g=NetworkNamespaceGuard(self.a,IMAGE,'0123456789ab')

            def test_01_zero_negative_host_pid_rejected(self):
                for value in [0,1,-1,None,True,'200',2.5]:
                    with self.subTest(value=value), self.assertRaises(ValueError): positive_pid(value)
                self.assertEqual(positive_pid(200),200)

            def test_02_inode_parse(self):
                self.assertEqual(namespace_inode('net:[400]\n'),400)
                for value in ['net:[0]','net:[-1]','pid:[400]','400','net:[4]/bad']:
                    with self.subTest(value=value),self.assertRaises(ValueError):namespace_inode(value)

            def test_03_invalid_suffix(self):
                with self.assertRaises(ValueError):NetworkNamespaceGuard(self.a,IMAGE,'a;rm -rf /')

            def test_04_command_strategy(self):
                mode=self.g.start()
                self.assertEqual(mode,'container:'+CID)
                args=self.a.commands[0][1]
                self.assertEqual(args[args.index('--network')+1],'none')
                self.assertIn('--cap-drop',args)
                self.assertIn('--read-only',args)
                self.assertNotIn('--privileged',args)
                self.assertEqual(self.g.description()['namespace_state_rewound'],False)

            def test_05_valid_initial_and_target_state(self):
